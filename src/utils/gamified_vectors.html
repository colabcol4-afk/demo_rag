it, where \\n                                             is `_partial_`popped from the config ?... Let me outline the steps: ... Hold on, in \\n                  SWE RL                     the current code, `_recursive_`and `_convert_`are popped ... Looking at the code \\n                                             ... CWM (pre-RL)         SWE expert         if OmegaConf.is_dict(node): \\n                                                 convert = node[_Keys. CONVERT] ... Rejection       Hang on, but in the code flow, `_call_target' is called when the node has a \\n       (Joint) SFT           sampling        _target_` ...\"\n}"],["3bd09d99-8158-493e-9030-cf8415b0ef5f","{\n  \"page_content\": \"Let me re-examine each step carefully. Original list: [1, 3, -1, 1, -2, 6] \\n First iteration (i=0, a=0): \\n - Insert nums[0] (1) at position 0. The list becomes [1, 1, 3, -1, 1, -2, 6]. a becomes 1. Second iteration (i=1, a=1): \\n - Insert nums[1] (1) at position 1. The list is now [1, 1, 1, 3, -1, 1, -2, 6]. a becomes 2. Third iteration (i=2, a=2): \\n - Insert nums[2] (1) at position 2. The list becomes [1, 1, 1, 1, 3, -1, 1, -2, 6]. a becomes 3. Fourth iteration (i=3, a=3): \\n - Insert nums[3] (3) at position 3. The list is [1, 1, 1, 1, 3, 3, -1, 1, -2, 6]. a becomes 4. Fifth iteration (i=4, a=4): \\n - Insert nums[4] (-1) at position 4. The list becomes [1, 1, 1, 1, 3, -1, 3, -1, 1, -2, 6]. a becomes 5. Sixth iteration (i=5, a=5): \\n - Insert nums[5] (1) at position 5. The list is [1, 1, 1, 1, 3, 1, -1, 3, -1, 1, -2, 6]. a becomes 6. Yes, that seems correct.\",\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.366668\",\n    \"total_chars\": 866,\n    \"chunk_file\": \"286.txt\",\n    \"chunk_number\": 286\n  }\n}"],["3d5e4e81-9e96-498c-a7ba-1b15ad537380","{\n  \"page_content\": \"Table 5 SWE-bench Verified resolve rates for alter- Table 6 Results on Aider Polyglot for CWM and baselines \\nnative agentic harnesses are lower than the 53.9% from the official leaderboard. pass@1 achieved with our approach, but performance \\nremains reasonable across the board. Model                        Format     Pass 1@2 (%) \\n                                                     03-pro (high)                Diff       84.9 \\n Harness          Configuration Resolve Rate (%)     DeepSeek R1 (0528)           Diff       71.4 \\n Mini-SWE-Agent   250 turns               37.6       Qwen3 235B A22B diff, no think Diff     59.6 \\n                                                                                  Diff       59.1 \\n OpenHands        40 turns                36.0       Kimi K2 \\n                  128 turns                42.6      gpt-oss-120b (high)          Diff       41.8 \\n                                                                                  Diff       40.0 \\n                  500 turns                40.8      Qwen3-32B \\n                                                     Gemini 2.0 Pro exp-02-05     Whole File 35.6 \\n                                                     CWM                          Whole File 35.1 \\n Ours (bash-only) 128 turns               42.1       Grok 3 Mini Beta (low)       Whole File 34.7 \\n Ours             128 turns               53.9       o1-mini-2024-09-12           Whole File 32.9 \\n                                                     gpt-4.1-mini                 Diff       27.1\",\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"144.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.314284\",\n    \"chunk_number\": 144,\n    \"total_chars\": 1546\n  }\n}"],["3de71a6b-e6df-4dc7-8c75-8c35f0445060","{\n  \"metadata\": {\n    \"total_chars\": 743,\n    \"chunk_file\": \"126.txt\",\n    \"chunk_number\": 126,\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.306520\"\n  },\n  \"page_content\": \"activation_memory_budget \u003c 1. 21 \\n\u003c\u003c\u003c\\f\\n\\n                         Reasoning                 Observation \\n  . start                                                                           ... Tokens \\n                                              step   Reward \\n Prompt                   Action                                                    ... Rewards \\n                                                    Extra info \\n                                                                                    ... Log probs \\n             Agent       Text Tool    Environment   Last action \\n                                                                                  Trajectory \\n                                                     Transition\"\n}"],["3e16220d-fbc1-4fb8-a4c2-a81b4de1fc81","{\n  \"page_content\": \"To achieve the scale required for our dataset, we run on an internal sandboxing platform to execute approxi- \\nmately 500 repositories in parallel within secure, isolated virtual environments. 53 \\n\u003c\u003c\u003c\\f\\n\\n E     Hyper-parameter scaling laws \\n\\n E.1    Derivation of per-token compute formula \\n Consider a transformer model with hidden dimension d, sequence length S, batch size B, and L layers. Linear layers.\",\n  \"metadata\": {\n    \"chunk_file\": \"329.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.381020\",\n    \"chunk_number\": 329,\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 405\n  }\n}"],["3e2977f3-366c-43c4-b9b4-29781cd6e7a0","{\n  \"metadata\": {\n    \"total_chars\": 931,\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"117.txt\",\n    \"chunk_number\": 117,\n    \"processed_date\": \"2025-12-17T04:00:35.303437\"\n  },\n  \"page_content\": \"Length reward scheduling. In both the code and mathematics environments, we allow context lengths of \\nup to 64 k. We observe that, at the start of RL training, the model rapidly increases its response length, \\nleading to inefficient token usage. To address this, we penalize the reward for correct but overlong solutions \\nsimilar to DAPO (Yu et al., 2025), but gradually phase out this penalty over training. Specifically, we linearly \\ninterpolate the reward between 1 and -1 for correct answers with a length that exceeds a soft maximum (8k \\nat the beginning of training) but is lower than the hard maximum of 64 k. This provides a dense reward signal \\nto the model that incentivizes it to reduce its response length, while still providing a positive signal when the \\nanswer is correct. During training, we gradually increase the soft maximum in a continuous manner until it is \\nequal to the hard maximum after 10k training steps.\"\n}"],["401d0943-28af-49b3-8ab2-bca4415c7a67","{\n  \"metadata\": {\n    \"chunk_file\": \"101.txt\",\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.296797\",\n    \"total_chars\": 1388,\n    \"chunk_number\": 101\n  },\n  \"page_content\": \"The code solution passes all unit tests within the specified time and memory limits. We execute the \\n      unit tests in parallel using an internal code execution service on remote machines. Data sourcing and filtering. We source coding problems from various programming contest websites. A problem \\n typically consists of a problem description, limitations on the input and output domains, memory and time \\n limits, and input-output examples. In addition, each problem comes with a set of tests that we use to verify \\n the correctness of candidate solutions: a solution is considered correct only if it produces the expected output \\nfor any given test input. We decontaminate the coding problems against test benchmarks and de-duplicate them to ensure that each \\n training problem is unique. In both cases, we use MinHash-based similarity detection6, applying word- or \\n character-based matching depending on the length of each document. This process ensures the integrity of \\n our evaluations, which is especially important for code generation and mathematical problems, where data \\n contamination can significantly affect performance metrics. We use Llama-3.3-70B-Instruct to identify and remove poorly posed problems, such as those containing \\n gibberish, missing or truncated problem statements, or lacking input\u002foutput descriptions. We do not apply \\n any difficulty-based filtering.\"\n}"],["405741db-7727-40f0-a81b-7ec5a42bf021","{\n  \"metadata\": {\n    \"chunk_number\": 264,\n    \"chunk_file\": \"264.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.358956\",\n    \"total_chars\": 371,\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"use json. dumps, but these seem to be for different purposes (compiling JSON paths, etc.). However, if these are part of the serialization process for JSONField values, they might also \\n need to include ensure_ascii=False to ensure consistent behavior. But without more context, it's harder to say. The main issue is the admin display, which is handled by get_prep_value.\"\n}"],["40c5fb92-fbfc-4ef9-947e-c30fd82acf09","{\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"47.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.274848\",\n    \"chunk_number\": 47,\n    \"total_chars\": 1512\n  },\n  \"page_content\": \"We indicate the entry point of the execution trace with a # \u003c\u003c START_OF_TRACE marker. def f(a,b): \\n     y = a \\n    for i in range(b): \\n        y += y * i \\n     return y \\n def main(): # \u003c\u003c START_OF_TRACE \\n     return f(1,3) \\n \u003c| frame_sep|\u003e\u003c|call_sep|\u003e{}\u003c|action_sep|\u003edef main(): # \u003c\u003c START_OF_TRACE \\n \u003c| frame_sep|\u003e\u003c|line_sep|\u003e{}\u003c|action_sep|\u003e return f(1,3) \\n \u003c| frame_sep|\u003e\u003c|call_sep|\u003e{\\\"a\\\": \\\"1\\\", \\\"b\\\": \\\"3\\\"}\u003c|action_sep|\u003edef f(a,b): \\n \u003c| frame_sep|\u003e\u003c|line_sep|\u003e{\\\"a\\\": \\\" .. \\\", \\\"b\\\": \\\" .. \\\"}\u003c|action_sep|\u003e y = a \\n \u003c| frame_sep|\u003e\u003c|line_sep|\u003e{\\\"a\\\": \\\" .. \\\", \\\"b\\\": \\\" .. \\\", \\\"y\\\": \\\"1\\\"}\u003c|action_sep|\u003e for i in range(b): \\n \u003c| frame_sep|\u003e\u003c|line_sep|\u003e{\\\"a\\\": \\\" .. \\\", \\\"b\\\": \\\" .. \\\", \\\"y\\\": \\\" .. \\\", \\\"i\\\": \\\"0\\\"}\u003c|action_sep|\u003e y += y * i \\n \u003c| frame_sep|\u003e\u003c|line_sep|\u003e{\\\"a\\\": \\\" .. \\\", \\\"b\\\": \\\" .. \\\", \\\"y\\\": \\\" .. \\\", \\\"i\\\": \\\" .. \\\"}\u003c|action_sep|\u003e for i in range(b): \\n \u003c| frame_sep|\u003e\u003c|line_sep|\u003e{\\\"a\\\": \\\" .. \\\", \\\"b\\\": \\\" .. \\\", \\\"y\\\": \\\" .. \\\", \\\"i\\\": \\\"1\\\"}\u003c|action_sep|\u003e y += y * i \\n \u003c| frame_sep|\u003e\u003c|line_sep|\u003e{\\\"a\\\": \\\" .. \\\", \\\"b\\\": \\\" .. \\\", \\\"y\\\": \\\"2\\\", \\\"i\\\": \\\" .. \\\"}\u003c|action_sep|\u003e for i in range(b): \\n \u003c| frame_sep|\u003e\u003c|line_sep|\u003e{\\\"a\\\": \\\" .. \\\", \\\"b\\\": \\\" .. \\\", \\\"y\\\": \\\" .. \\\", \\\"i\\\": \\\"2\\\"}\u003c|action_sep|\u003e y += y * i \\n \u003c| frame_sep|\u003e\u003c|line_sep|\u003e{\\\"a\\\": \\\" .. \\\", \\\"b\\\": \\\" .. \\\", \\\"y\\\": \\\"6\\\", \\\"i\\\": \\\" .. \\\"}\u003c|action_sep|\u003e for i in range(b): \\n \u003c| frame_sep|\u003e\u003c|line_sep|\u003e{\\\"a\\\": \\\" .. \\\", \\\"b\\\": \\\" .. \\\", \\\"y\\\": \\\" .. \\\", \\\"i\\\": \\\" .. \\\"}\u003c|action_sep|\u003e return y \\n \u003c| frame_sep|\u003e\u003c|return_sep|\u003e\u003c| action_sep|\u003e return y \\n \u003c|arg_sep|\u003e\\\"6\\\"\u003c|frame_sep|\u003e\u003c|return_sep|\u003e\u003c| action_sep|\u003e return f(1,3) \\n \u003c| arg_sep|\u003e\\\"6\\\"\u003c|frame_sep|\u003e\"\n}"],["41b7af07-a38c-4bbc-9efb-8f32ad36393c","{\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.378885\",\n    \"total_chars\": 139,\n    \"chunk_file\": \"323.txt\",\n    \"chunk_number\": 323,\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"After \\n\\nemitting a reasoning trace, which considers behavior on several specific inputs, CWM correctly predicts termination on \\nall inputs.\"\n}"],["422251dd-e949-439f-97ee-208c1644c555","{\n  \"page_content\": \"Constant             CWM                      Qwen3-32B           Llama-3-70B \\n                      T      Direct   COT   Reasoning    Direct COT     Reasoning   Direct COT \\n      pass@1         0.5      0.37    0.55     0.94       0.49   0.68     0.94       0.43    0.48 \\n\\nWe propose HaltEval-prelim, a novel benchmark obtained by automatically translating C programs with \\n termination annotations into Python using LLaMA-3-70B via few-shot prompting. The C programs are sourced \\n from the International Competition on Software Verification (SVCOMP) and the Termination Problems \\n Database (TPDB).13 Each original problem comes with termination\u002fnon-termination annotations, which we \\n manually verify are preserved during the Python translation phase and otherwise discard. We obtained a \\n balanced dataset consisting of 115 terminating (T) and 115 non-terminating (NT) Python programs.\",\n  \"metadata\": {\n    \"chunk_file\": \"157.txt\",\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 889,\n    \"processed_date\": \"2025-12-17T04:00:35.319249\",\n    \"chunk_number\": 157\n  }\n}"],["42fd918b-0881-48c8-a271-2f06e392f374","{\n  \"metadata\": {\n    \"chunk_number\": 170,\n    \"processed_date\": \"2025-12-17T04:00:35.324082\",\n    \"total_chars\": 758,\n    \"chunk_file\": \"170.txt\",\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"Performance is evaluated by the proportion of \\nfiles for which the model reproduces the target version exactly. We compare CWM to DeepSeek-R1 0528, \\nClaude Sonnet 4 (Anthropic, 2025), Gemini 2.5 Pro 06-05 (Comanici et al., 2025), Kimi K2, GPT-5, and \\ngpt-oss-120B. Qwen3-32B is not on the leaderboard and has a shorter native context length. For LoCoDiff, the results in Figure 18b show that, while all models suffer a degradation in performance as the \\nsequence length increases, CWM provides better performance than DeepSeek-R1 0528 and gpt-oss-120B and \\nis competitive with large scale commercial models (e.g., GPT-5 and Gemini 2.5 Pro) on both short and long \\nsequences, with a significant gap to Claude Sonnet 4 only. We present results for RULER in \\u00a7J.\"\n}"],["447bb680-378f-41f7-98da-9d26c0dc4c6c","{\n  \"metadata\": {\n    \"total_chars\": 905,\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 301,\n    \"chunk_file\": \"301.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.371572\"\n  },\n  \"page_content\": \"===== SESSION START ===== \\n  -\u003e def f(c): \\n \u003e\u003e print \\n {' c' : \\\"'r' \\\"} \\n \u003e\u003e next \\n  -\u003e   word = \\\"strawberry\\\" \\n  \u003e\u003e next \\n  -\u003e   num = count_letters(word, \\n    step \\n -\u003e def count_letters(s, letter) : \\n  \u003e\u003e next \\n  -\u003e   n = 0 \\n \u003e\u003e next \\n  -\u003e   for c in s: \\n \u003e\u003e next \\n  -\u003e      n += int(c == letter) \\n    print \\n {'s' : \\\" strawberry ' \\\", ' letter' : \\\"' r'\\\", 'n' : '0', 'c' : \\\"'s'\\\"} \\n  \u003e\u003e next \\n  -\u003e   for c in s: \\n  \u003e\u003e next \\n  -\u003e      n += int(c == letter) \\n \u003e\u003e print \\n  {'s' : \\\" strawberry ' \\\" , 'letter' : \\\" 'r' \\\", 'n' : '0', 'c': \\\"'t' \\\"} \\n \u003e\u003e out \\n  -\u003e   ans = format_answer(word, \\\"r\\\", num) \\n  \u003e\u003e next \\n  -\u003e   return ans \\n \u003e\u003e next \\n  -\u003e   return ans \\n  'Found 0003 occurrences of the letter r in strawberry' \\n\\n Figure B.25 Interactive Python code debugging with CWM. As a show-case of CWM's execution tracing capabilities \\n (\\u00a72.2), we present an interactive debugger to steer execution trace predictions.\"\n}"],["449deee6-0f81-4381-b79e-664c189d33cf","{\n  \"metadata\": {\n    \"total_chars\": 1078,\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 181,\n    \"chunk_file\": \"181.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.327858\"\n  },\n  \"page_content\": \"Lastly, while we are excited about the opportunities that world modeling affords, these are only our first \\nsteps in this direction. Our code world modeling dataset collection efforts focus on explicit Python execution, \\nand expanding this set to include other programming languages or symbolic execution is left for future \\nwork. Robust ways to leverage world model knowledge to improve performance across a variety of tasks via \\nprompting or fine tuning is a ripe area for research. Similarly, planning with code world models, either using \\nformal inference frameworks or informally during reasoning, is an exciting direction for research and core to \\nour motivation for building CWM in the first place. In some sense, one might compare the current state of \\nCWMs to LLMs before CoT (Wei et al., 2023): the capabilities are there, we just need to find out how to \\nmake the most of them. 18 Code World Model Preparedness Report, available at https: \u002f\u002fai.meta. com\u002fresearch\u002fpublications\u002fcwm-preparedness. 19 See https:\u002f\u002fwww.llama.com\u002fllama-protections. 32 \\n\u003c\u003c\u003c\\f\\n\\n9    Conclusion\"\n}"],["44d56e3b-b8e6-4db9-a819-e74f3f498cdd","{\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.291763\",\n    \"chunk_number\": 89,\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 401,\n    \"chunk_file\": \"89.txt\"\n  },\n  \"page_content\": \"\\\", which it follows in its subsequent \\nactions. Notable differences from prior designs are that (1) our agent must generate the complete end-to-end \\npatch directly via git diff rather than relying on task-specific post-processing, and (2) it must also produce \\na summary explaining how it resolves the issue, to improve clarity and usability. We also retain all reasoning \\nturns for logical coherence.\"\n}"],["45128910-c0c5-449e-abae-24429749bf57","{\n  \"page_content\": \"Let's verify this by putting the code into a trace context and call the function in the main() function and then trace the execution of the main function. We indicate the entry point of the execution trace with a # \u003c\u003c START_OF_TRACE marker. def f(d, k): \\n     new_d = {} \\n     for key, val in d.items(): \\n        if key \u003c k: \\n           new_d[key] = val \\n     return new_d \\n def main(): # \u003c\u003c START_OF_TRACE \\n    return f({1: 2, 2: 4, 3: 3}, 3) \\n \u003c| frame_sep|\u003e\u003c|call_sep|\u003e{}\u003c|action_sep|\u003edef main(): # \u003c\u003c START_OF_TRACE \\n \u003c| frame_sep|\u003e\u003c|line_sep|\u003e{}\u003c|action_sep|\u003e return f({1: 2, 2: 4, 3: 3}, 3) \\n \u003c|frame_sep|\u003e\u003c|call_sep|\u003e{\\\"d\\\": \\\"{1: 2, 2: 4, 3: 3}\\\", \\\"k\\\": \\\"3\\\"}\u003c|action_sep|\u003edef f(d, k): \\n \u003c| frame_sep|\u003e\u003c|line_sep|\u003e{\\\"d\\\": \\\" .. \\\", \\\"k\\\": \\\" .. \\\"}\u003c|action_sep|\u003e new_d = {} \\n \u003c| frame_sep|\u003e\u003c|line_sep|\u003e{\\\"d\\\": \\\" .. \\\", \\\"k\\\": \\\" .. \\\", \\\"new_d\\\": \\\"{}\\\"}\u003c|action_sep|\u003e for key, val in d.items(): \\n \u003c| frame_sep|\u003e\u003c|line_sep|\u003e{\\\"d\\\": \\\" .. \\\", \\\"k\\\": \\\" .. \\\", \\\"new_d\\\": \\\" .. \\\", \\\"key\\\": \\\"1\\\", \\\"val\\\": \\\"2\\\"}\u003c|action_sep|\u003e if key \u003c k: \\n \u003c| frame_sep|\u003e\u003c|line_sep|\u003e{\\\"d\\\": \\\" .. \\\", \\\"k\\\": \\\" .. \\\", \\\"new_d\\\": \\\" .. \\\", \\\"key\\\": \\\" .. \\\", \\\"val\\\": \\\" .. \\\"}\u003c|action_sep|\u003e new_d[key] = val \\n \u003c| frame_sep|\u003e\u003c|line_sep|\u003e{\\\"d\\\": \\\" .. \\\", \\\"k\\\": \\\" .. \\\", \\\"new_d\\\": \\\"{1: 2}\\\", \\\"key\\\": \\\" .. \\\", \\\"val\\\": \\\" .. \\\"}\u003c|action_sep|\u003e for key, val in d.items():\",\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 51,\n    \"chunk_file\": \"51.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.276264\",\n    \"total_chars\": 1278\n  }\n}"],["45b952a3-8761-4c65-813c-a411b9c5fc10","{\n  \"page_content\": \"File django\u002fdb\u002fmodels\u002ffields\u002fjson.py has been successfully updated at line 81 and now contains 521 lines. The surrounding lines after the edit are shown below: \\n     73          try: \\n     74              return json.\",\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 217,\n    \"chunk_number\": 267,\n    \"chunk_file\": \"267.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.360172\"\n  }\n}"],["460adc9c-0dcc-43b8-b0b0-bcda45d19848","{\n  \"metadata\": {\n    \"total_chars\": 481,\n    \"chunk_file\": \"34.txt\",\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.270512\",\n    \"chunk_number\": 34\n  },\n  \"page_content\": \"The definition says that between every pair of the same characters, there must be an even \\n number of characters. So, for example, in \\\"abba\\\", each 'a' is at positions 0 and 3. The distance between them is 3-0 = 3, but the number of characters in between is 3-0-1 = 2, which is \\n even. So that works. But in \\\"aabba\\\", the first two 'a's are at positions 0 and 1. The number of characters between them is 0, which is even. Let me double check. But the example says \\n it's not correct.\"\n}"],["46588d9c-90af-4f9e-8751-051c0f63dfb3","{\n  \"page_content\": \"5.3.4    Mathematics \\n\\nDesign. Although not the main focus on this research work, we consider mathematical reasoning as another \\nRL task to further strengthen and generalize CWM's reasoning capabilities. We restrict these problems to \\nquestions that have definitive and easy to verify answers. Both the questions and answers are formulated in \\nLATEX, similar to much of the math content found on the web. We also include a tool-enabled version of the math environment, adhering to the format described in \\u00a7H. Here, \\nthe agent may invoke the Python interpreter with custom code. Standard output and error contents will form \\nthe next observation and the agent is prompted to continue solving the task. We impose a limit of 4 tool calls \\nper episode and a 10s timeout per call. The prompt template shares its system prompt with the coding environment but differs in the user prompt. As shown in Figure 10, the user prompt instructs the agent to place the final answer inside a LATEX box. Reward.\",\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"105.txt\",\n    \"total_chars\": 993,\n    \"chunk_number\": 105,\n    \"processed_date\": \"2025-12-17T04:00:35.298787\"\n  }\n}"],["46a09af5-ee54-4296-901e-10aa8fc82f74","{\n  \"page_content\": \"Wasi Uddin Ahmad, Sean Narenthiran, Somshubra Majumdar, Aleksander Ficek, Siddhartha Jain, Jocelyn Huang, \\n  Vahid Noroozi, and Boris Ginsburg. Opencodereasoning: Advancing data distillation for competitive coding. ar Xiv \\n  preprint ar Xiv:2504.01943, 2025. Aider Team. aider, 2025. https:\u002f\u002fgithub.com\u002fAider-AI\u002faider. GitHub repository; accessed 2025-08-18.\",\n  \"metadata\": {\n    \"total_chars\": 358,\n    \"chunk_number\": 185,\n    \"chunk_file\": \"185.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.329402\",\n    \"source\": \"CWM-Meta\"\n  }\n}"],["46e6bfa4-5144-414b-b4b9-bba45557a02e","{\n  \"page_content\": \"Figure 12 Async RL systems overview. Worker nodes generate trajectory batches from multiple RL environments and \\nsend them to trainer nodes via a transfer queue. Trainer nodes form training batches either from worker-provided data \\nor the rehearsal mix, packing trajectories up to the maximum context length for a single gradient update. Environment \\nexecution and verification can occur locally on worker nodes or remotely on another cluster or in the cloud. 5.4   Joint RL \\nFinally, we train CWM using all of the above-mentioned RL tasks. As shown in Figure 12, joint RL uses \\nour asynchronous RL infrastructure: worker nodes generate G trajectories per prompt from multiple RL \\nenvironments and send them to trainer nodes through the data transfer queue. The trainer nodes then \\nform training batches either from these worker-provided batches or directly from the SFT datamix (\\u00a75.1) for \\nrehearsal. We refer to \\u00a76.2 for further detail on engineering aspects of our asynchronous RL infrastructure.\",\n  \"metadata\": {\n    \"total_chars\": 999,\n    \"chunk_number\": 110,\n    \"chunk_file\": \"110.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.300572\",\n    \"source\": \"CWM-Meta\"\n  }\n}"],["4763a75d-ceb7-4b07-b649-cb4a52193ad6","{\n  \"metadata\": {\n    \"total_chars\": 855,\n    \"chunk_number\": 191,\n    \"processed_date\": \"2025-12-17T04:00:35.331493\",\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"191.txt\"\n  },\n  \"page_content\": \"Xiao Bi, Deli Chen, Guanting Chen, Shanhuang Chen, Damai Dai, Chengqi Deng, Honghui Ding, Kai Dong, Qiushi Du, \\n  Zhe Fu, et al. Deepseek Ilm: Scaling open-source language models with longtermism. ar Xiv preprint ar Xiv:2401.02954, \\n  2024. Alexander Bick, Adam Blandin, and David J Deming. The rapid adoption of generative ai. Technical report, National \\n  Bureau of Economic Research, 2024. Yonatan Bisk, Rowan Zellers, Ronan Le Bras, Jianfeng Gao, and Yejin Choi. PIQA: reasoning about physical \\n  commonsense in natural language. In The Thirty-Fourth AAAI Conference on Artificial Intelligence, AAAI \\n  2020, The Thirty-Second Innovative Applications of Artificial Intelligence Conference, IAAI 2020, The Tenth AAAI \\n  Symposium on Educational Advances in Artificial Intelligence, EAAI 2020, New York, NY, USA, February 7-12, 2020, \\n  pages 7432-7439.\"\n}"],["48f7eea1-c915-4bb6-a04b-cb967133693a","{\n  \"metadata\": {\n    \"chunk_number\": 121,\n    \"chunk_file\": \"121.txt\",\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.304736\",\n    \"total_chars\": 1024\n  },\n  \"page_content\": \"Table 3 Summary of the training setup for the different CWM training stages on H100 GPUs. Phase                    Seq. Length     Batch size    # GPUs     Shards \\n                                                                               DP   TP \\n             Pre-training                     8 k         8.4M         2048   1024    2 \\n             Mid-training                   131 k        33.6M         2048    256    8 \\n             Supervised Fine-tuning          32 k         2.1M          256     32    8 \\n             Reinforcement Learning         131 k 8.4M\u002f16.8M     2560\u002f4608      64    8 \\n\\nReducing communication overhead for tensor parallelism. We reduced the communication overhead of tensor \\nparallelism (which we implement as sequence parallelism) by more-effectively overlapping it with computation \\nvia decomposition and micropipelining, using PyTorch's Asynchronous Tensor Parallel (Async-TP) feature7, \\nderived from xFormers (Lefaudeux et al., 2022) and originally inspired by Wang et al. (2022a).\"\n}"],["4944f57b-56ce-43f3-a73f-c975d67e9365","{\n  \"page_content\": \"C0.231 \\n\\nSee SE for additional details. 5   Post-training: SFT, RL algorithms and environments \\n\\nOur post-training phase improves CWM's ability to solve complex programming-related problems with \\nreasoning, building on the internal code world model learned during earlier training stages. Concretely, \\nwe first perform supervised finetuning (SFT) to improve both reasoning and general instruction-following \\n capabilities. We then carry out large-scale multi-task multi-turn reinforcement learning on coding contests, \\nmath questions, and software engineering environments. We describe the SFT stage, our RL algorithms, data \\nand environments, and detail our joint RL training recipe. As we do not intend to develop a general-purpose \\nchatbot we therefore deliberately omit an RLHF stage.\",\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.283328\",\n    \"chunk_file\": \"69.txt\",\n    \"total_chars\": 788,\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 69\n  }\n}"],["4993de49-c365-4b8e-ae53-d7c8e2b2edb7","{\n  \"metadata\": {\n    \"chunk_number\": 70,\n    \"chunk_file\": \"70.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.283726\",\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 919\n  },\n  \"page_content\": \"5.1 SFT \\nWe perform SFT for 100 B tokens, distributed across 50 k steps with a global batch size of 2 M tokens and 32 k \\ntoken sequence lengths. We share optimization hyperparameters with pre-training but change the learning \\nrate schedule to 1 k steps of linear warmup followed by a constant learning rate of 1 x 10-5. In preliminary \\nexperiments, keeping a constant learning rate achieved similar evaluation metrics to annealing with cosine \\nschedules while enabling high learning rate training during RL. We further observed a performance decrease \\nwhen SFT-ing at longer sequence lengths. We suspect this is due to the configuration of our dataloader which \\n always sequence-packs inputs (per data-parallel rank and local batch) from a single dataset. For very small \\n datasets and large context sizes, this reduces the amount of unique steps such datasets can be observed, which \\nmay negatively affect performance.\"\n}"],["4a8193bf-7e70-43d3-b3d0-ea4f45b092b6","{\n  \"page_content\": \"47 \\n\u003c\u003c\u003c\\f\\n\\n \u003c| begin_of_text|\u003e\u003c|trace_context_start|\u003e \\n def f(nums): \\n    a = 0 \\n    for i in range(len(nums)): \\n        nums.insert(i, nums[a]) \\n        a += 1 \\n     return nums \\n\\n def main(): # \u003c\u003c START_OF_TRACE \\n     return f([1, 3, -1, 1, -2, 6]) \\n \u003c| [X] frame_sep|\u003e\u003c|call_sep|\u003e{}\u003c|action_sep|\u003edef [X] main(): # \u003c\u003c START_OF_TRACE \\n \u003c| [X] frame_sep |\u003e \\n --- END OF PROMPT --- \\n \u003c|line_sep|\u003e{}\u003c|action_sep|\u003e [X] return f([1, 3, -1, 1, -2, 6]) \\n \u003c| [X] frame_sep|\u003e\u003c|call_sep|\u003e{\\\"nums\\\": [X] [X] \\\"[1, 3, -1, 1, -2, 6]\\\"}\u003c|action_sep|\u003edef f (nums) : \\n \u003c| [X] frame_sep|\u003e\u003c|line_sep|\u003e{\\\"nums\\\": [X] [X] \\\" .. \\\"}\u003c|action_sep|\u003e a = 0 \\n \u003c| frame_sep|\u003e\u003c|line_sep|\u003e{\\\"nums\\\": [X] [X] \\\" ..\",\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.363010\",\n    \"total_chars\": 673,\n    \"chunk_file\": \"276.txt\",\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 276\n  }\n}"],["4ba8b5e7-0534-4866-9be7-b8b1bccfc346","{\n  \"page_content\": \"Data \\nfrom ForagerAgent, on the other hand, is large scale and included already during mid-training, helping shape \\ninternal representations ahead of post-training. CWM uses a dense, decoder-only Transformer architecture (Vaswani et al., 2017; Radford et al., 2018) with \\n32 B parameters, interleaved sliding window attention supporting up to 131 k tokens context size, and is \\ntrained over pre-, mid-, and post-training phases (see Figure 1). With quantization, inference with CWM can \\nbe performed on a single 80 GB NVIDIA H100. Beyond world modeling capabilities, CWM achieves strong \\nperformance on general and agentic coding and reasoning tasks relative to other open-weights models of \\ncomparable size: it reaches pass@1 scores of 65.8 % on SWE-bench Verified (with test-time scaling; see Figure 2), \\n68.6% on LiveCodeBench-v5, 96.6% on Math-500, 76.0% on AIME 2024, and 94.3% on CruxEval Output. First and foremost, the release of CWM is meant to enable novel research on improving code generation \\nwith world modeling. We are excited by this vision and our report provides early supportive evidence: we \\ngive examples of how world models can benefit agentic coding, enable step-by-step simulation of Python \\ncode execution, and show early results of how reasoning can benefit from the latter. However, we believe the \\nbest is yet to come and hope to join forces with the open source research community to explore how world \\nmodels can be used to leverage reasoning and planning to improve code generation. To this end, we release\",\n  \"metadata\": {\n    \"total_chars\": 1537,\n    \"chunk_file\": \"8.txt\",\n    \"chunk_number\": 8,\n    \"processed_date\": \"2025-12-17T04:00:35.259137\",\n    \"source\": \"CWM-Meta\"\n  }\n}"],["4de279cb-3f16-4abd-a95b-47cceb209be6","{\n  \"page_content\": \"index(value) - len(sequence) \u002f\u002f 3, 0) \\n     result = '' \\n     for j, v in enumerate(sequence[i : ]) : \\n        if v     '+' : \\n            result += value \\n        else: \\n            result += sequence[i + j] \\n     return result\",\n  \"metadata\": {\n    \"chunk_number\": 290,\n    \"chunk_file\": \"290.txt\",\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.367828\",\n    \"total_chars\": 228\n  }\n}"],["4e46c434-e86b-4a1b-99e7-fab1a73529a7","{\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.368513\",\n    \"total_chars\": 673,\n    \"chunk_file\": \"292.txt\",\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 292\n  },\n  \"page_content\": \"[X] | frame_sep [X] line_sep [X] sequence\\\" : \\\" .. \\\", \\\"value\\\": \\\"i\\\" : \\\" \\\" result\\\" : \\\" .. \\\", \\\"j\\\" : \\\" \\\" \\\"v\\\". \\\"}\u003c|action_sep|\u003e [X] result += sequence[i + j] \\n  [X] | frame_sep [X] line_sep [X] sequence\\\": \\\"value\\\":    \\\"i\\\" : \\\" . . \\\" \\\"result\\\": \\\"      : \\\"        : \\\" .. \\\"}\u003c|action_sep|\u003e \\\" for j, v in enumerate(sequence[i : ]) : \\n  [X] | frame_sep [X] line_sep [X] sequence\\\" : \\\"value\\\":              \\\"result\\\": \\\" .. \\\", \\\"j\\\": \\\"2\\\", \\\"v\\\": \\\"'u'\\\"}\u003c|action_sep|\u003e [X] if v == '+' : \\n  [X] frame_sep [X] line_sep [X] sequence\\\": \\\"value\\\":       \\\"i\\\" : \\\"   \\\"result\\\":                         \\\"}\u003c|action_sep|\u003e [X] result += sequence[i + j] \\n  [X] | frame_sep \u003e\u003c| [X] line_sep |\u003e{\\\"sequence\\\" [X] : \\\" . .\"\n}"],["4f520c77-7311-4fd6-b1a9-51ad11d8ce0b","{\n  \"page_content\": \"GPT-oss use a custom subset of 477 problems, while CWM is evaluated on the full set of 500 problems.) \\nas Docker containers, referred to as executable repository images. These images contain a preconfigured envi- \\nronment capable of running repository code and tests without additional setup.\",\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.261706\",\n    \"total_chars\": 292,\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 14,\n    \"chunk_file\": \"14.txt\"\n  }\n}"],["500961a1-51c1-4504-ac24-485f679483ff","{\n  \"metadata\": {\n    \"total_chars\": 732,\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 332,\n    \"chunk_file\": \"332.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.381939\"\n  },\n  \"page_content\": \"Since each of the L layers contains one self-attention block, the per-token cost for attention across all layers is \\n 6SdL. E.2     Quasi-random search for batch size and learning rate \\nTo estimate the optimal batch size (BS) and learning rate (LR) range, and how it evolves with scale, we \\nperformed a quasi-random search using Sobol sequences. At each scale, BS\u002fLR candidates were generated by \\nsampling two-dimensional Sobol sequences and rescaling them according to ranges that increase for BS and \\n decrease for LR as the model scale increases. In Figure E.30, the gray points correspond to all BS\u002fLR candidates evaluated at each scale, while the blue \\npoints indicate those within 1% of the best validation loss at that scale.\"\n}"],["52275aa4-3f5c-4dd2-a1c9-ca8ee7832a92","{\n  \"metadata\": {\n    \"chunk_file\": \"24.txt\",\n    \"total_chars\": 621,\n    \"processed_date\": \"2025-12-17T04:00:35.265937\",\n    \"chunk_number\": 24,\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"We post-process raw traces in two steps. First, we \\\"episodify\\\" our traces, extracting function-level traces from \\nraw pytest traces with configurable stack depth and stochastic step-in probability. When stochastic step-in \\noccurs, function calls are probabilistically included in their parent trace rather than a separate episode to \\nsimulate variable execution depth. In a second step, we then gather and compress the source code context \\nfrom the target repository that is necessary for predicting the observation-action trajectory. To the resulting \\ncontext-trace pair, we then apply the same CWM formatting as before.\"\n}"],["5287cca2-3d9a-4d73-be77-d2f38f312547","{\n  \"page_content\": \"Paulius Micikevicius, Dusan Stosic, Neil Burgess, Marius Cornea, Pradeep Dubey, Richard Grisenthwaite, Sangwon \\n  Ha, Alexander Heinecke, Patrick Judd, John Kamalu, et al. Fp8 formats for deep learning. ar Xiv preprint \\n  ar Xiv:2209.05433, 2022.\",\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"217.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.341045\",\n    \"total_chars\": 246,\n    \"chunk_number\": 217\n  }\n}"],["52e47b63-4250-4804-a54e-5f64e76c3657","{\n  \"page_content\": \"Table 4 Our ablation study reveals a positive impact on performance from introducing GitHub PR trajectory, Python \\nexecution tracing, and ForagerAgent data during mid-training. We report results for CruxEval-output, CruxEval-input, \\nNLLs on oracle SWE-bench Verified (SBV) trajectories, NLLs on agentic SBV trajectories, and SBV pass@1 scores. All results are for 8 B models, jointly pre-trained for 6 T tokens followed by 1 T tokens of mid-training ablation, with \\nSBV pass@1 reported after an additional SFT phase. PRs   Tracing   Forager CruxEval-O1     CruxEval-It Oracle SBV NLL\\u012e    Agentic SBV NLL (32k)|   SBV1 \\n   [X]     [X]       [X]           45.4         44.1               0.64                    0.39     14.6 \\n   [X]     [X]       [X]           44.6         45.8              0.55                     0.37     18.6 \\n   [X]     [X]       [X]           73.9         51.5              0.54                     0.38     18.4 \\n   [X]     [X]       [X]           74.5         54.8              0.54                     0.29    22.1\",\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 1040,\n    \"chunk_file\": \"135.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.310698\",\n    \"chunk_number\": 135\n  }\n}"],["52fd3ffa-28b1-4b7e-9c22-c2a922e876a8","{\n  \"page_content\": \"The system prompt asks for reasoning \\n\\n                                                        16 \\n\u003c\u003c\u003c\\f\\n\\n                 System \\n                 You are a helpful Al assistant. You always reason before responding, using the following format: \\n                 \u003cthink\u003e \\n                 [your internal reasoning] \\n                 \u003c\u002fthink\u003e \\n                 [your external response] \\n                 {optional tool calling instructions}\",\n  \"metadata\": {\n    \"chunk_number\": 98,\n    \"chunk_file\": \"98.txt\",\n    \"total_chars\": 438,\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.295624\"\n  }\n}"],["542eb9d1-435e-442e-8b29-6da39fa34f02","{\n  \"metadata\": {\n    \"chunk_number\": 97,\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 804,\n    \"chunk_file\": \"97.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.295198\"\n  },\n  \"page_content\": \"Design. RL for competitive programming aims to teach the model to write correct programs for challenging \\ntasks and to reason about code and algorithms. Our competitive programming environment presents the \\nproblem to the agent in the first turn and optionally allows follow-up attempts, during which the environment \\nprovides execution feedback. It supports multiple programming languages and provides detailed feedback on \\nsyntax errors, timeouts, and incorrect test outputs. The environment terminates either when the maximum \\nnumber of turns is reached or when the agent produces a correct solution. In the joint RL run, we limit the \\nnumber of attempts to one but allow up to 64 K tokens in responses to enable extensive reasoning. We adapt a lightweight prompt template which is shown in Figure 10.\"\n}"],["55dbe928-c908-4093-95a8-95891ce0bdf5","{\n  \"page_content\": \"return p                                            \u003c|action_sep|\u003e if x%2 == 0: \\n                                                     \u003c | frame_sep | \u003e\u003c | line_sep |\u003e{ \\\" n \\\" : \\\" . . \\\" , \\\" p \\\" : \\\" . . \\\" , \\\" x \\\" : \\\" .\",\n  \"metadata\": {\n    \"chunk_number\": 271,\n    \"processed_date\": \"2025-12-17T04:00:35.361728\",\n    \"chunk_file\": \"271.txt\",\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 215\n  }\n}"],["56335671-fa39-485b-ae7b-fe33dbc96207","{\n  \"metadata\": {\n    \"chunk_file\": \"182.txt\",\n    \"total_chars\": 1522,\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.328332\",\n    \"chunk_number\": 182\n  },\n  \"page_content\": \"32 \\n\u003c\u003c\u003c\\f\\n\\n9    Conclusion \\n\\nOur vision is for Code World Models to bridge the gap between language-level reasoning and executable \\nsemantics. We believe that coding and agentic use cases of LLMs will benefit from having a world model, a \\nlearned transition function between states conditioned on actions. With the release of CWM, we present \\nthe first steps of this vision. Our ablations already show that world modeling data, Python execution \\ntraces, and executable Docker environments can be directly beneficial for downstream task performance. More broadly though, CWM provides a strong test-bed for future research in zero-shot planning, grounded \\nchain-of-thought, and reinforcement learning with sparse, verifiable rewards. Similar to our early results with \\nexecution trace prediction, we believe that the Python tracing world model enables research on reasoning \\nabout code generation, execution, correctness, and verification. World models should improve reinforcement \\nlearning because agents that are already familiar with the dynamics of the environment can focus on learning \\nwhich actions lead to rewards. More research is needed to consistently leverage the benefits of incorporating \\nworld models into LLMs during pre-training across tasks. Ultimately, models that can reason about the \\nconsequences of their actions should be much more efficient in their interactions with the environment which \\nshould allow for scaling the complexity of the tasks they perform. 33 \\n\u003c\u003c\u003c\\f\\n\\nAuthors: Meta FAIR CodeGen Team\"\n}"],["575301f9-b530-4e6c-93cf-eb4325584990","{\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 273,\n    \"total_chars\": 33,\n    \"chunk_file\": \"273.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.362262\"\n  },\n  \"page_content\": \"\\\" , \\\" p \\\" : \\\" . . \\\" , \\\" x \\\" : \\\" .\"\n}"],["5770c026-43ab-42a5-b026-421a43f42d7f","{\n  \"metadata\": {\n    \"chunk_number\": 90,\n    \"processed_date\": \"2025-12-17T04:00:35.292235\",\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 831,\n    \"chunk_file\": \"90.txt\"\n  },\n  \"page_content\": \"Reward. We adopt a hybrid reward for SWE RL. When all the hidden tests pass, the reward is 1. If not, we \\nadopt the patch similarity reward used in the SWE-RL paper (Wei et al., 2025). Unlike the SWE-RL paper, \\nwhich uses a continuous reward value, we apply a discrete and threshold-based design to improve the training \\nstability by avoiding rewarding low-similarity patches. In detail, when the computed similarity is above the \\nthreshold of 0.5, the reward is 0, otherwise, the reward is -1. This reward shaping showed benefits in early \\nablation, because a higher patch similarity incentivizes the model to localize the actual bugs more precisely \\nand to produce a closer fix to the oracle patch. This also helps the model to gain more learning signals from \\ndifficult issues for which it cannot produce any test-passing patch.\"\n}"],["586fb028-4986-44f2-8860-3b822f631adb","{\n  \"page_content\": \"39 \\n\u003c\u003c\u003c\\f\\n\\nKeisuke Sakaguchi, Ronan Le Bras, Chandra Bhagavatula, and Yejin Choi. Winogrande: An adversarial winograd \\n  schema challenge at scale. In The Thirty-Fourth AAAI Conference on Artificial Intelligence, AAAI 2020, The \\n  Thirty-Second Innovative Applications of Artificial Intelligence Conference, IAAI 2020, The Tenth AAAI Symposium \\n  on Educational Advances in Artificial Intelligence, EAAI 2020, New York, NY, USA, February 7-12, 2020, pages \\n  8732-8740. AAAI Press, 2020. doi: 10.1609\u002fAAAI.V34I05.6399. https:\u002f\u002fdoi.org\u002f10.1609\u002faaai.v34i05.6399. John Schulman. Approximating kl divergence, 2020. https:\u002f\u002fjoschu.net\u002fblog\u002fkl-approx.html. John Schulman, Filip Wolski, Prafulla Dhariwal, Alec Radford, and Oleg Klimov. Proximal policy optimization \\n  algorithms. arXiv preprint ar Xiv: 1707.06347, 2017. Zhihong Shao, Peiyi Wang, Qihao Zhu, Runxin Xu, Junxiao Song, Xiao Bi, Haowei Zhang, Mingchuan Zhang, Y. K. Li, Y.\",\n  \"metadata\": {\n    \"total_chars\": 928,\n    \"chunk_number\": 228,\n    \"chunk_file\": \"228.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.345421\",\n    \"source\": \"CWM-Meta\"\n  }\n}"],["591ebcf2-f8a9-4b87-a70b-0217a92908d5","{\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"206.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.336500\",\n    \"total_chars\": 742,\n    \"chunk_number\": 206\n  },\n  \"page_content\": \"Jordan Hoffmann, Sebastian Borgeaud, Arthur Mensch, Elena Buchatskaya, Trevor Cai, Eliza Rutherford, Diego \\n  de Las Casas, Lisa Anne Hendricks, Johannes Welbl, Aidan Clark, et al. Training compute-optimal large language \\n  models. arXiv preprint ar Xiv:2203.15556, 2022. Cheng-Ping Hsieh, Simeng Sun, Samuel Kriman, Shantanu Acharya, Dima Rekesh, Fei Jia, Yang Zhang, and Boris \\n  Ginsburg. Ruler: What's the real context size of your long-context language models? ar Xiv preprint ar Xiv:2404.06654, \\n  2024. Jingcheng Hu, Yinmin Zhang, Qi Han, Daxin Jiang, Xiangyu Zhang, and Heung-Yeung Shum. Open-reasoner-zero: \\n  An open source approach to scaling up reinforcement learning on the base model, 2025. https:\u002f\u002farxiv.org\u002fabs\u002f \\n  2503.24290.\"\n}"],["592cc19c-0243-4d8a-9af9-f5a652950548","{\n  \"page_content\": \"For example, the prompt shown in \\nFigure 8 asks the agent to \\\" ... thoroughly explore the codebase, think hard, and leverage significant execution to \\nverify correctness by writing comprehensive tests to validate your solution ...\",\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"88.txt\",\n    \"total_chars\": 230,\n    \"chunk_number\": 88,\n    \"processed_date\": \"2025-12-17T04:00:35.291416\"\n  }\n}"],["594c978b-73f2-4407-abc7-61f0046326fe","{\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.374502\",\n    \"total_chars\": 1059,\n    \"chunk_number\": 309,\n    \"chunk_file\": \"309.txt\"\n  },\n  \"page_content\": \"\u003c| frame_sep|\u003e\u003c|return_sep|\u003e\u003c|action_sep|\u003e return ans \\n \u003c|arg_sep|\u003e\\\"[9, 6, 1]\\\"\u003c|frame_sep|\u003e\u003c|return_sep|\u003e\u003c|action_sep|\u003ef(2, 3, [1, 5, 6]) # \u003c\u003c START_OF_TRACE \\n \u003c| arg_sep|\u003e\\\"[9, 6, 1]\\\"\u003c|frame_sep|\u003e \\n\\n Okay, the execution trace is correct. Now, I can proceed to extract the code. python \\n def f(n, q, queries): \\n    MOD = 10 ** 9 + 7 \\n    max_x = 3 * n \\n     fact = [1] * (max_x +1) \\n     for i in range(1, max_x + 1): \\n        fact[i] = fact[i - 1] * i % MOD \\n     inv_fact = [1] * (max_x + 1) \\n     inv_fact[max_x] = pow(fact[max_x], MOD - 2, MOD) \\n    for i in range(max_x - 1, -1, -1): \\n        inv_fact[i] = inv_fact[i + 1] * (i + 1) % MOD \\n    def comb(n, k): \\n        if k \u003c 0 or k \u003e n: \\n            return 0 \\n        return fact[n] * inv_fact[k] * inv_fact[n - k] % MOD \\n     total = 0 \\n     for i in range(1, n + 1): \\n        total += 3 * i \\n     ans = [] \\n     for x in queries: \\n        res = 0 \\n        for i in range(1, n + 1): \\n            if 3 * i \u003e= x: \\n               res += comb(3 * i, x) \\n        ans. append(res % MOD) \\n     return ans \\n ...\"\n}"],["5979a376-666e-41ac-a56c-f8faf6957b26","{\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.378352\",\n    \"total_chars\": 71,\n    \"chunk_number\": 321,\n    \"chunk_file\": \"321.txt\"\n  },\n  \"page_content\": \"\u003c\u002fthink\u003e \u003canswer\u003e \\n # T \\n\\nFigure B.28       CWM predicting termination.\"\n}"],["5a9803ba-f01a-4996-8959-094cd6268a9a","{\n  \"metadata\": {\n    \"total_chars\": 1573,\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 31,\n    \"chunk_file\": \"31.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.269568\"\n  },\n  \"page_content\": \"Before introducing the CWM architecture and benchmark results more formally, in this section, we share a \\nfew example generations from the final model that illustrate our excitement for code world modeling. For competitive programming, Figure 4 shows an example where CWM first creates an initial solution after \\nreasoning about the problem statement, then constructs input-output pairs to assess the correctness of its \\nsolution, before finally comparing its own prediction against the actual results of program execution. Although \\nwe did not train CWM for it directly, this is exactly the kind of reasoning about environment dynamics \\nthat we believe code world models can enable. We are excited about future work that explicitly integrates \\nreasoning about environment feedback to improve agentic code generation. While CWM is trained to simulate the execution of Python code line-by-line, we believe the formal integration \\nof trace prediction into natural language reasoning is interesting future work. Figure 5 presents an early \\nprototype of this, showing CWM already generalizes to such behavior under light prompting. We believe that \\nexecution trace prediction enables grounded reasoning about code generation and execution, without requiring \\naccess to live execution environments. This can take explicit forms, such as in our prototype, but we also \\nenvision more implicit forms of regularizing reasoning through world modeling. We further plan to extend \\nCWM's trace prediction to create a \\\"neural debugger\\\" whose capabilities go beyond traditional debugging,\"\n}"],["5aa3e550-0e87-4bee-97fa-e69f0e6ed0e5","{\n  \"page_content\": \"Figure 13 Length reward scheduling for RL training. The decaying threshold starts at 8 k at the start of training and \\nlinearly increases to its 64 k limit over 10 000 steps. such as (0.1,0.2] and (0.6,0.7], and sample harder examples more frequently using weights inversely \\n     proportional to the interval's midpoint. Hyperparameters. After an initial linear warmup over 100 steps, we employ a learning rates of 2.5 x 10-7 \\nthroughout training. The maximum batch size for each gradient step is 8.4 M tokens during the first stage \\nand 16.8 M tokens for the second stage. Gradients are clipped to norm 0.1. We use G = 8 rollouts per data \\npoint, and new model weights are broadcast to workers after 4 gradient steps. We list further GRPO-specific \\nhyperparameters in \\u00a75.2.\",\n  \"metadata\": {\n    \"total_chars\": 775,\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"116.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.303030\",\n    \"chunk_number\": 116\n  }\n}"],["5b74c6a7-dbe5-4f6d-9fd4-70365149900c","{\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 26,\n    \"chunk_number\": 53,\n    \"chunk_file\": \"53.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.277193\"\n  },\n  \"page_content\": \"\u003c | frame_sep|\u003e) as \\nsuch.\"\n}"],["5bbf8127-f5e6-44a4-ab63-1a8873ed5c0b","{\n  \"metadata\": {\n    \"chunk_number\": 7,\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"7.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.258241\",\n    \"total_chars\": 1311\n  },\n  \"page_content\": \"CWM pretrained              CWM sft                  CWM \\n\\nFigure 1 Overview of the CWM training stages and the model checkpoints that we release. We generally report \\nperformance of the final CWM (instruct, RL trained) model, except where otherwise stated. local variables. By training CWM on a trajectory of observation-action pairs conditioned on the code only \\nas context, we directly teach the model how the execution of a line of Python affects the state of the local \\nvariables. Our premise here is that teaching CWM the semantics and not just syntax of programs should \\nhelp with writing code as well as with reasoning tasks like verification, testing, and debugging. We also train CWM on a large-scale collection of synthetically generated agentic interactions with computa- \\ntional environments. These trajectories are generated with our so-called ForagerAgent, which \\\"forages\\\" for \\ndata covering agentic software engineering scenarios such as implementing missing functionality or fixing \\nbugs from error messages. Actions here are shell-like commands or code edits generated by the agent, and \\nobservations are responses from the running environment. While it is not uncommon for recent models to \\ninclude similar data, this is mostly done at smaller scale during post-training (Yang et al., 2025b).\"\n}"],["5bf67448-c53f-41ff-b8fa-bcd1b7e32325","{\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.326527\",\n    \"chunk_number\": 177,\n    \"total_chars\": 1197,\n    \"chunk_file\": \"177.txt\",\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"As part of ongoing work to improve the \\nrobustness of our evaluations and the reliability of our models, we also include a preliminary propensity \\nevaluation, with plans to expand this area in future assessments. We performed this assessment by testing the relative performance of CWM against a set popular and capable \\nopen-source models that represent a baseline of capabilities available in the open ecosystem: Qwen3-Coder-480B- \\nA35B-Instruct (Yang et al., 2025a), Llama 4 Maverick (Meta AI, 2025), and gpt-oss-120B (OpenAI, 2025a). Based on the results of these assessments, we believe that the open-source release of CWM is unlikely to \\nmeaningfully increase risks related to Cybersecurity or Chemical & Biological threats beyond the current \\necosystem baseline. Additionally, our preliminary evaluations suggest that CWM shows undesirable propensi- \\nties at rates comparable to most open-source models though some models achieve substantially lower rates, \\ni.e., gpt-oss-120B. These results indicate that CWM is within the \\\"moderate\\\" risk threshold for the catastrophic domains defined \\nin Meta's Frontier AI Framework.17 We share the details in the Code World Model Preparedness Report. 18\"\n}"],["5c6cd0a0-ebf5-43fb-809c-059655f0b82c","{\n  \"page_content\": \"Alon Talmor, Jonathan Herzig, Nicholas Lourie, and Jonathan Berant. Commonsenseqa: A question answering \\n  challenge targeting commonsense knowledge. In Jill Burstein, Christy Doran, and Thamar Solorio, editors, \\n  Proceedings of the 2019 Conference of the North American Chapter of the Association for Computational Linguistics: \\n  Human Language Technologies, NAACL-HLT 2019, Minneapolis, MN, USA, June 2-7, 2019, Volume 1 (Long and \\n  Short Papers), pages 4149-4158. Association for Computational Linguistics, 2019. doi: 10.18653\u002 V = self. support_vectors _. shape[0]\"\n}"],["5ed0f41d-0431-429c-96f2-15d0b0bb84fd","{\n  \"metadata\": {\n    \"chunk_number\": 200,\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"200.txt\",\n    \"total_chars\": 813,\n    \"processed_date\": \"2025-12-17T04:00:35.334423\"\n  },\n  \"page_content\": \"Samir Yitzhak Gadre, Georgios Smyrnis, Vaishaal Shankar, Suchin Gururangan, Mitchell Wortsman, Rulin Shao, \\n  Jean Mercat, Alex Fang, Jeffrey Li, Sedrick Keh, et al. Language models scale reliably with over-training and on \\n  downstream tasks. arXiv preprint arXiv:2403.08540, 2024. Bofei Gao, Feifan Song, Zhe Yang, Zefan Cai, Yibo Miao, Qingxiu Dong, Lei Li, Chenghao Ma, Liang Chen, Runxin \\n  Xu, Zhengyang Tang, Benyou Wang, Daoguang Zan, Shanghaoran Quan, Ge Zhang, Lei Sha, Yichang Zhang, \\n  Xuancheng Ren, Tianyu Liu, and Baobao Chang. Omni-math: A universal olympiad level mathematic benchmark \\n  for large language models. In The Thirteenth International Conference on Learning Representations, ICLR 2025, \\n  Singapore, April 24-28, 2025. OpenReview.net, 2025. https:\u002f\u002fopenreview.net\u002fforum?id=yaqPf\\u00d8KAIN.\"\n}"],["5efb61e1-9941-4cee-9ddd-c08fc157670d","{\n  \"metadata\": {\n    \"chunk_file\": \"183.txt\",\n    \"total_chars\": 1527,\n    \"chunk_number\": 183,\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.328835\"\n  },\n  \"page_content\": \"Authors: Meta FAIR CodeGen Team \\n\\nAlphabetic order for core contributors, from second author onward and excluding senior authors, and \\ncontributors. Core contributors \\n\\nJade Copet                    Jacob Kahn                    Michel Meyer \\nQuentin Carbonneaux           Jannik Kossen                 Yuxiang Wei \\nGal Cohen                     Felix Kreuk                   David Zhang \\nJonas Gehring                 Emily McMilin                 Kunhao Zheng \\n\\nContributors \\n\\nJordi Armengol-Estap\\u00e9         Daniel Haziza                  Peter O'Hearn \\nPedram Bashiri                Badr Youbi Idrissi             Matteo Pagliardini \\nMaximilian Beck                Christian Keller              Dmitrii Pedchenko \\nPierre Chambon                Rahul Kindi                    Tal Remez \\nAbhishek Charnalia            Hugh Leather                   Volker Seeker \\nChris Cummins                  Gallil Maimon                 Marco Selvi \\nJuliette Decugis              Aram Markosyan                 Oren Sultan \\nZacharias V. Fisches          Francisco Massa                Sida Wang \\nFran\\u00e7ois Fleuret              Pierre-Emmanuel Mazar\\u00e9         Luca Wehrstedt \\nFabian Gloeckle                Vegard Mella                  Ori Yoran \\nAlex Gu                       Naila Murray                   Lingming Zhang \\nMichael Hassid                Keyur Muzumdar \\n\\nSenior core contributors \\n\\nTaco Cohen                    Yossi Adi                      Gabriel Synnaeve \\n\\n                                           34 \\n\u003c\u003c\u003c\\f\\n\\nReferences\"\n}"],["602ca926-7377-4e60-8698-5f6e5efa1f44","{\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 158,\n    \"total_chars\": 1498,\n    \"chunk_file\": \"158.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.319660\"\n  },\n  \"page_content\": \"We query LLMs to judge whether a program terminates (answer #T) or diverges (answer f(n) where n leads \\n to divergence, followed by the comment #NT). We reward a divergence claim if f (n) times out after 5 seconds. If, however, the model predicts #NT, and the ground truth is #T, it is not rewarded, even if execution exceeds \\n the timeout. For instance, if f's ground truth is #T and f(42) runs for 7.5 million years and then terminates, \\n our scoring (pass@1) will not reward a #NT claim for f(42) even though it trips timeout. Our use of timeout \\n as a proxy for divergence is similar to Alon and David (2022) in judging correct non-termination claims, but \\n different in that timeout is not used as a ground truth for termination claims. This results in an eval that is \\n conservative in the sense that it awards scores that could be higher than that given by a perfect oracle, but \\n never lower. It would be worth exploring replacing the ground truths and input validation by logical proofs of \\n termination and non-termination (Cook et al., 2011; Gupta et al., 2008). Table 10 reports results for CWM, Qwen3-32B, and Llama3-70B with direct prediction, prompted chain-of- \\n thought (CoT), and reasoning (for CWM and Qwen3-32B only). \\\"Reasoning\\\" here means use of the \u003cthink\u003e \\n ... \u003c \u002fthink\u003e format from RL. We report CoT prompting numbers to represent an attempt to approximate \\n reasoning that is compatible with Llama3-70B. As a reference, we also provide the scores of a constant classifier\"\n}"],["61e7c301-2772-4255-a557-c1f757bdcb29","{\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.335624\",\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 204,\n    \"total_chars\": 469,\n    \"chunk_file\": \"204.txt\"\n  },\n  \"page_content\": \"Kunal Handa, Alex Tamkin, Miles McCain, Saffron Huang, Esin Durmus, Sarah Heck, Jared Mueller, Jerry Hong, \\n  Stuart Ritchie, Tim Belonax, et al. Which economic tasks are performed with ai? evidence from millions of claude \\n  conversations. arXiv preprint ar Xiv:2503.04761, 2025. Michael Hassid, Gabriel Synnaeve, Yossi Adi, and Roy Schwartz. Don't overthink it. preferring shorter thinking chains \\n  for improved Ilm reasoning. arXiv preprint ar Xiv:2505.17813, 2025.\"\n}"],["62b6e957-f92e-4744-96c6-9c39aa0a7142","{\n  \"page_content\": \"k=3                                      40 \\n 80                             k=7                  Accuracy \\nAccuracy               k=5 \\n                                         k=9 k=10 \\n 78            k=3                                     20 \\n\\n      k=1                                               0 \\n 76                                                      2k-20k       20k-36k      36k-60k      60k-98k \\n   0   20000 40000 60000 80000 100000 120000 140000                      Prompt Token Length \\n                    Total generated tokens                 CWM     Gemini 2.5-Pro 06-05 Kimi-K2 GPT-OSS-120B \\n              AIME24   Majority@k Short-3@k                Sonnet 4 GPT-5 (medium) DeepSeek-R1-0528 \\n\\n                       (a)                                                  (b) \\n\\nFigure 18 (a) Test-time scaling on AIME24 with majority voting and short-3@k. See main text for details.(b) LoCoDiff \\nresults for CWM and baselines considering different sequence lengths buckets. 8   Transparency, Risks & Limitations\",\n  \"metadata\": {\n    \"total_chars\": 1032,\n    \"processed_date\": \"2025-12-17T04:00:35.325178\",\n    \"chunk_file\": \"173.txt\",\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 173\n  }\n}"],["63e2a161-9e4c-4fd8-b210-423e8fad7345","{\n  \"page_content\": \"We release Code World Model (CWM), a 32-billion-parameter open-weights LLM, to advance research \\n    on code generation with world models. To improve code understanding beyond what can be learned \\n    from training on static code alone, we mid-train CWM on a large amount of observation-action \\n    trajectories from Python interpreter and agentic Docker environments, and perform extensive multi- \\n    task reasoning RL in verifiable coding, math, and multi-turn software engineering environments. With \\n    CWM, we provide a strong testbed for researchers to explore the opportunities world modeling affords \\n    for improving code generation with reasoning and planning in computational environments. We \\n    present first steps of how world models can benefit agentic coding, enable step-by-step simulation of \\n    Python code execution, and show early results of how reasoning can benefit from the latter. CWM is \\n    a dense, decoder-only LLM trained with a context size of up to 131 k tokens. Independent of its world \\n    modeling capabilities, CWM offers strong performance on general coding and math tasks: it reaches \\n    pass@1 scores of 65.8% on SWE-bench Verified (with test-time scaling), 68.6 % on LiveCodeBench, \\n    96.6% on Math-500, and 76.0% on AIME 2024. To support further research on code world modeling, \\n    we release model checkpoints after mid-training, SFT, and RL. Date: September 29, 2025 \\n    Inference Code: github.com\u002ffacebookresearch\u002fcwm \\n    Model Weights: ai.\",\n  \"metadata\": {\n    \"chunk_number\": 2,\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.246129\",\n    \"total_chars\": 1497,\n    \"chunk_file\": \"2.txt\"\n  }\n}"],["6440b0f9-a7f4-4f32-a160-623c25c821eb","{\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.330003\",\n    \"total_chars\": 333,\n    \"chunk_file\": \"187.txt\",\n    \"chunk_number\": 187\n  },\n  \"page_content\": \"Using graph neural networks for program termination. In Abhik Roychoudhury, Cristian \\n  Cadar, and Miryung Kim, editors, Proceedings of the 30th ACM Joint European Software Engineering Conference and \\n  Symposium on the Foundations of Software Engineering, ESEC\u002fFSE 2022, Singapore, Singapore, November 14-18, \\n  2022, pages 910-921.\"\n}"],["6584f188-db03-45da-ba28-a729c832c519","{\n  \"metadata\": {\n    \"total_chars\": 316,\n    \"chunk_number\": 244,\n    \"chunk_file\": \"244.txt\",\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.351350\"\n  },\n  \"page_content\": \"Akshat Bubna, Alec Powell, Lucy Zhang, and Eric Zhang - for extensive support with remote execution, \\ninfrastructure, and platform stability; Lovish Madaan, Binh Tang, Viktor Kerkez, Rishabh Agarwal, Alan \\nSchelten, Xuewei Wang and Jeremy Fu for support with mathematical expression comparison code. B   CWM Examples\"\n}"],["65e30075-ca63-48d3-9f2f-176eb3dba59f","{\n  \"metadata\": {\n    \"total_chars\": 373,\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 188,\n    \"chunk_file\": \"188.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.330282\"\n  },\n  \"page_content\": \"ACM, 2022. doi: 10.1145\u002f3540250.3549095. https:\u002f\u002fdoi.org\u002f10.1145\u002f3540250.3549095. Anthropic. Claude 3.7 sonnet and claude code, February 2025. https:\u002f\u002fwww.anthropic.com\u002fnews\u002fclaude-3-7-sonnet. Anthropic. Raising the bar on swe-bench verified with claude 3.5 sonnet. 2025. https:\u002f\u002fwww.anthropic.com\u002f \\n  engineering\u002fswe-bench-sonnet. Accessed 2025-08-18. Hugh Leather Aram H.\"\n}"],["6633c592-f0c7-4646-8e32-c99ef350a3d5","{\n  \"page_content\": \"Zheyuan Cui, Mert Demirer, Sonia Jaffe, Leon Musolff, Sida Peng, and Tobias Salz. The Effects of Generative AI on \\n  High Skilled Work: Evidence from Three Field Experiments with Software Developers. SSRN eLibrary, 2024. doi: \\n  10.2139\u002fssrn.4945566.\",\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.332930\",\n    \"total_chars\": 250,\n    \"chunk_number\": 196,\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"196.txt\"\n  }\n}"],["66919787-92b4-41da-a12d-36f2c374eb56","{\n  \"page_content\": \"and $VALUE for return and exception frames is also a JSON-encoded string \\nrepresentation. I Formal mathematics datamix \\n\\nWe use the following datasets of mathematics in the Lean 4 (Moura and Ullrich, 2021) theorem proving \\nlanguage. \\u00b7 LeanUniverse (Aram H. Markosyan, 2024), a dataset of (initial proof state, tactic, resulting proof \\n     state) triples from Lean's mathematical library (mathlib Community, 2020) and other open-source Lean \\n     repositories, as a form of code world modeling in Lean. \\u00b7 Goedel-Pset (Lin et al., 2025), formatted as a mathematical statement and proof formalization dataset, \\n     where the task is to translate a mathematical problem and solution from natural language to Lean. \\u00b7 Mathematical statement formalization datasets, where the task is to translate a mathematical statement \\n     from natural language to a Lean theorem statement without proof: Compfiles (CompFiles authors, \\n     2025), Lean Workbook (Ying et al., 2025), miniF2F (Zheng et al., 2022), ProofNet (Azerbayev et al., \\n     2023), Goedel-Pset. 57 \\n\u003c\u003c\u003c\\f\\n\\nTable 14 RULER results at 32k and 128k sequence length.\",\n  \"metadata\": {\n    \"chunk_number\": 345,\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.387330\",\n    \"total_chars\": 1115,\n    \"chunk_file\": \"345.txt\"\n  }\n}"],["6718ccb4-3132-4043-9c7e-25077d11f57d","{\n  \"page_content\": \"Reducing memory consumption. We use PyTorch's AutoAC8 for activation checkpointing, which is integrated \\nin the \\\"partitioner\\\" layer of the torch. compile stack, and uses an integer-linear program solver to optimize \\nthe memory-versus-recomputation tradeoff given a user-provided budget. We also leverage PyTorch's vocab- \\nand loss-parallel helpers to reduce memory consumption. 6.2   RL systems \\nWe train our models using our own asynchronous distributed RL framework. The key distinction from the \\nstandard 11m training lies in the data collection process: in RL, training data is gathered through rollouts \\nwhere the agent interacts with an environment. Rollouts.\",\n  \"metadata\": {\n    \"chunk_file\": \"123.txt\",\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 665,\n    \"chunk_number\": 123,\n    \"processed_date\": \"2025-12-17T04:00:35.305399\"\n  }\n}"],["67a58b2c-1d04-4bc5-a3f1-351423ea5e2a","{\n  \"page_content\": \"Ivan Moshkov, Darragh Hanley, Ivan Sorokin, Shubham Toshniwal, Christof Henkel, Benedikt Schifferer, Wei Du, and \\n  Igor Gitman. Aimo-2 winning solution: Building state-of-the-art mathematical reasoning models with openmathrea- \\n  soning dataset. arXiv preprint ar
