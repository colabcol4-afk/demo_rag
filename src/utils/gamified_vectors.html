ing the loss by the trajectory length as \\n      done in GRPO leads to a length bias, whereby the agent is incentivized to increase the length on hard \\n      problems so as to lower the average loss. To avoid this bias, we divide by the maximum number of \\n      tokens in a trajectory, which matches the maximum context size of our model N = 131072. Batching strategy: We batch by a maximum token limit instead of the common approach that keeps \\n      a fixed number of trajectories per batch. This change aims at improving efficiency and to stabilize \\n      training by lowering the variance in batch size between different optimization steps - this is important in \\n      combination with our removal of length normalization. As a result, different trajectories that belong to \\n      the same group might contribute to separate optimization steps.\"\n}"],["8ecf03b4-1c16-4368-8957-bde4e0b39dd5","{\n  \"page_content\": \"44 \\n\u003c\u003c\u003c\\f\\n\\n The code ran without errors, and \\\"model.\",\n  \"metadata\": {\n    \"chunk_number\": 258,\n    \"processed_date\": \"2025-12-17T04:00:35.356883\",\n    \"total_chars\": 51,\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"258.txt\"\n  }\n}"],["901666c4-0a94-425d-966f-8ce5eb1c83ab","{\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"190.txt\",\n    \"chunk_number\": 190,\n    \"processed_date\": \"2025-12-17T04:00:35.331047\",\n    \"total_chars\": 166\n  },\n  \"page_content\": \"Ayers, Dragomir Radev, and Jeremy Avigad. Proofnet: Autoformalizing and formally proving undergraduate-level mathematics, 2023. https:\u002f\u002farxiv.org\u002fabs\u002f \\n  2302. 12433.\"\n}"],["904e9ab2-b085-499d-b662-d3536d7f3b52","{\n  \"page_content\": \"CWM: An Open-Weights LLM for Research on Code \\n    Generation with World Models \\n    Meta FAIR CodeGen Team\",\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.245003\",\n    \"chunk_file\": \"1.txt\",\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 1,\n    \"total_chars\": 107\n  }\n}"],["9074ecf9-8162-4faa-a12b-1a7363ba528e","{\n  \"page_content\": \"\\\", \\\"a\\\": \\\"0\\\"}\u003c|action_sep|\u003e for i in range(len(nums)): \\n \u003c| frame_sep|\u003e\u003c|line_sep|\u003e{\\\"nums\\\": [X] [X] \\\" .. \\\", \\\"a\\\": \\\" .. \\\", \\\"i\\\": \\\"0\\\"}\u003c|action_sep|\u003e nums. insert(i, nums[a]) \\n \u003c| [X] frame_sep|\u003e\u003c|line_sep|\u003e{\\\"nums\\\": [X] [X] \\\"[1, 1, 3, -1, 1, -2, 6]\\\", \\\"a\\\": \\\" .. \\\", \\\"i\\\": \\\" .. \\\"}\u003c|action_sep|\u003e a += 1 \\n \u003c| [X] frame_sep|\u003e\u003c|line_sep|\u003e{\\\"nums\\\": [X] [X] \\\" .. \\\", \\\"a\\\": \\\"1\\\", \\\"i\\\": \\\" .. \\\"}\u003c|action_sep|\u003e for i in range(len(nums)): \\n \u003c| [X] frame_sep|\u003e\u003c|line_sep|\u003e{\\\"nums\\\": [X] \\\" .. \\\", \\\"a\\\": \\\" .. \\\", \\\"i\\\": \\\"1\\\"}\u003c|action_sep|\u003e nums.insert(i, nums[a]) \\n \u003c [X] | frame_sep | \u003e\u003c|line_sep [X] | \u003e{ [X] \\\"nums\\\" : \\\"[1, 1, 1 , 3 , -1 , 1 , -2, 6]\\\" , \\\"a\\\" : \\\" \\\"i\\\": \\\" .. \\\"\u003e\u003c|action_sep|\u003e a += 1 \\n \u003c| [X] frame_sep|\u003e\u003c|line_sep|\u003e{\\\"nums\\\": [X] [X] \\\" .. \\\", \\\"a\\\": \\\"2\\\", \\\"i\\\": \\\" .. \\\"}\u003c|action_sep|\u003e for i in range(len(nums)): \\n \u003c| [X] frame_sep|\u003e\u003c|line_sep|\u003e{\\\"nums\\\": [X] [X] \\\" .. \\\", \\\"a\\\": \\\" .. \\\", \\\"i\\\": \\\"2\\\"}\u003c|action_sep|\u003e nums. insert(i, nums[a]) \\n \u003c| [X] frame_sep|\u003e\u003c|line_sep|\u003e{\\\"nums\\\": [X] [X] \\\"[1, 1, 1, 1, 3, -1, 1, -2, 6]\\\", \\\"a\\\": \\\" .. \\\", \\\"i\\\": \\\" .. \\\"}\u003c|action_sep|\u003e a += 1 \\n [X]         [X]        [X] \\n \u003c [X] | frame_sep | \u003e\u003c [X] | line_sep | \u003e{ [X] \\\"nums\\\" : \\\" . .\",\n  \"metadata\": {\n    \"total_chars\": 1121,\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"277.txt\",\n    \"chunk_number\": 277,\n    \"processed_date\": \"2025-12-17T04:00:35.363408\"\n  }\n}"],["91c9e485-1b2a-4321-9b0f-2e3be868366a","{\n  \"metadata\": {\n    \"chunk_number\": 305,\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"305.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.373083\",\n    \"total_chars\": 1185\n  },\n  \"page_content\": \"After the n-th \\n minute, the convention ends. The big bad wolf has learned about this convention, and he has an attack plan. At some minute in the convention, he will arrive and eat exactly x pigs. Then he will get away. The wolf wants Gregor to help him figure out the number of possible attack plans that involve eating exactly x pigs for various values of x (1 \u003c= x \u003c= 3n). Two attack plans are \\n considered different, if they occur at different times or if the sets of little pigs to eat are different. Note that all queries are independent, that is, the wolf does not eat the little pigs, he only makes plans! Input \\n The first line of input contains two integers n and q (1 \u003c= n \u003c= 10^6, 1 \u003c= q \u003c= 2* 10^5), the number of minutes the convention lasts and the number of queries the wolf asks. Each of the next q lines contains a single integer x_i (1 \u003c= x_i \u003c= b3n), the number of pigs the wolf will eat in the i-th query. Output \\n You should print q lines, with line i representing the number of attack plans if the wolf wants to eat x_i pigs. Since each query answer can be large, output each answer modulo 10^9+7. Examples \\n Input \\n 2 3 \\n 1 \\n 5 \\n 6 \\n Output \\n 9 \\n 6 \\n 1 \\n Input\"\n}"],["91e3cc8a-9d8c-4e43-936d-2c0e42bb4f08","{\n  \"metadata\": {\n    \"chunk_file\": \"219.txt\",\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 219,\n    \"processed_date\": \"2025-12-17T04:00:35.341733\",\n    \"total_chars\": 619\n  },\n  \"page_content\": \"Association for Computational Linguistics, 2018. doi: \\n  10.18653\u002fV1\u002fD18-1260. https:\u002f\u002fdoi.org\u002f10.18653\u002fv1\u002fd18-1260. Mistral-AI, :, Abhinav Rastogi, Albert Q. Jiang, Andy Lo, Gabrielle Berrada, Guillaume Lample, Jason Rute, Joep \\n  Barmentlo, Karmesh Yadav, Kartik Khandelwal, Khyathi Raghavi Chandu, L\\u00e9onard Blier, Lucile Saulnier, Matthieu \\n  Dinot, Maxime Darrin, Neha Gupta, Roman Soletskyi, Sagar Vaze, Teven Le Scao, Yihan Wang, Adam Yang, \\n  Alexander H. Liu, Alexandre Sablayrolles, Am\\u00e9lie H\\u00e9liou, Am\\u00e9lie Martin, Andy Ehrenberg, Anmol Agarwal, Antoine \\n\\n                                                  38 \\n\u003c\u003c\u003c\"\n}"],["9314f835-add8-4ca8-9e9a-58e2257209d7","{\n  \"page_content\": \"Trace Prediction. CWM is able to predict the execution of Python programs on a step-by-step basis using \\ndedicated trace prediction tokens. The prompt requires a source code context, $CONTEXT, and a sentinel \\n\u003c| frame_sep|\u003e token to induce trace prediction, structured as: \\n\u003c|begin_of_text|\u003e\u003c| trace_context_start |\u003e$CONTEXT\u003c| frame_sep|\u003e \\n\\nIn $CONTEXT, the entry point for trace prediction is marked with a \u003c\u003c START_OF_TRACE comment. An execution \\ntrace in CWM is a series of frames, with each frame consisting of an observation (local variables) and an \\naction (source code line). There are four different types of frames, formatted as follows: \\n\u003c| call_sep|\u003e$LOCALS\u003c|action_sep|\u003e$SOURCE\u003c| frame_sep|\u003e \\n\u003c| line_sep|\u003e$LOCALS\u003c|action_sep|\u003e$SOURCE\u003c| frame_sep|\u003e \\n\u003c| return_sep|\u003e\u003c|action_sep|\u003e$SOURCE\u003c| arg_sep|\u003e$VALUE\u003c| frame_sep|\u003e \\n\u003c| exception_sep|\u003e\u003c|action_sep|\u003e$SOURCE\u003c| arg_sep|\u003e$VALUE\u003c| frame_sep|\u003e \\n\\nThe model produces an \u003c| end_of_text |\u003e token to denote the end of the execution, which is reached when \\nexiting the scope of the trace's entry point. Locals are formatted as JSON key-value pairs where values are \\nalways rendered as JSON strings.\",\n  \"metadata\": {\n    \"chunk_number\": 342,\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.385666\",\n    \"chunk_file\": \"342.txt\",\n    \"total_chars\": 1152\n  }\n}"],["9373d8df-6ff3-4de5-a541-723d45fb26a0","{\n  \"metadata\": {\n    \"total_chars\": 938,\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 37,\n    \"processed_date\": \"2025-12-17T04:00:35.271428\",\n    \"chunk_file\": \"37.txt\"\n  },\n  \"page_content\": \". Looking back, the code reads a string, passes it to the function. Let me create some test cases. Test 1: 'abba' -\u003e expected YES -\u003e the code should return YES. Test 2: 'aabba' -\u003e expected NO -\u003e because when it processes the third character, it's the third occurrence of 'a'. Wait for 'aabba' : \\n\\n Indices 0:a (occurs once) \\n\\n index1: a now (occurs twice. check 0 and 1 -\u003e difference is 1 -\u003e ??? But difference is -1 -\u003e mod 2 is -1 % 2 = 1 (assuming C++ makes it positive 1). The code checks if even, no. So the code proceeds. Then loop reaches index 4 (a's third occurrence), which code detects count for a which is already 2 -\u003e returns NO. So code should output NO here. Other test: 'aaa' (NO when processing third a). test4: 'abcd' -\u003e YES (each character appears once or twice in non-same parity) -\u003e code OK. ttest5: 'aabb' -\u003e the two a's (index 0 and1 -\u003e difference 1, ok). Two b's (index 2,3 difference -\u003e 1 is ok). Code returns YES.\"\n}"],["9407eb15-115f-4ce7-b6ed-8796ef71f552","{\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.281337\",\n    \"total_chars\": 1563,\n    \"chunk_number\": 64,\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"64.txt\"\n  },\n  \"page_content\": \"that the desired number of epochs is reached at the end of mid-training. When estimating the number of steps \\nper epoch, we account for both token packing (wrapping) for pre-training data and truncation for chat data. Long-context mid-training. A significant amount of the mid-training data is long-context, with about 30 % \\nof documents exceeding 65 k tokens. This motivates our decision to increase the maximum sequence length \\nto 131 k tokens for all of mid-training. Consequently, we do not need a dedicated long-context finetuning \\nphase common in many other recipes (Yang et al., 2025a; Agarwal et al., 2025; Dubey et al., 2024). While our \\nlocal-global pattern reduces the cost of long-context attention (see \\u00a74.1), we still found that data-parallel \\nworkers with short-context documents would often wait for ranks with long-context data during distributed \\ntraining. To improve iteration speeds, we \\\"bucketize\\\" all documents by sequence length, ensuring all workers \\ndraw documents from the same bucket at a given step. We choose the bucket boundaries as (0, 16385], \\n(16385, 65537], and (65537,   tokens and take care that the marginal probability of sampling a dataset is \\nunchanged from bucketization. Note that, to achieve further speedups, we limit the maximum global attention \\nsize to 32 768 in the medium bucket. 4.3   Scaling laws \\nScaling laws for LLMs that predict model performance as a function of compute, data, and model size have \\nbeen studied extensively (Kaplan et al., 2020; Hoffmann et al., 2022; Bi et al., 2024). These empirical laws\"\n}"],["9415c28f-f5ac-48f8-b0fc-e76e5d085de9","{\n  \"metadata\": {\n    \"total_chars\": 918,\n    \"chunk_number\": 18,\n    \"chunk_file\": \"18.txt\",\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.263657\"\n  },\n  \"page_content\": \"\\\", \\\"t\\\": \\\" .. \\\"}       \u003c|action_sep|\u003e n = 0 \\n                                               \u003cIframe_sep|\u003e \\n              \u003c|line_sep|\u003e {\\\"s\\\": \\\" .. \\\", \\\"t\\\": \\\" .. \\\", \\\"n\\\": \\\"0\\\"} \u003c|action_sep|\u003e for c in s: \\n                                               \u003c|frame_sep|\u003e \\n              \u003c|line_sep|\u003e {\\\"s\\\": \\\" .. \\\", \\\"t\\\": \\\" .. \\\", \\\"n\\\": \\\" .. \\\", \\\"c\\\": \\\"'s'\\\"} \u003c|action_sep|\u003e n += int(c == t) \\n                                                   ... \u003c|frame_sep|\u003e \\n               \u003c|return_sep|\u003e \u003c|action_sep|\u003e return n \u003c|arg_sep|\u003e          \\\"3\\\" \\n                                               \u003c|frame_sep|\u003e \\n\\nFigure 3 CWM format for Python traces. Given a source code context and a marker of the trace starting point, CWM \\npredicts a series of stack frames representing the Program states and the actions (executed code). enables us to align code and execution trace to simulate observation-action data within the computational \\n environment.\"\n}"],["97f0d300-805a-4b5a-a3ff-0a4df3ce8606","{\n  \"page_content\": \"natural language reasoning trace (wrong). In this CruxEval \\n\\nexample, a list is modified while iterating over it. In execution trace prediction mode the CWM model generates the \\n\\ncorrect answer [1,              1,   1,   1,    1,   1,   1,   3,    -1,    1,   -2,    6]. During reasoning in natural language, even though the \\n\\nCWM model recognizes the modification, it still predicts the wrong output. 48 \\n\u003c\u003c\u003c\",\n  \"metadata\": {\n    \"chunk_number\": 288,\n    \"total_chars\": 409,\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"288.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.367307\"\n  }\n}"],["98352b6c-e00b-438a-b03f-eb2301919e3f","{\n  \"page_content\": \"CWM                                                                                               GPT-5 \\n                                                                     GLM4.5 \\n                                                                                                                      Sonnet-4 \\n                                              Deep-SWE                                                          Claude \\n                                                                              Qwen3-Coder \\n                                                                     Kimi-K2-Instruct \\n                   Qwen3-Coder-30B \\nFigure 2 On SWE-bench Devstral-small-2507 Verified, DeepSeek-R1-2805 CWM outperforms open-weight models with Gemini-2.5-thinking similar parameter counts and is even \\ncompetitive with much larger or closed-weight LLMs. The base score for CWM is computed with a single attempt \\nper instance (no retries, majority voting, GPT-oss-20B-(low-high) or parallel candidates), averaged Devstral-medium-2507 over multiple runs to reduce variance. For \\n\\\"Test                                           GPT-oss-120B-(low-high) \\n       Time Scaling\\\", we generate multiple candidates in parallel and then submit one patch based on ranking. The \\n\\\"Test Time Scaling\\\" score for GPT-oss models is high reasoning budget, while the lower score is low. ( *: GPT-5 and \\nGPT-oss use a custom subset of 477 problems, while CWM is evaluated on the full set of 500 problems.)\",\n  \"metadata\": {\n    \"total_chars\": 1492,\n    \"processed_date\": \"2025-12-17T04:00:35.261256\",\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 13,\n    \"chunk_file\": \"13.txt\"\n  }\n}"],["9c6b7a65-8c30-4c21-8aae-eb11f7639fbb","{\n  \"page_content\": \". Commonsense and general reasoning: ARC Challenge\u002fEasy (valid\u002ftest) (Clark et al., 2018), Com- \\n     monsenseQA (valid\u002ftest) (Talmor et al., 2019), DROP (Dua et al., 2019), PIQA (valid\u002ftest) (Bisk \\n     et al., 2020), HellaSwag (valid\u002ftest) (Zellers et al., 2019), SimpleQA (Wei et al., 2024), OpenBookQA \\n     main\u002fadditional (valid\u002ftest) (Mihaylov et al., 2018), WinoGrande 1.1 (dev\u002ftest) (Sakaguchi et al., 2020). \\u00b7 Conversation and evaluation frameworks: ArenaHard (Li et al., 2024), MTBench (Zheng et al., 2023). We decontaminate our dataset of Dockerized executable repositories against SWE-bench Verified (Jimenez \\net al., 2024) by doing the following: \\n   \\u00b7 Removed all Docker images built from repositories in SWE-bench Verified. \\u00b7 Confirmed no remaining unexpected instance-level contamination by verifying that pairwise (dataset \\n     instance to SWE-bench Verified instance) Jaccard similarities between diff patch line sets remained \\n     below 0.2. G    Mathematical expression comparison for RL\",\n  \"metadata\": {\n    \"chunk_number\": 336,\n    \"chunk_file\": \"336.txt\",\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.383286\",\n    \"total_chars\": 1010\n  }\n}"],["9e03a8ae-49c2-40e7-9fb5-4a200b576087","{\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.264483\",\n    \"total_chars\": 1523,\n    \"chunk_file\": \"20.txt\",\n    \"chunk_number\": 20,\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"Function-level tracing. We collect a dataset of Python functions from online sources and automatically generate \\ninput-output pairs with a combination of fuzzing and prompting Llama3-70B-Instruct. Our tracing process \\n captures the state of the Python program (interpreter stack frames) at different intermediate execution points, \\n corresponding to events of the Python interpreter (e.g., executed lines, return statements, exceptions). The \\nfinal dataset contains over 120 M traced Python functions. We post-process the raw traces to construct observation-action pairs. The observation contains local variables \\nand stack frame metadata immediately prior to executing a line of code, the action is the specific Python line \\nbeing executed, and the subsequent observation captures the resulting local variable states and additional \\nevent metadata such as return statements; we disregard global variables and external side effects. The variable \\nvalues that do not change with respect to the previous step are summarized with an ellipsis. We prefix the \\ntrace data with the source code context. Figure 3 illustrates the CWM format for Python traces. Given a Python code context and a marker of \\nthe tracing initial point, the model follows with a series of Python stack frame predictions (in the form of \\n a JSON-formatted dictionary with the local variables) and the corresponding actions (i.e., the part of the \\ncode that is being executed). The frame, action, and argument separators, as well as the trace context start\"\n}"],["9e159023-0b9a-450f-9e0f-5d8b3991f9ed","{\n  \"page_content\": \"Local SWA (8k tokens) + FFN 15 \\n                                            Agentic reasoning P TR T 0 T   O TR T   O T \\n                            Repeated \\n                                                             P TR T O   T O   T O   T O TR T   O T   O T \\n     Local SWA (8k tokens) + FFN   WM-based agentic reasoning                          1                4 \\n               4                             (future research)                                       Submitted \\n                                                                  Unrolling plan with world model \\n   Global                                                                                             answer \\n        SWA (131k tokens) + FFN \\n\\n                                  Types of data                                         World modeling type of data \\n     Embedding (128k vocab size) \\n                                    T Text \u002f code \u002f tool call P Prompt (or context) text \u002f code T O T O T O \\n(a) CWM architecture: GQA           TR Text \u002f code with reasoning TA Human annotated text \u002f code \\nwith alternating local (8k) and     O \\n                                       Observations          R Rewards \\ndynamic global (131 k) sliding \\nwindow attention. (b) Overview of the CWM training and inference types for inputs and outputs.\",\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.279087\",\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 58,\n    \"total_chars\": 1322,\n    \"chunk_file\": \"58.txt\"\n  }\n}"],["9e7beab9-6805-4bf0-9563-994803c68a87","{\n  \"page_content\": \"This method stopped any increasing gibberish generation and \\n      performed better than detectors based on logprob and position alone. 5We recommend using the k2 estimator (Schulman, 2020) whose gradient is an unbiased estimator of the forward KL(Te, Told), \\nrather than the k3 estimator used by GRPO whose gradient is an unbiased estimator of the reverse KL(Told, Te). 13 \\n\u003c\u003c\u003c\",\n  \"metadata\": {\n    \"chunk_file\": \"79.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.286857\",\n    \"total_chars\": 378,\n    \"chunk_number\": 79,\n    \"source\": \"CWM-Meta\"\n  }\n}"],["9eef0fda-7f26-459d-aa90-ca03482083e7","{\n  \"page_content\": \"\u002fcwm-sft, .. \u002fcwm-pretrain                           00 \\n\\n1   Introduction \\n\\nSoftware development is one of the domains where Large Language Models (LLMs) have already had a \\nsignificant real-world impact (Cui et al., 2024; Bick et al., 2024). They have quickly been adopted into the \\nworkflows of software engineers worldwide, and their capabilities are advancing fast: from only supporting \\nprogrammers with small snippets of code to fixing issues or writing code bases autonomously (Yeverechyahu \\net al., 2024; Handa et al., 2025). However, reliably generating high-quality code remains a challenge even for \\nthe current generation of LLMs, with benchmarks consistently revealing shortcomings upon release (Hendrycks \\net al., 2021a; Chen et al., 2021; Aider Team, 2025; Jimenez et al., 2024).\",\n  \"metadata\": {\n    \"chunk_file\": \"4.txt\",\n    \"chunk_number\": 4,\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 795,\n    \"processed_date\": \"2025-12-17T04:00:35.246835\"\n  }\n}"],["9f53d43c-3281-45ba-8a5e-807f4d66b897","{\n  \"metadata\": {\n    \"total_chars\": 266,\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 186,\n    \"chunk_file\": \"186.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.329720\"\n  },\n  \"page_content\": \"Joshua Ainslie, James Lee-Thorp, Michiel De Jong, Yury Zemlyanskiy, Federico Lebr\\u00f3n, and Sumit Sanghai. Gqa: \\n  Training generalized multi-query transformer models from multi-head checkpoints. ar Xiv preprint ar Xiv:2305.13245, \\n  2023. Yoav Alon and Cristina David.\"\n}"],["9fe7a770-46dc-4bde-83cc-3fbf336a7cd3","{\n  \"metadata\": {\n    \"total_chars\": 387,\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.347376\",\n    \"chunk_file\": \"234.txt\",\n    \"chunk_number\": 234\n  },\n  \"page_content\": \"Tran, Fuqiang Li, Ren Ma, Mingzhang Zheng, Bill Qian, Yanjun Shao, Niklas Muennighoff, \\n  Yizhe Zhang, Binyuan Hui, Junyang Lin, Robert Brennan, Hao Peng, Heng Ji, and Graham Neubig. Openhands: \\n  An open platform for AI software developers as generalist agents. In The Thirteenth International Conference on \\n  Learning Representations, 2025. https:\u002f\u002fopenreview.net\u002fforum?id=0Jd3ayDDoF.\"\n}"],["a08cd32d-819c-430c-9217-a298f990b061","{\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.351846\",\n    \"chunk_file\": \"246.txt\",\n    \"chunk_number\": 246,\n    \"total_chars\": 16,\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"B   CWM Examples\"\n}"],["a0fb41aa-995e-498c-95bf-a75e0b255e24","{\n  \"metadata\": {\n    \"total_chars\": 1464,\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"138.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.311811\",\n    \"chunk_number\": 138\n  },\n  \"page_content\": \"In Figure 16, we report results for best@k for k = 16, which achieves a 65.8% resolve rate. As a simple \\nalternative to best@k, we found that majority voting (Wang et al., 2022b) of candidate patches, based on exact \\nstring matching and without any test generation or execution, leads to a pass rate of 58.4%. In Figure 17a, \\nwe report best@k and pass@k across different values of k. As expected, pass@k improves monotonically with \\nlarger k, ultimately reaching a success rate of 80.4% at k = 40. For best@k, performance improves sharply \\nfrom k = 2 before plateauing around k = 16. For majority-voting, performance improves gradually from k = 2 \\nand plateaus at k = 24. Alternative harnesses for SWE-bench Verified. To better understand the robustness of CWM to the choice of \\nevaluation harness and tool-calling implementations, we perform experiments with third-party approaches, \\nnamely Mini-SWE-Agent (Yang et al., 2024) and OpenHands (Wang et al., 2025). For both, we shortened \\nand adapt the system prompt to better align with the SWE RL prompt (see Figure 11) and make sure to \\nkeep reasoning output as part of the message history. We configure both harnesses to use OpenAI function \\ncalling, which sends messages along with structured tool descriptions. When prompting the model, we format \\nand append the available tools to the system prompt. When the model decides to call a tool, the call is \\nparsed and returned in a tool_calls field in our response.\"\n}"],["a1950b03-763f-48b9-9d08-a48a9b59b6c0","{\n  \"metadata\": {\n    \"chunk_number\": 303,\n    \"processed_date\": \"2025-12-17T04:00:35.372300\",\n    \"chunk_file\": \"303.txt\",\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 582\n  },\n  \"page_content\": \"Figure B.26 CWM predicting the execution traces of an unseen function f, imported from a library not included in the \\n context. The expected semantics of f can be inferred from the assertions in the context. CWM correctly generates \\n the traces of a function that sums two numbers. It is possible that the model acquired this capability of jointly tracing \\n and generating code because for some tracing data we do not include the source context of third-party libraries. 50 \\n\u003c\u003c\u003c\\f\\n\\n Given the following problem: Three little pigs from all over the world are meeting for a convention!\"\n}"],["a23712c1-d1d5-4479-9c27-d1bd3c405ecb","{\n  \"metadata\": {\n    \"total_chars\": 1188,\n    \"chunk_file\": \"73.txt\",\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 73,\n    \"processed_date\": \"2025-12-17T04:00:35.284951\"\n  },\n  \"page_content\": \"12 \\n\u003c\u003c\u003c\\f\\n\\n a number of these and include further changes to support multi-turn RL and efficient asynchronous RL. A \\nformal description of our RL algorithm can be found in \\u00a7C. Differences from GRPO. We deviate from the original GRPO algorithm in the following ways: \\n    \\u00b7 Multi-turn: GRPO was originally developed for single turn (prompt -\u003e response) environments. Instead, \\n      we use a multi-turn variant where the sequence contains both model- and environment-generated tokens \\n      after the prompt, resulting in the need for masking via Mi,t. Furthermore, whereas GRPO used the \\n      reward ri, we use the return Ri (sum of rewards) in the advantage calculation. \\u00b7 Asynchronous: Whereas GRPO uses a synchronous setup, where nodes switch between generating batches \\n      of completions and training on them, we use asynchronous RL, resulting in much higher throughput. . No o normalization: GRPO calculates the advantage as the centered and scaled terminal reward \\n      \\u00c2\\u00a1 = (ri-u)\u002fo, where     and o are mean and standard deviation of rewards in the batch. This introduces \\n      a difficulty bias (Liu et al., 2025), which we avoid by using the more conventional   = (Ri - p).\"\n}"],["a2a83776-332c-4e97-9fea-51c11f605a4c","{\n  \"page_content\": \"36 \\n\u003c\u003c\u003c\\f\\n\\nAlex Gu, Baptiste Rozi\\u00e8re, Hugh Leather, Armando Solar-Lezama, Gabriel Synnaeve, and Sida I. Wang. Cruxeval: A \\n  benchmark for code reasoning, understanding and execution. arXiv preprint ar Xiv:2401.03065, 2024.\",\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.335090\",\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"202.txt\",\n    \"chunk_number\": 202,\n    \"total_chars\": 222\n  }\n}"],["a33d4677-71d1-4480-b230-53ef32247940","{\n  \"metadata\": {\n    \"chunk_file\": \"344.txt\",\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 246,\n    \"chunk_number\": 344,\n    \"processed_date\": \"2025-12-17T04:00:35.386891\"\n  },\n  \"page_content\": \"The model produces an \u003c| end_of_text |\u003e token to denote the end of the execution, which is reached when \\nexiting the scope of the trace's entry point. Locals are formatted as JSON key-value pairs where values are \\nalways rendered as JSON strings.\"\n}"],["a3a0d6c3-fa4d-41ee-baee-812bea3cea0a","{\n  \"metadata\": {\n    \"total_chars\": 1121,\n    \"chunk_number\": 248,\n    \"chunk_file\": \"248.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.352811\",\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"modifications and predicts the output correctly. With natural language reasoning, the model fails to predict the \\ncorrect return value - even though it appears to recognize the list modification during reasoning. Conversely, \\nFigure B.24 presents an example requiring the evaluation of a complex Python statement. Execution trace \\nprediction fails to correctly predict the outcome of the statement in a single prediction step, but natural \\nlanguage reasoning breaks down the complex statement into simpler expressions and then combines those into \\na correct result. We believe that combining the groundedness of trace prediction with the flexibility of natural \\nlanguage reasoning makes for interesting future research. Figure B.25 demonstrates how CWM's execution trace prediction capabilities allow it to function as a neural \\nPython debugger. We think that equipping CWM with debugging capabilities that are not available with \\ntraditional debuggers, such as skipping loops in constant time, jumping to arbitrary lines of code, or predicting \\ninputs to reach arbitrary states is highly interesting future work. 42 \\n\u003c\u003c\u003c\"\n}"],["a6957492-654d-4e70-92ea-4bbe80f33304","{\n  \"metadata\": {\n    \"chunk_number\": 159,\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 721,\n    \"chunk_file\": \"159.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.319922\"\n  },\n  \"page_content\": \"reasoning that is compatible with Llama3-70B. As a reference, we also provide the scores of a constant classifier \\n tagging all programs as terminating, which would obtain a pass@ of 0.5. When comparing CWM and Qwen3, \\n results suggest Qwen3 reaches better direct and CoT performance, however under the reasoning setup, both \\n models significantly improved, reaching comparable performance of ~0.94 pass@1. We initially designed HaltEval-prelim under the assumption that termination would be difficult to assess, given \\n its undecidability. The strong results achieved by both CWM and Qwen3-32B with reasoning were therefore un- \\n  13See https:\u002f\u002fsv-comp.sosy-lab.org\u002f and https:\u002f\u002ftermination-portal.org\u002fwiki\u002fTPDB. 28 \\n\u003c\u003c\u003c\"\n}"],["a72b4890-8dce-41e5-890f-9d2133be9cf0","{\n  \"metadata\": {\n    \"total_chars\": 1104,\n    \"chunk_number\": 337,\n    \"processed_date\": \"2025-12-17T04:00:35.383705\",\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"337.txt\"\n  },\n  \"page_content\": \"Reinforcement learning on mathematical computation problems, both with numerical and symbolic answers, \\nrequires comparing the predicted answer to the ground truth answer contained in the dataset. We do this \\nusing the disjunction of two verifiers: a custom one described below and MathVerify (Kydlicek et al., 2025). If \\nany of them considers the expressions to be equivalent, the predicted answer is deemed correct. The custom verifier grows a set of equivalent expressions for both the predicted answer and the ground truth \\nanswer, and returns whether at the end, there is a nonempty intersection between those sets. Expressions \\nare added based on various normalizations and transformations: string normalizations and replacements, \\nnormalization of unicode math symbols to Latex, normalization of Latex expressions, numerical computatation \\nwith floating point numbers up to a certain precision, symbolic computations, simplifications and normalization \\nusing SymPy (Meurer et al., 2017) and recursion in this manner for structured objects such as matrices and \\nreal intervals. H    Prompting guide\"\n}"],["a8368e7b-9b4e-4eeb-8d69-036d17d08927","{\n  \"metadata\": {\n    \"total_chars\": 1435,\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.342249\",\n    \"chunk_number\": 220,\n    \"chunk_file\": \"220.txt\"\n  },\n  \"page_content\": \"38 \\n\u003c\u003c\u003c\\f\\n\\n  Roux, Arthur Darcet, Arthur Mensch, Baptiste Bout, Baptiste Rozi\\u00e8re, Baudouin De Monicault, Chris Bamford, \\n  Christian Wallenwein, Christophe Renaudin, Cl\\u00e9mence Lanfranchi, Darius Dabert, Devon Mizelle, Diego de las \\n  Casas, Elliot Chane-Sane, Emilien Fugier, Emma Bou Hanna, Gauthier Delerce, Gauthier Guinet, Georgii Novikov, \\n  Guillaume Martin, Himanshu Jaju, Jan Ludziejewski, Jean-Hadrien Chabran, Jean-Malo Delignon, Joachim Studnia, \\n  Jonas Amar, Josselin Somerville Roberts, Julien Denize, Karan Saxena, Kush Jain, Lingxiao Zhao, Louis Martin, \\n  Luyu Gao, L\\u00e9lio Renard Lavaud, Marie Pellat, Mathilde Guillaumin, Mathis Felardos, Maximilian Augustin, Micka\\u00ebl \\n  Seznec, Nikhil Raghuraman, Olivier Duchenne, Patricia Wang, Patrick von Platen, Patryk Saffer, Paul Jacob, \\n  Paul Wambergue, Paula Kurylowicz, Pavankumar Reddy Muddireddy, Philom\\u00e8ne Chagniot, Pierre Stock, Pravesh \\n  Agrawal, Romain Sauvestre, R\\u00e9mi Delacourt, Sanchit Gandhi, Sandeep Subramanian, Shashwat Dalal, Siddharth \\n  Gandhi, Soham Ghosh, Srijan Mishra, Sumukh Aithal, Szymon Antoniak, Thibault Schueller, Thibaut Lavril, \\n  Thomas Robert, Thomas Wang, Timoth\\u00e9e Lacroix, Valeriia Nemychnikova, Victor Paltz, Virgile Richard, Wen-Ding \\n  Li, William Marshall, Xuanyu Zhang, and Yunhao Tang. Magistral, 2025. https:\u002f\u002farxiv.org\u002fabs\u002f2506.10910. Modal Team. Modal: High-performance ai infrastructure. https:\u002f\u002fmodal.com\u002fdocs. Accessed 2025-08-18.\"\n}"],["aa80a678-534a-41f4-8a0c-737c2364924d","{\n  \"page_content\": \"The function f takes a dictionary d and a key k. It creates a new dictionary new_d and iterates over the items in d. For each key-value pair, if the key is less thank, it adds that \\n key-value pair to new_d. In this case, the dictionary is {1: 2, 2: 4, 3: 3} and the key is 3. We need to check each key in the dictionary to see if it's less than 3. - Key 1: 1 \u003c 3 is True, so we add 1: 2 to new_d. - Key 2: 2 \u003c 3 is True, so we add 2: 4 to new_d. - Key 3: 3 \u003c 3 is False, so we skip 3: 3. So, the resulting dictionary new_d should be {1: 2, 2: 4}. \u003c\u002fthink\u003e\",\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.275813\",\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 556,\n    \"chunk_number\": 50,\n    \"chunk_file\": \"50.txt\"\n  }\n}"],["ab21fe8b-2a02-4681-b48c-7c952bb09674","{\n  \"metadata\": {\n    \"chunk_file\": \"239.txt\",\n    \"chunk_number\": 239,\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.349454\",\n    \"total_chars\": 784\n  },\n  \"page_content\": \"Rowan Zellers, Ari Holtzman, Yonatan Bisk, Ali Farhadi, and Yejin Choi. Hellaswag: Can a machine really finish your \\n  sentence? In Anna Korhonen, David R. Traum, and Llu\\u00eds Marquez, editors, Proceedings of the 57th Conference \\n  of the Association for Computational Linguistics, ACL 2019, Florence, Italy, July 28- August 2, 2019, Volume \\n  1: Long Papers, pages 4791-4800. Association for Computational Linguistics, 2019. doi: 10.18653\u002fV1\u002fP19-1472. https:\u002f\u002fdoi.org\u002f10.18653\u002fv1\u002fp19-1472. Biao Zhang and Rico Sennrich. Root mean square layer normalization. Curran Associates Inc., Red Hook, NY, USA, \\n  2019. David W Zhang, Micha\\u00ebl Defferrard, Corrado Rainone, and Roland Memisevic. Grounding code understanding in \\n  step-by-step execution. https:\u002f\u002fopenreview.net\u002fforum?id=MUr7F193QS.\"\n}"],["aba670fa-e743-4e51-b6a9-519aca626f07","{\n  \"page_content\": \"\u003c | frame_sep|\u003e) as \\nsuch. 8 \\n\u003c\u003c\u003c\\f\\n\\nWe refer to \\u00a7B for additional example trajectories from CWM, including self-correcting SWE behavior, a \\ncomparison of the advantages and disadvantages of strict trace prediction compared to natural language \\n(and why we think their combination is worth exploring), further demonstrations of how we can adapt trace \\nprediction to elicit code generation, and an example of using CWM to predict program termination. 4    CWM: architecture, pre-training, and scaling laws \\n\\nWe next share details on the CWM architecture, final pre-training recipe, and scaling law experiments. Specific details about our efficient training infrastructure can be found in \\u00a76. 4.1   Architecture and hyper-parameters\",\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 729,\n    \"chunk_number\": 55,\n    \"chunk_file\": \"55.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.277841\"\n  }\n}"],["ac56cf1c-dec5-404b-a829-c9416974ca7c","{\n  \"page_content\": \"The prompt features a terminating example in HaltEval-prelim.\",\n  \"metadata\": {\n    \"chunk_number\": 322,\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"322.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.378617\",\n    \"total_chars\": 61\n  }\n}"],["acad0a3e-cdc3-4e8e-99b5-eeb7119fa7ae","{\n  \"page_content\": \"29 \\n\u003c\u003c\u003c\\f\\n\\nTable 12 Agentic, code, and mathematical reasoning benchmarks. We compare CWM to baselines with roughly the \\nsame number of parameters.(    LCB results for gpt-oss-20B (high) suffered from repeated time-outs due to repetitive \\nreasoning, despite our prompt-tuning efforts - which boosted gpt-oss (low\u002fmedium) scores by about 10 %.) \\n\\n                      Magistral-small-1.2-24B    Qwen3-32B      gpt-oss-20B (low \u002f med \u002f high)   CWM \\n         LCBv5                  70.0                 65.7             54.2 \u002f 66.9 1               68.6 \\n         LCBv6                  61.6                 61.9             47.3 \u002f 62.0 \u002f _t            63.5 \\n         Math-500                 -                  97.2                      -                  96.6 \\n          AIME24                86.1                 81.4             42.1 \u002f 80.0 \u002f 92.1          76.0 \\n          AIME25                77.3                 72.9             37.1 \u002f 72.1 \u002f 91.7          68.2\",\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 167,\n    \"chunk_file\": \"167.txt\",\n    \"total_chars\": 964,\n    \"processed_date\": \"2025-12-17T04:00:35.322632\"\n  }\n}"],["acf248d2-a086-4110-b3b1-7f0a921ee681","{\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 148,\n    \"processed_date\": \"2025-12-17T04:00:35.315483\",\n    \"total_chars\": 402,\n    \"chunk_file\": \"148.txt\"\n  },\n  \"page_content\": \"We also observe good generalization performance across the six languages tested in the benchmark, as shown \\nin Figure 17b. Many top-performing models, such as 03-pro (84.9%) (OpenAI, 2025b), DeepSeek R1 (71.4%), \\nand Qwen3 235B (59.6%), achieve substantially higher scores using the \\\"diff\\\" edit format. However, CWM \\nwas not optimized for this format and does not reach competitive performance with it.\"\n}"],["acf38501-b8b5-4a74-be05-90b6c22206d1","{\n  \"metadata\": {\n    \"total_chars\": 247,\n    \"processed_date\": \"2025-12-17T04:00:35.275495\",\n    \"chunk_number\": 49,\n    \"chunk_file\": \"49.txt\",\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"Python function: \\n def f(d, k): \\n    new_d = {} \\n     for key, val in d.items(): \\n        if key \u003c k: \\n           new_d[key] = val \\n     return new_d \\n assert f({1: 2, 2: 4, 3: 3}, 3) == ?? Let's analyze the function call f({1: 2, 2: 4, 3: 3}, 3).\"\n}"],["ad93dd7d-f241-401f-8387-35e421eb71c0","{\n  \"page_content\": \"Figure B.27        CWM interspersing code generation and execution tracing. As indicated by \\\" ... \\\", we have omitted parts \\n\\nof CWM reasoning for clarity here.\",\n  \"metadata\": {\n    \"chunk_number\": 310,\n    \"processed_date\": \"2025-12-17T04:00:35.374790\",\n    \"total_chars\": 159,\n    \"chunk_file\": \"310.txt\",\n    \"source\": \"CWM-Meta\"\n  }\n}"],["ad94f654-ed4d-4cca-816c-320001ed0b85","{\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"178.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.326942\",\n    \"total_chars\": 1483,\n    \"chunk_number\": 178\n  },\n  \"page_content\": \"8.3   Limitations & future research \\nWe explicitly release CWM as a research model under a noncommercial research license for the community to \\nexplore the opportunities afforded by world modeling and reasoning in computational environments. As such, \\nour models come with a number of limitations which we outline below to help the research community make \\nthe most of CWM, while being aware of its shortcomings and avoiding accidental misuse. As these are research-only models, they are not suitable for production use cases. Although we have performed \\nsome limited evaluations, we have not conducted a full range of possible evaluations for these models. The \\nperformance of CWM in production and real-world scenarios has not been evaluated by Meta. These models \\nhave not been fully evaluated or trained for user-facing interactions and they are not intended for such use. Researchers are recommended to exercise caution when deploying or using these models. Similarly, CWM should not be used as a general-purpose assistant or chat model. While it was exposed to \\nsome level of instruction-following data during SFT, CWM has not undergone any thorough optimization \\nfor general chat-bot use, such as RLHF (Ouyang et al., 2022). General chat use is not an intended use of \\nCWM and generations may diverge from expectations and\u002for be inappropriate or inaccurate. Further, CWM \\ntraining focuses strongly on code generation and reasoning with code. Thus, our models may be lacking in\"\n}"],["ad99adef-f81c-434f-a9f3-b5ddfca7aae7","{\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 77,\n    \"processed_date\": \"2025-12-17T04:00:35.286324\",\n    \"chunk_file\": \"77.txt\",\n    \"total_chars\": 378\n  },\n  \"page_content\": \"for agentic SWE RL. So we explicitly reject any trajectory containing any token yt that is both rare and \\n      generated with low probability: id(yt) \u003e 100,000 and logprob(yt) \u003c- log(128, 256) - 2 where 128, 256 \\n      is the vocabulary size and the thresholds are tuned for high precision. Gibbrish typically consists of \\n      a window of tokens generated at low probability.\"\n}"],["adc0f0dd-646d-4342-9a7e-d516652c180b","{\n  \"metadata\": {\n    \"chunk_file\": \"84.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.289600\",\n    \"chunk_number\": 84,\n    \"total_chars\": 523,\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"Agentic SWE RL substantially improves our model's software reasoning and engineering capability \\n(e.g., on SWE-bench Verified (Jimenez et al., 2024)) by enhancing the model's agentic reasoning and tool-use \\nskills (see \\u00a7K for the capability evolution during RL training). Its philosophy is to remain simple yet general: \\nan LLM agent tackles a task end-to-end through reasoning and tool execution, without relying on task-specific \\npost-processing. The same design is applied to the agentic coding environment (see \\u00a75.3.3).\"\n}"],["afafcc6f-6509-479b-a4b6-8b413b358558","{\n  \"page_content\": \"def f(nums): \\n    a = 0 \\n    for i in range(len(nums)): \\n        nums. insert(i, nums[a]) \\n        a += 1 \\n    return nums \\n assert ... f([1, 3, -1, 1, -2, 6]) == ?? -END OF PROMPT --- \\n Okay, let's see. I need to figure out what the function f does when given the list [1, 3, -1, 1, -2, 6]. The function starts by initializing a variable a to 0. Then it loops over the \\n         range of the length of nums. But wait, the length of nums is 6 initially. However, inside the loop, it's inserting elements into nums, which will change the length of the list \\n         as the loop progresses. That might affect how many times the loop runs.\",\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.365484\",\n    \"chunk_number\": 283,\n    \"chunk_file\": \"283.txt\",\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 637\n  }\n}"],["b0017108-1a31-40a8-aa73-debe1d2b8fd6","{\n  \"page_content\": \"dual_coef_indices = np.tile(np.arange(n_SV), n_class) \\n -        dual_coef_indptr = np.arange(0, dual_coef_indices.size + 1, \\n -                                   dual_coef_indices.size \u002f n_class) \\n +        if dual_coef_indices.size == 0: \\n +           dual_coef_indptr = np.array([0, 0], dtype=np.int32) \\n +        else: \\n +           dual_coef_indptr = np.arange(0, dual_coef_indices.size + 1, \\n +                                       dual_coef_indices.size \u002f n_class) \\n         self.dual_coef_ = sp.csr_matrix( \\n             (dual_coef_data, dual_coef_indices, dual_coef_indptr), \\n              (n_class, n_SV)) \\n\\n \u003c\u002fsubmission\u003e \\n\\n Review the patch content and ensure it correctly resolves the issue. If necessary, you can continue refining the patch and submit an updated version. The patch looks good. It adds a check for when \\\"dual_coef_indices' is empty and handles it by setting \\\"dual_coef_indptr\\\" to \\\"[0, 0]\\\", which should correctly create an empty CSR matrix \\n for self. dual_coef_`. This should resolve the ZeroDivisionError issue when \\\"support_vectors_ is empty. I'm confident that this patch is correct and should fix the problem without introducing any regressions, as all tests passed after the fix. ## Issue Summary \\n\\n The issue was a ZeroDivisionError in the \\\"_sparse_fit' method of the SVM class when using sparse data and the \\\"support_vectors_\\\" attribute was empty. The error occurred because of a \\n division by zero when calculating the dual_coef_indptr' for the CSR matrix of dual coefficients. ## Investigation and Reproduction ...\",\n  \"metadata\": {\n    \"chunk_number\": 261,\n    \"chunk_file\": \"261.txt\",\n    \"total_chars\": 1555,\n    \"processed_date\": \"2025-12-17T04:00:35.358003\",\n    \"source\": \"CWM-Meta\"\n  }\n}"],["b023b6a7-4b00-47d5-b25a-72c7536618df","{\n  \"page_content\": \"We show early examples of this in Figures B.26 and B.27. This method of reasoning-via- \\ntracing for program generation is reminiscent of work by Hoare (1971); Dijkstra (1976) on using logical reasoning \\nabout program execution to guide development rather than only using it to confirm correctness post-hoc. 6 \\n\u003c\u003c\u003c\\f\\n\\n Okay, I need to solve this problem where I have to check if a given string is evenly separated.\",\n  \"metadata\": {\n    \"total_chars\": 412,\n    \"chunk_file\": \"33.txt\",\n    \"chunk_number\": 33,\n    \"processed_date\": \"2025-12-17T04:00:35.270243\",\n    \"source\": \"CWM-Meta\"\n  }\n}"],["b06476a5-3e61-4632-ad29-a863d11e5bd0","{\n  \"metadata\": {\n    \"chunk_file\": \"131.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.308904\",\n    \"total_chars\": 802,\n    \"chunk_number\": 131,\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"optimization   optimization optimization optimization \\n                 Trainers         step n        step n+1   step n+2       step n+3 \\n                                       model weights              model weights \\n                                         update                    update          Time \\n\\nFigure 15 In CWM-RL, model weights can be updated at any time on the worker side: between trajectories, within a \\ntrajectory between steps, or even during token generation. Compared to traditional RL, this removes all synchronization \\noverhead, maximizing worker throughput while minimizing idle time. In exchange for never blocking inference, we \\naccept that trajectories will potentially use mixed weights, though frequent model updates ensure that generations \\nremain reasonably on-policy.\"\n}"],["b19f67f5-f29a-4bea-978b-f59b524248b8","{\n  \"metadata\": {\n    \"total_chars\": 92,\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.246424\",\n    \"chunk_number\": 3,\n    \"chunk_file\": \"3.txt\"\n  },\n  \"page_content\": \"meta. com\u002fresources\u002fmodels-and-libraries\u002fcwm-downloads, \\n    huggingface.co\u002ffacebook\u002fcwm, ..\"\n}"],["b1f8313a-ee2b-4781-8e79-d29017ab7485","{\n  \"page_content\": \"Let's see. Let's take i=6: \\n g(6) = g(g(g(4) - 1))+1 \\n g(4) is 1, so 1 -1 = 0. Then g(0) is 0. Then g(0) is 0. So 0 +1 = 1. Same result. So regardless of the input i (as long as it's positive), g(i) returns 1. That's a key insight. So g(i) is a function that returns 0 if i \u003c= 0, and 1 otherwise. Now, moving on to h(j): \\n h(j) is defined as: \\n If j \u003c= 0, return 0. Otherwise, return h(g(j) - 1) - 1. But since g(j) is 1 for any j \u003e 0, then g(j) -1 is 0. So for any j \u003e 0, h(j) becomes h(0) -1. But h(0) is 0, so h(j) = 0 -1 = - 1. Wait, but then h(j) for j \u003e 0 would be \\n        -1. But then, if we call h again with that value? Wait, let's step through h(j) for j \u003e 0. Let's take j=1: \\n h(1) = h(g(1) - 1) -1 \\n g(1) is 1, so 1 -1 = 0. Then h(0) is 0. So 0 -1 = - 1. So h(1) returns -1. What about j=2? h(2) = h(g(2) -1) -1 \\n g(2) is 1, so 1 -1 = 0. h(0) is 0. 0 -1 = - 1. So h(2) is -1. Same for any j \u003e 0. So h(j) for j \u003e 0 is always -1. So when f(x) calls h(x), if x is positive, h(x) returns -1, and then f returns None. If x is 0 or negative, h(x) \\n        returns 0, and then f returns None. Wait, but this seems too straightforward. So in all cases, h(x) terminates. Because even if x is a very large number, h(x) just does a constant number of steps. For \\n        example, h(1000) would compute g(1000) which is 1, subtract 1 to get 0, then call h(0) which is 0, subtract 1 to get -1. So it's a finite number of steps. Therefore, h(x) always terminates, regardless of the input x. Therefore, the function f(x) will always terminate, no matter what input x is given.\",\n  \"metadata\": {\n    \"chunk_number\": 319,\n    \"chunk_file\": \"319.txt\",\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.377845\",\n    \"total_chars\": 1574\n  }\n}"],["b2151d4c-e5f5-46d2-a564-1a7bfcc311f9","{\n  \"page_content\": \"Otherwise, return g(g(g(i-2) - 1)) + 1. Hmm, that's a recursive function. Let's see what happens when we call g with some positive integer. For example, if i is 1: \\n g(1) would call g(g(g(-1) - 1)) +1. Since g(-1) is 0, this becomes g(g(-1) -1) = g(0 -1) = g(-1) = 0. Then, adding 1 gives 1. Wait, so g(1) would return 1? Let me \\n        check that again. Wait, let's step through g(1): \\n g(1) calls g(g(g(1-2) - 1)) +1 \\n 1-2 is -1, so g(-1) is 0. Then, 0 -1 is -1. So g(-1) is 0 again. Then, the innermost g is 0, so we have g(0) +1. Wait, no, let me re-express this. Wait, the expression is g(g(g(i-2) - 1)) + 1. So for i=1: \\n i-2 = - 1. So g(-1) is 0. Then, subtract 1: 0 -1 = - 1. Then, call g(-1) again, which is 0. Then, call g(0) which is 0. Then add 1. Wait, no, maybe I'm getting the order \\n        wrong. Wait, the innermost call is g(i-2). So for i=1, i-2 is -1. So g(-1) returns 0. Then subtract 1: 0 -1 = - 1. Then, call g(-1) again, which returns 0. Then, call g(0), \\n        which returns 0. Then add 1. Wait, that seems off. Let me write it step by step: \\n g(1) = g(g(g(1-2) - 1))+1 \\n = g(g(g(-1) - 1)) +1 \\n = g(g(0 - 1)) + 1 (since g(-1) is 0) \\n = g(g(-1)) + 1 \\n = g(0) + 1 (since g(-1) is 0) \\n = 0 + 1 \\n = 1 \\n So g(1) returns 1. That's interesting. What about g(2)? g(2) =g(g(g(0) -1))+1 \\n g(0) is 0, so 0 -1 = - 1. Then g(-1) is 0. Then g(0) is 0. So 0 +1 = 1. So g(2) is 1. Wait, that's the same as g(1). What about g(3)? g(3) = g(g(g(1) - 1))+1\",\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.376999\",\n    \"chunk_number\": 317,\n    \"chunk_file\": \"317.txt\",\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 1465\n  }\n}"],["b2b8d6ad-1374-47f1-82db-805120df8c7f","{\n  \"page_content\": \"by considering individual finite traces as in CWM training: non-termination cannot be observed by executing \\na trace in finite time, and termination on all inputs cannot be feasibly observed by enumerating traces. Figure B.28 in the Appendix illustrates termination reasoning, whereby CWM considers several concrete \\ninputs before generalizing to the conclusion of terminating on all inputs.\",\n  \"metadata\": {\n    \"chunk_file\": \"154.txt\",\n    \"total_chars\": 391,\n    \"chunk_number\": 154,\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.318122\"\n  }\n}"],["b3589f58-4a4d-4f75-87c2-9805ac5a650f","{\n  \"page_content\": \"This makes sure that tools are rendered with a \\nsyntax template suitable for prompting CWM. For Mini-SWE-Agent, we follow the official budget of 250 \\nturns. For OpenHands, we report results for 40, 128, and 500 turns. Additionally, we report results for our \\n\\n                                                   24 \\n\u003c\u003c\u003c\\f\\n\\n           70 b9fe-411d1fe024f0","{\n  \"page_content\": \"Results are reported for CWM, Qwen3-32B and Gemma-3- \\n27B. Context   Gemma-3-27B      Qwen3-32B     CWM \\n                             32k       91.1             94.4          84.3 \\n                             128k       66.0            85.6          69.7 \\n\\n J   RULER evaluation \\n\\nWe compare CWM against Gemma3-27B and Qwen3-32B post-trained models. Results can be seen on Table 14. Results suggest that CWM outperforms Gemma3-27B under 128 k sequence length, but falls short under \\n 32 k sequence length. Both CWM and Gemma3-27B achieve worse performance compared to Qwen3-32B. However, it is important to note that Qwen3-32B uses full attention across all layers, resulting in significantly \\n higher computational costs, particularly for longer sequences. Therefore, we believe CWM represents a good \\n trade-off between efficiency and model performance. K    Agent capabilities learnt during RL training\",\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.387745\",\n    \"chunk_number\": 346,\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"346.txt\",\n    \"total_chars\": 906\n  }\n}"],["b5727661-bce8-4a17-892a-d588111a215d","{\n  \"metadata\": {\n    \"chunk_number\": 6,\n    \"total_chars\": 586,\n    \"chunk_file\": \"6.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.257746\",\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"1 \\n\u003c\u003c\u003c\\f\\n\\n                       PRE-TRAINING                                  POST-TRAINING \\n               General         Code World Modeling      Supervised Fine-tuning Joint Reinforcement Learning \\n              Pre-training        Mid-training         Instruction and Reasoning Agentic and Reasoning \\n              8T tokens            5T tokens               100B tokens            172B tokens \\n              8k context          131k context             32k context            131k context \\n\\n
