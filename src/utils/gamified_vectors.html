                                                   Rollout threads \\n\\n                 Workers \\n                                                                                       Observation \\n                        worker n                                                       Tokens \\n                                                                                       generation\",\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.308260\",\n    \"total_chars\": 1352,\n    \"chunk_number\": 130,\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"130.txt\"\n  }\n}"],["2333024f-f9a5-40a2-a697-b22cf624ee5c","{\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.351089\",\n    \"chunk_file\": \"243.txt\",\n    \"total_chars\": 1549,\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 243\n  },\n  \"page_content\": \"The authors thank Ariel Stolerman, Ayelet Regev Dabah, Dani Shames, Tamir Meyer and Nadav Azaria for \\nsupport in building executable repository images at scale; Jeff Yang, Yonatan Komornik and Tarun Anand \\nfor support in curating GitHub PR and Issue metadata; Qian Liang, Meng Zhang, Hanwen Zha, Ananya \\nSaxena, Emily Dinan, Melanie Kambadur for the support in data preparation; Yining Yang, Sten Sootla, \\nChris Waterson and Michael Jiang for support in the development of RepoAgent and additional repository \\nimages; Eslam Elnikety, Jamie Cahill, Christine Wang, Don Landrum, Sadman Fahmid, Andrew Hamiel, \\nNed Newton, Andrii Golovei, Rashmi Narasimha, Zack Leman, Mehrdad Mahdavi, Leon Yang, Joshua Fink, \\nSargun Dillon, Jeff Hanson and Zach Wentz for the internal sandboxing platform and the code execution and \\nDocker execution services built atop it, enabling secure and massively parallel execution of untrusted code; \\nMathurin Videau, Leonid Shamis, Jeremy Reizenstein, Maria Lomeli, Lucca Bertoncini, Vivien Cabannes, \\nCharles Arnal and Pascal Kesseli for their contributions to the CWM research codebase and training and \\nevaluation infrastructure; Julien Vanegue for advice on practical aspects of the halting problem; Daniel Fried \\nand Rishabh Singh for support in designing and developing Agentic SWE RL; the Modal team - especially \\nJonathon Belotti, Matthew Saltz, Colin Weld, Peyton Walters, Deven Navani, Michael Waskom, Advay Pal, \\nAkshat Bubna, Alec Powell, Lucy Zhang, and Eric Zhang - for extensive support with remote execution,\"\n}"],["2395afda-4cb1-4a29-8521-59f5ab7de26d","{\n  \"page_content\": \"Running \\nboth RepoAgent and Activ methods in parallel, we created over 35 k unique executable repository images. 2.2      Python tracing: neural code interpretation data \\nThe first type of CWM data we present is memory tracing of Python programs. This involves gathering \\nexecutable functions or executable repository images, and running them using different IO pairs or CI tests, \\nwhile capturing the state of the memory, chiefly the local variables, after each line is executed. This process \\n\\n                                                                      3 \\n\u003c\u003c\u003c\\f\\n\\n                                            \u003c|trace_context_start|\u003e \\n                def count(s, t): \\n                   n = 0 \\n                   for c in s: \\n                     n += int (c == t) \\n                   return n \\n\\n                count(\\\"strawberry\\\", \\\"r\\\") # \u003c\u003c START_OF_TRACE \\n\\n                                               \u003c|frame_sep|\u003e \\n              \u003c|call_sep|\u003e {\\\"s\\\": \\\"'strawberry'\\\", \\\"t\\\": \\\"'r'\\\"} \u003c|action_sep|\u003e def count(s, t): \\n                                               \u003c|frame_sep|\u003e \\n              \u003c|line_sep|\u003e {\\\"s\\\": \\\". .\",\n  \"metadata\": {\n    \"chunk_file\": \"17.txt\",\n    \"chunk_number\": 17,\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.263160\",\n    \"total_chars\": 1124\n  }\n}"],["260c6b45-e652-4f23-ab55-51dcf37e275e","{\n  \"metadata\": {\n    \"total_chars\": 346,\n    \"chunk_file\": \"199.txt\",\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 199,\n    \"processed_date\": \"2025-12-17T04:00:35.333882\"\n  },\n  \"page_content\": \"Association for Computational Linguistics, 2019. doi: \\n  10.18653\u002fV1\u002fN19-1246. https:\u002f\u002fdoi.org\u002f10.18653\u002fv1\u002fn19-1246. Abhimanyu Dubey, Abhinav Jauhri, Abhinav Pandey, Abhishek Kadian, Ahmad Al-Dahle, Aiesha Letman, Akhil \\n  Mathur, Alan Schelten, Amy Yang, Angela Fan, et al. The llama 3 herd of models. ar Xiv e-prints, pages arXiv-2407, \\n  2024.\"\n}"],["2651279c-3438-4bf5-8ec6-bebad1a2ea45","{\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.343679\",\n    \"chunk_number\": 224,\n    \"chunk_file\": \"224.txt\",\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 759\n  },\n  \"page_content\": \"Jiayi Pan, Xingyao Wang, Graham Neubig, Navdeep Jaitly, Heng Ji, Alane Suhr, and Yizhe Zhang. Training software \\n  engineering agents and verifiers with swe-gym. In Proceedings of the 42nd International Conference on Machine \\n  Learning (ICML 2025), 2025. https:\u002f\u002farxiv.org\u002fabs\u002f2412.21139. arXiv:2412.21139, accepted at ICML 2025. Alex Piche, Rafael Pardinas, Ehsan Kamalloo, and Dzmitry Bahdanau. Pipeline RL: fast LLM agent training, 2025. https:\u002f\u002fhuggingface.co\u002fblog\u002fServiceNow\u002fpipelinerl. Alec Radford, Karthik Narasimhan, Tim Salimans, and Ilya Sutskever. Improving language understanding by generative \\n  pre-training. Technical report, OpenAI, 2018. https: \u002f\u002fcdn. openai.com\u002fresearch-covers\u002flanguage-unsupervised\u002f \\n  language_understanding_paper . pdf.\"\n}"],["27e98ada-b7b1-4829-9b9f-9b0f2b0f678e","{\n  \"metadata\": {\n    \"chunk_number\": 302,\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"302.txt\",\n    \"total_chars\": 1238,\n    \"processed_date\": \"2025-12-17T04:00:35.371978\"\n  },\n  \"page_content\": \"From a given code context, CWM \\npredicts the initial state of the trace (we selected this example based on the prediction of the c parameter). We \\n can then prompt the model to generate the program state at the next line, or to directly predict the return value \\n after a function is entered. In this example, we step into the count_letters function, step out of it after a few steps \\n(implemented via continuous predictions until the function returns), and finally use next to predict the return value of \\n format_answer without line-by-line unrolling. In-between, we print the local variables as generated by CWM. \u003c|begin_of_text|\u003e\u003c|trace_context_start |\u003efrom mysterious_library import f \\n assert f(2, 2) == 4 \\n assert f(3, 7) == 10 \\n assert f(-1, -8) == - 9 \\n assert f(1, 1) == 2 \\n  f(5, 5) # \u003c\u003c START_OF_TRACE \\n  \u003c| frame_sep |\u003e \\n    -END OF PROMPT --- \\n  \u003c| call_sep|\u003e{}\u003c|action_sep|\u003ef(5, 5) # \u003c\u003c START_OF_TRACE \\n  \u003c| frame_sep|\u003e\u003c|line_sep|\u003e{}\u003c|action_sep|\u003ef(5, 5) # \u003c\u003c START_OF_TRACE \\n  \u003c| frame_sep|\u003e\u003c|call_sep|\u003e{\\\"a\\\": \\\"5\\\", \\\"b\\\": \\\"5\\\"}\u003c|action_sep|\u003edef f(a, b): \\n  \u003c| frame_sep|\u003e\u003c|line_sep|\u003e{\\\"a\\\": \\\" .. \\\", \\\"b\\\": \\\" .. \\\"}\u003c|action_sep|\u003e return a + b \\n  \u003c| frame_sep|\u003e\u003c|return_sep|\u003e\u003c|action_sep|\u003e return a + b \\n \u003c|arg_sep|\u003e\\\"10\\\"\u003c|frame_sep|\u003e\"\n}"],["27f6f0b1-b671-4480-b678-5d11642b4356","{\n  \"metadata\": {\n    \"chunk_file\": \"86.txt\",\n    \"chunk_number\": 86,\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 939,\n    \"processed_date\": \"2025-12-17T04:00:35.290611\"\n  },\n  \"page_content\": \"Once you've submitted at least once and \\n are confident in your solution, provide a final response summarizing your work ... Your primary objective is to ensure patch correctness above all else - thoroughly explore the codebase, think hard, and leverage significant \\n execution to verify correctness by writing comprehensive tests to validate your solution and running existing tests to prevent regressions. Only submit when you are genuinely confident in your patch's correctness ... \u003cthink\u003e ... \u003ctool: bash\u003e ... ... \u003cthink\u003e    \u003ctool: edit\u003e   ... \u003cthink\u003e    \u003ctool: bash\u003e pytest   ... \u003cthink\u003e     ... ... \u003cthink\u003e ... \u003c \u002fthink\u003e \u003ctool: bash\u003e git diff ... \u003e submission. patch \u003c\u002ftool\u003e (No output) \\n \u003cthink\u003e ... \u003c \u002fthink\u003e \u003ctool: submit\u003e submission. patch \u003c\u002ftool\u003e The following patch content is marked as your final submission ... \u003cthink\u003e ... Now, I'll provide a summary ... \u003c \u002fthink\u003e ## Issue summary ... ## Reproduction ... ## Code changes ...\"\n}"],["290615fa-86f3-484e-9d2b-1aad4a55c94c","{\n  \"metadata\": {\n    \"chunk_number\": 41,\n    \"processed_date\": \"2025-12-17T04:00:35.272959\",\n    \"chunk_file\": \"41.txt\",\n    \"total_chars\": 90,\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"The reasoning steps are \\n\\nshortened and some details are omitted due to space constraints.\"\n}"],["29a4f133-e362-4188-988b-41661b6ec059","{\n  \"metadata\": {\n    \"chunk_file\": \"314.txt\",\n    \"chunk_number\": 314,\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.376056\",\n    \"total_chars\": 917\n  },\n  \"page_content\": \"This function might either terminate for all inputs or diverge for some input. If it \\n        terminates for all inputs, then answer \\\"# T\\\". Otherwise, if it diverges, provide an input such that executing f on the input leads to a diverging execution \\n        (i.e., f does NOT halt with that input), followed by the comment \\\"# NT\\\". In case non-terminating inputs exist, there may be multiple possible answers, but you \\n        should only output one. Express your final answer with either \\\"# T\\\", if the function terminates for all inputs, or as function call to f containing the input \\n        that leads to the non-terminating execution followed by the comment \\\"# NT\\\". ... def f(x): \\n     def g(i): \\n        if i \u003c= 0: \\n           return 0 \\n        return g(g(g(i-2) - 1)) + 1 \\n    def h(j): \\n        if j \u003c= 0: \\n           return 0 \\n        return h(g(j)-1) - 1 \\n    h(x) \\n     return None \\n\\n f ( ?? ) # Terminates?\"\n}"],["29f2af68-24f8-464d-a905-10210d8ded07","{\n  \"page_content\": \"\\u00b7 Scientific reasoning: GPQA (Main\u002fExtended\u002fDiamond) (Rein et al., 2023).\",\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 335,\n    \"processed_date\": \"2025-12-17T04:00:35.382887\",\n    \"total_chars\": 73,\n    \"chunk_file\": \"335.txt\"\n  }\n}"],["2aab10f3-de5e-4580-ba32-2335d72e1109","{\n  \"metadata\": {\n    \"total_chars\": 106,\n    \"chunk_number\": 171,\n    \"chunk_file\": \"171.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.324366\",\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"15 For LCBv5, we report results starting from October to be consistent with the numbers reported by Qwen3.\"\n}"],["2c4cdbb0-00c9-47f3-927b-8f32e7a2199a","{\n  \"page_content\": \"Design.\",\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.289197\",\n    \"total_chars\": 7,\n    \"chunk_file\": \"83.txt\",\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 83\n  }\n}"],["2c6a2011-b985-49ca-bb6e-b21468081a1f","{\n  \"page_content\": \").\",\n  \"metadata\": {\n    \"chunk_number\": 313,\n    \"total_chars\": 2,\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.375601\",\n    \"chunk_file\": \"313.txt\"\n  }\n}"],["2c88644f-50ac-4e21-9700-78d12fd4ff5d","{\n  \"metadata\": {\n    \"chunk_number\": 205,\n    \"chunk_file\": \"205.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.336048\",\n    \"total_chars\": 906,\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"Dan Hendrycks, Steven Basart, Saurav Kadavath, Mantas Mazeika, Akul Arora, Ethan Guo, Collin Burns, Samir \\n  Puranik, Horace He, Dawn Song, et al. Measuring coding challenge competence with apps. ar Xiv preprint \\n  ar Xiv:2105.09938, 2021a. Dan Hendrycks, Collin Burns, Saurav Kadavath, Akul Arora, Steven Basart, Eric Tang, Dawn Song, and Jacob Stein- \\n  hardt. Measuring mathematical problem solving with the MATH dataset. In Joaquin Vanschoren and Sai-Kit Yeung, \\n  editors, Proceedings of the Neural Information Processing Systems Track on Datasets and Benchmarks 1, NeurIPS \\n  Datasets and Benchmarks 2021, December 2021, virtual, 2021b. https:\u002f\u002fdatasets-benchmarks-proceedings. neurips.cc\u002fpaper\u002f2021\u002fhash\u002fbe83ab3ecd0db773eb2dc1b0a17836a1-Abstract-round2.html. C. A. R. Hoare. Proof of a program: FIND. Commun. ACM, 14(1):39-45, 1971. doi: 10.1145\u002f362452.362489. https:\u002f\u002fdoi.org\u002f10.1145\u002f362452.362489.\"\n}"],["2ce62474-d596-41ae-a099-a5a374d98006","{\n  \"metadata\": {\n    \"chunk_number\": 311,\n    \"chunk_file\": \"311.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.375053\",\n    \"total_chars\": 97,\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"Figure B.27        CWM interspersing code generation and execution tracing. As indicated by \\\" ...\"\n}"],["2d4b0204-6204-4daf-a695-b5f9c106079a","{\n  \"metadata\": {\n    \"chunk_file\": \"36.txt\",\n    \"chunk_number\": 36,\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.271016\",\n    \"total_chars\": 2\n  },\n  \"page_content\": \"..\"\n}"],["2da6534c-4641-4ad1-a3c2-091b24decb5c","{\n  \"metadata\": {\n    \"chunk_number\": 263,\n    \"total_chars\": 1522,\n    \"processed_date\": \"2025-12-17T04:00:35.358690\",\n    \"chunk_file\": \"263.txt\",\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"Okay, so the grep command shows that in django\u002fdb\u002fmodels\u002ffields\u002fjson.py, there are several instances of json.dumps being used. The ones in lines 84 and 95 are the ones in the \\n get_prep_value and validate methods, respectively. These are the ones that might need to be modified to include ensure_ascii=False to fix the Unicode display issue in the admin. However, wait a minute. The get_prep_value method is used to prepare the value for the database, but the display_in the admin uses this method as well. If we modify get_prep_value to \\n include ensure_ascii=False, that could affect how the data is stored in the database, but JSON fields should handle Unicode correctly regardless. However, ... But let me think again. The display_for_field function in django\u002fcontrib\u002fadmin\u002futils.py calls get_prep_value on the JSONField instance. If get_prep_value returns a string with ensure_ascii=False, then the \\n displayed JSON data will show Unicode characters correctly. So, modifying the get_prep_value method to include ensure_ascii=False in the json.dumps call should fix the issue. Similarly, the validate method's json. dumps call might not need to \\n change, but to be consistent, maybe it's better to include ensure_ascii=False there as well, although it's less critical for display purposes. Additionally, the lines 122, 383, and 416 \\n use json. dumps, but these seem to be for different purposes (compiling JSON paths, etc.). However, if these are part of the serialization process for JSONField values, they might also\"\n}"],["2fe43bf4-acb5-4021-b9bb-52372cbf70b3","{\n  \"page_content\": \"Figures 2 and 16 show results for SWE-bench Verified. CWM achieves pass@1 resolve \\nrates of 65.8% with test-time-scaling and 53.9% without test-time scaling (averaged over 4 runs). With \\ntest-time scaling, CWM outperforms open-weight models at similar size and is competitive to larger and \\nproprietary models. The base score without test-time scaling also surpasses open-weight models with similar \\nparameter counts and remains respectable even when comparing to much larger models such as GPT-oss- \\n120B (Agarwal et al., 2025), Qwen3-Coder (Yang et al., 2025a), and Kimi K2 (Kimi Team et al., 2025). For Test-Time-Scaling (TTS) on SWE-bench Verified, we first generate k candidate solutions as well as 40 \\nnovel unit tests in parallel agentic loops for each instance. Like Agentless (Xia et al., 2024), we ask the model \\nto generate tests that verify patch correctness and reproduce the original bug, enabling us to filter out tests \\nthat fail to reproduce errors. Following SWE-RL (Wei et al., 2025), we keep the top-5 majority tests for each \\ninstance. Since candidate solutions are often similar in the number of existing tests they pass, we prioritize \\nthe strongest candidates by keeping only those patches that pass the highest number of existing tests. We \\nthen execute the remaining patches on the filtered set of novel tests and select the patch with the highest pass \\nrate for submission. In case of ties, we prioritize the majority patch, and if the tie remains, we choose the \\npatch whose trajectory has fewer tokens. We refer to this approach as best@k.\",\n  \"metadata\": {\n    \"chunk_file\": \"137.txt\",\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 137,\n    \"processed_date\": \"2025-12-17T04:00:35.311391\",\n    \"total_chars\": 1568\n  }\n}"],["302a3618-2b7a-416f-9f8c-f463439fa4d4","{\n  \"metadata\": {\n    \"chunk_file\": \"324.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.379152\",\n    \"chunk_number\": 324,\n    \"total_chars\": 117,\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"52 \\n\u003c\u003c\u003c\\f\\n\\nThe gradient of Pi,t(0) \\u00c2\\u00a1 equals Told Vlog \\u00c2\\u00a1, which is the importance-weighted policy gradient estimator.\"\n}"],["315a5c26-ad12-46fd-86b6-15465cbcc8f9","{\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.355023\",\n    \"chunk_file\": \"253.txt\",\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 253,\n    \"total_chars\": 58\n  },\n  \"page_content\": \"43 \\n\u003c\u003c\u003c\\f\\n\\n The issue persists due to an indentation error.\"\n}"],["31912d08-b78b-4428-875c-a8864c2aa026","{\n  \"metadata\": {\n    \"total_chars\": 401,\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 136,\n    \"chunk_file\": \"136.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.310972\"\n  },\n  \"page_content\": \"agentic SBV trajectory NLLs or CruxEval. Further incorporating execution trace data significantly improves \\nCruxEval-input and -output prediction but leaves all SBV-related metrics unaffected. Lastly, only the addition \\nof Forager Agent data improves agentic SBV NLLs. The ForagerAgent data is further able to improve SBV \\npass@1 scores by another 3.7% . 7.2   Agentic evaluation \\n\\nSWE-bench Verified.\"\n}"],["31f8debc-22c7-4f04-adfd-f7f574bc4b4c","{\n  \"page_content\": \"For a linear transformation of size N, the forward pass requires 2N floating point operations \\n (FLOP): one multiplication and one addition per weight-input pair. The backward pass is approximately \\n twice as expensive, since gradients must be computed with respect to both the weights and the inputs. Thus, \\n the total cost per linear layer is 6N FLOP.\",\n  \"metadata\": {\n    \"total_chars\": 353,\n    \"chunk_number\": 330,\n    \"chunk_file\": \"330.txt\",\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.381284\"\n  }\n}"],["3225eebb-3024-4aa2-b950-12d54f5fd8fd","{\n  \"page_content\": \"expected. Still, these findings should be interpreted cautiously: the benchmark is based on small, self-contained \\nprograms and does not reflect the challenges of real-world software, where bugs must be detected in large and \\ncomplex codebases.\",\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.320867\",\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 162,\n    \"chunk_file\": \"162.txt\",\n    \"total_chars\": 244\n  }\n}"],["322f00c5-9b16-4462-898c-ff059160e856","{\n  \"page_content\": \"Senior core contributors \\n\\nTaco Cohen                    Yossi Adi                      Gabriel Synnaeve \\n\\n                                           34 \\n\u003c\u003c\u003c\\f\\n\\nReferences \\n\\nSandhini Agarwal, Lama Ahmad, Jason Ai, Sam Altman, Andy Applebaum, Edwin Arbus, Rahul K Arora, Yu Bai, \\n  Bowen Baker, Haiming Bao, et al. gpt-oss-120b & gpt-oss-20b model card. ar Xiv preprint arXiv:2508.10925, 2025.\",\n  \"metadata\": {\n    \"total_chars\": 391,\n    \"chunk_file\": \"184.txt\",\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 184,\n    \"processed_date\": \"2025-12-17T04:00:35.329156\"\n  }\n}"],["3267f1c4-bae1-441c-9648-d4f1d909cc9c","{\n  \"metadata\": {\n    \"chunk_file\": \"134.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.310202\",\n    \"total_chars\": 1480,\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 134\n  },\n  \"page_content\": \"Unless \\notherwise mentioned, we use a temperature of 1.0 and top-p value of 0.95 for all evaluations. 7.1   The impact of CWM data \\nTo evaluate the effect of incorporating CWM data during mid-training, we perform ablations with 8 B \\nparameter models trained for 7T tokens. We first pre-trained one model for 6 T tokens and then studied \\ndifferent mid-training datamixes for the remaining 1 T tokens, ablating the two CWM datasets, ForagerAgent \\nand Python execution trace data, as well as our Github PR trajectory data.10 After mid-training, all variants \\nunderwent a fine-tuning phase comparable to our main setup for CWM described in \\u00a75.1 but excluding \\nthe RL phase. We report results on CruxEval-O, CruxEval-I, NLLs over SWE-bench Verified (SBV) oracle \\npatches, and NLLs over agentic SBV trajectories (truncated to 32 k sequence length) for the models out of \\nmid-training and pass@1 SBV numbers for the models after SFT. The results in Table 4 show that the best performance across our set of metrics is achieved when using \\nall datasets together. This effect carries over to our SBV evaluation of the SFT model, demonstrating \\nhow mid-training data choices can positively affect final model performance. Looking at the impact of \\nindividual datasets, we find the inclusion of the PR data helps oracle SBV NLLs and SBV pass@1 but not the \\n  10 One may wonder if using the non-agentic PR data alone is sufficient for reaching strong performance on SWE-bench Verified. 23 \\n\u003c\u003c\u003c\"\n}"],["32bb65ba-465d-48de-9bb4-35282fb40905","{\n  \"page_content\": \"CWM's trace prediction to create a \\\"neural debugger\\\" whose capabilities go beyond traditional debugging, \\nsuch as jumping to future lines of code in constant time, predicting inputs to reach arbitrary states, or learning \\nabstract representations of program states that support program verification, debugging, or generation. Relatedly, we are excited about more direct uses of Python execution trace prediction to improve code gener- \\nation. Under appropriate prompting, CWM can be used to predict execution traces for functions that are not \\ngiven directly in the context but are instead constrained only through natural language or formal asserts. After \\ntrace prediction, the model then constructs the function body from the generated actions, which are the executed \\nPython statements.\",\n  \"metadata\": {\n    \"chunk_number\": 32,\n    \"total_chars\": 790,\n    \"processed_date\": \"2025-12-17T04:00:35.269975\",\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"32.txt\"\n  }\n}"],["34161c69-ea65-4095-a9f8-cfb2b0d59b12","{\n  \"metadata\": {\n    \"chunk_number\": 227,\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"227.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.344940\",\n    \"total_chars\": 138\n  },\n  \"page_content\": \"Association for Computing \\n  Machinery. ISBN 9798400705021. doi: 10.1145\u002f3639478.3640023. https:\u002f\u002fdoi.org\u002f10.1145\u002f3639478.3640023. 39 \\n\u003c\u003c\u003c\"\n}"],["3600191c-e878-484d-8099-ff1ea7ed9316","{\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.312803\",\n    \"chunk_number\": 140,\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"140.txt\",\n    \"total_chars\": 1167\n  },\n  \"page_content\": \"20 24     32      48    64       96 120             235             512   671     1000 \\n\\n                                           Model Size (Billions of Parameters) \\n\\nFigure 16 SWE-bench Verified pass@1 scores. CWM achieves best-in-class performance with and without test-time- \\nscaling (tts), achieving 65.8% and 53.9% respectively. Note that GPT-oss scores are computed with respect to a \\nlimited subset of 477 out of 500 problems. 80.4 \\n   80 \\n                                                             50 \\n                                                                                                 43.6 \\n   75 \\n                                                             40   38.2 \\n score                                                                                   34.6 \\n                                                                          32.7                           33.3 \\n   70 \\n                                                             30                   29.8 \\n Verified              65.8 \\n                                                            Accuracy \\n   65 \\n                                                             20\"\n}"],["36746b01-f1a5-4272-b71e-1ae2d5e39812","{\n  \"page_content\": \"The model performs tool calls with the following format: \\n \u003ctool: $TOOL\u003e \\n $CONTENT \\n \u003c\u002ftool\u003e \\n\\nAny available tools are to be announced in the system prompt. User code is responsible for detecting tool \\ncalls in model output and responding with a message marked with the respective role. An example tool output of the python tool could be: \\n \u003c| start_header_id|\u003etool: python\u003c| end_header_id|\u003e \\n\\n completed. [stdout ]$STDOUT_CONTENT[\u002fstdout] \\n [stderr]$STDERR_CONTENT[\u002fstderr]\u003c|eot_id|\u003e \\n\\nControl is then handed back to the model for further processing. An example of how tools can be specified in the system prompt: \\n\\n                                                56 \\n\u003c\u003c\u003c\\f\\n\\nYou have access to the following tools: \\n\\n\u003ctool: bash\u003e \\n[command(s)] \\n\u003c\u002ftool\u003e \\nExecutes bash command(s) [command(s)] in the current session. [command(s)] can be any non-interactive \\n    bash command(s) either single or multi-line. \u003ctool: create\u003e \\n [path] \\n[content] \\n\u003c\u002ftool\u003e \\nCreates a new file at [path] with [content], where [path] must not exist, but its parent directory \\n    must exist. Here, the model may invoke either the bash or the create tool.\",\n  \"metadata\": {\n    \"total_chars\": 1130,\n    \"chunk_number\": 341,\n    \"chunk_file\": \"341.txt\",\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.385256\"\n  }\n}"],["37292815-6705-40a1-b63d-a9c890707856","{\n  \"page_content\": \"35 \\n\u003c\u003c\u003c\\f\\n\\n  Sutskever, and Wojciech Zaremba. Evaluating large language models trained on code. CoRR, abs\u002f2107.03374, 2021. https:\u002f\u002farxiv.org\u002fabs\u002f2107.03374. Peter Clark, Isaac Cowhey, Oren Etzioni, Tushar Khot, Ashish Sabharwal, Carissa Schoenick, and Oyvind Tafjord. Think you have solved question answering? try arc, the AI2 reasoning challenge. CoRR, abs\u002f1803.05457, 2018. http:\u002f\u002farxiv.org\u002fabs\u002f1803.05457.\",\n  \"metadata\": {\n    \"chunk_number\": 193,\n    \"chunk_file\": \"193.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.332180\",\n    \"total_chars\": 408,\n    \"source\": \"CWM-Meta\"\n  }\n}"],["3a032983-7c77-48e2-a092-a483501d51c6","{\n  \"page_content\": \"Repos   Images Trajectories   Issues-Fix                         Mutate-Fix \\n                                             Functions Arguments     Variables Statements   Operators \\n   3.15k   10.2k       3M           55% \\n                                                7%          9 %        6%          11 %        12 % \\n\\nWe filter out mutations that cannot be applied for a given function by parsing the corresponding abstract \\nsyntax tree (AST). Lastly, we verify that applying the candidate mutation does in fact cause the associated \\nunit tests to fail. We can now use the mutation as a starting point for agentic data collection: we instruct the \\nagent to inspect the mutated function, run its unit tests, and resolve the failing tests by fixing the bug. Issue-fix tasks. For issue-fix tasks, we prompt the model to fix real issues in our set of repositories, using both \\nissue and pull request data from GitHub. We check out commits preceding bug-fixing PRs and task the agent \\nwith resolving failing unit tests, providing the corresponding GitHub issue descriptions for context. We ensure \\nunit tests are failing before the PRs and that their resolution is necessary and sufficient for addressing the issues.\",\n  \"metadata\": {\n    \"chunk_number\": 29,\n    \"processed_date\": \"2025-12-17T04:00:35.268548\",\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 1216,\n    \"chunk_file\": \"29.txt\"\n  }\n}"],["3a2d8c8b-c1f1-408a-a5ce-3a0e7c894cf4","{\n  \"metadata\": {\n    \"chunk_file\": \"240.txt\",\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 168,\n    \"chunk_number\": 240,\n    \"processed_date\": \"2025-12-17T04:00:35.349848\"\n  },\n  \"page_content\": \"Kunhao Zheng, Jesse Michael Han, and Stanislas Polu. Minif2f: a cross-system benchmark for formal olympiad-level \\n  mathematics, 2
