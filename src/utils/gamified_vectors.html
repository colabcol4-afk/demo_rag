doi.org\u002f10.1145\u002f3372885. 3373824. Vegard Mella. Moodist, 2025. https:\u002f\u002fgithub.com\u002ffacebookresearch\u002fmoodist. Mentat AI Team. Locodiff-bench: Natural long-context code benchmark, 2025. https:\u002f\u002fgithub.com\u002fAbanteAI\u002f \\n  LoCoDiff-bench.\"\n}"],["f5ae94ca-f71f-4d80-a78f-898ae83c0cb1","{\n  \"page_content\": \"Yong Lin, Shange Tang, Bohan Lyu, Jiayun Wu, Hongzhou Lin, Kaiyu Yang, Jia Li, Mengzhou Xia, Danqi Chen, \\n  Sanjeev Arora, and Chi Jin. Goedel-prover: A frontier model for open-source automated theorem proving, 2025. https:\u002f\u002farxiv.org\u002fabs\u002f2502.07640.\",\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"214.txt\",\n    \"total_chars\": 250,\n    \"processed_date\": \"2025-12-17T04:00:35.339080\",\n    \"chunk_number\": 214\n  }\n}"],["f68be12c-edba-4137-86db-d8e070cd7ec0","{\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.323656\",\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 169,\n    \"chunk_file\": \"169.txt\",\n    \"total_chars\": 952\n  },\n  \"page_content\": \"compare to models with similar parameter counts, such as Qwen3-32B or Gemma-3-27B, as baselines, and \\nwe use greedy generation instead of sampling at non-zero temperature. The results in Table 13 show that \\nCWM typically performs better than Gemma-3-27B, similar to Qwen2.5-32B, but worse than Qwen3-32B. An \\ninteresting exception to this is CruxEval-O (Gu et al., 2024), where the introduction of the tracing data (see \\n\\u00a72.2) likely helps CWM gain an advantage. Note that we achieve even better results on CruxEval-Output \\nwhen using reasoning (see \\u00a77.3). Next, we consider two long-context evaluation benchmarks: LoCoDiff (Mentat AI Team, 2025) and RULER \\n(Hsieh et al., 2024). In LoCoDiff, models are provided with the commit history of a specific file and asked to \\nconstruct its final version. To succeed, models must follow the files' evolution - from the initial commit, through \\ndiffs on multiple branches, to the resolution of merge conflicts.\"\n}"],["f75ca0be-1e42-4cd6-8ccf-1bd632b37a7d","{\n  \"page_content\": \"Hence, success on this preliminary dataset may not translate directly to practice. Moreover, \\ntermination in real systems is highly imbalanced - typically with hundreds or thousands of terminating loops \\nfor every non-terminating one - unlike the balanced distribution in our dataset (Vanegue et al., 2025). 7.5   Algorithmic complexity prediction \\nWe evaluate CWM on two tasks from BIGO(BENCH) (Chambon et al., 2025): complexity prediction, \\ndetermining the Big-O time\u002fspace complexity of existing code, and complexity generation, solving coding \\nproblems while adhering to specified complexity constraints. We report all@1 scores, which require correct \\nLLM output simultaneously across all possible complexity classes for a given problem. For complexity \\ngeneration, we also report the pass@1 score with and without the complexity requirement (the solution still \\nneeds to be correct), and a best@1 score that corresponds to pass@1 on the lowest complexity class of each \\nproblem, dismissing suboptimal classes. Results for CWM, Qwen3-32B, Qwen3-coder-30B, and Gemma-3-27B are all presented in Table 11. To ensure \\nthe comparison with external models remains as fair as possible, we choose to re-evaluate them alongside \\nCWM in the same evaluation setting. For both tasks, we use BIGO(BENCH)'s official setup, after performing \\na prompt ablation that did not seem to further boost performance. On time complexity prediction, CWM \\nachieves the best all@1 score of all compared models but fares worse for space complexity. In particular,\",\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.321276\",\n    \"chunk_number\": 163,\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"163.txt\",\n    \"total_chars\": 1538\n  }\n}"],["f85fbb09-be9f-4052-8950-e2416800c44e","{\n  \"page_content\": \"29 \\n\u003c\u003c\u003c\\f\\n\\nTable 12 Agentic, code, and mathematical reasoning benchmarks. We compare CWM to baselines with roughly the \\nsame number of parameters.(    LCB results for gpt-oss-20B (high) suffered from repeated time-outs due to repetitive \\nreasoning, despite our prompt-tuning efforts - which boosted gpt-oss (low\u002fmedium) scores by about 10 %.)\",\n  \"metadata\": {\n    \"total_chars\": 341,\n    \"chunk_number\": 166,\n    \"processed_date\": \"2025-12-17T04:00:35.322196\",\n    \"chunk_file\": \"166.txt\",\n    \"source\": \"CWM-Meta\"\n  }\n}"],["f91310bb-d8f8-4b7d-a86e-bb08c42856ce","{\n  \"metadata\": {\n    \"chunk_number\": 251,\n    \"processed_date\": \"2025-12-17T04:00:35.353978\",\n    \"chunk_file\": \"251.txt\",\n    \"total_chars\": 569,\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"Hence, the true behavior policy distribution is difficult to describe mathematically. Nevertheless, we use the notation log Hold   yi, \u003ct) to denote the token log probability produced by our \\ninference backend at the moment token yi,t was sampled, and use this quantity for importance weighting as \\ndescribed below. Finally, the PPO loss requires the policy log probabilities, which are computed on the trainer nodes. When \\na trainer receives a worker batch of G trajectories associated with a prompt x, it computes the advantages \\nand adds the trajectories to a queue.\"\n}"],["f94010ee-1bdf-4e1a-899c-62b1d179bf2c","{\n  \"page_content\": \"Reserved tokens are used for general text and chat formatting, and are not intended to be encoded from user \\ninput. They include text sequence start and end markers, padding, chat message header delimiters, and an \\nend of chat message token. \\u00b7 \u003c |begin_of_text |\u003e         global text sequence start marker. \\u00b7 \u003c | end_of_text |\u003e        global text sequence end marker. \\u00b7 \u003c | pad |\u003e        padding token. \\u00b7 \u003c | start_header_id|\u003e         start of chat message header. \\u00b7 \u003c | end_header_id|\u003e         end of chat message header.\",\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.384024\",\n    \"total_chars\": 522,\n    \"chunk_number\": 338,\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"338.txt\"\n  }\n}"],["f9515236-2865-4836-b7cb-f5c629e2a2b2","{\n  \"page_content\": \"Let's jointly synthethize and trace the code for this using the first provided input\u002foutput example. First, I will emit the execution traces and check that it arrives to the expected \\n output. Then, if the output is correct, extracting the code is straightforward, I don't need to think anymore and can proceed to the final answer. But if the execution is incorrect, I need to think and then predict the corrected traces again. Let's start jointly tracing and synthethizing. The input will be f(2, 3, [1, 5, 6]), and the output must be [9, 6, 1]; otherwise it will mean I predicted the wrong code and need to \\n start again. Let's see: \\n\\n \u003c| trace_context_start |\u003efrom solution import f \\n\\n assert f(2, 3, [1, 5, 6]) == [9, 6, 1] \\n assert f(5, 4, [2, 4, 6, 8]) == [225, 2001, 6014, 6939] \\n\\n f(2, 3, [1, 5, 6]) # \u003c\u003c START_OF_TRACE \\n \u003c| frame_sep|\u003e\u003c|call_sep|\u003e{}\u003c|action_sep|\u003ef(2, 3, [1, 5, 6]) # \u003c\u003c START_OF_TRACE \\n \u003c| frame_sep|\u003e\u003c|line_sep|\u003e{}\u003c|action_sep|\u003ef(2, 3, [1, 5, 6]) # \u003c\u003c START_OF_TRACE \\n \u003c| frame_sep|\u003e\u003c|call_sep|\u003e{\\\"n\\\": \\\"2\\\", \\\"q\\\": \\\"3\\\", \\\"queries\\\": \\\"[1, 5, 6]\\\"}\u003c|action_sep|\u003edef f(n, q, queries): \\n \u003c| frame_sep |\u003e \\n    -END OF PROMPT --- \\n \u003c| line_sep|\u003e{\\\"n\\\": \\\" .. \\\", \\\"q\\\": \\\" .. \\\", \\\"queries\\\": \\\" .. \\\"}\u003c|action_sep|\u003e MOD = 10 ** 9 + 7 \\n \u003c| frame_sep|\u003e\u003c|line_sep|\u003e{\\\"n\\\": \\\" .. \\\", \\\"q\\\": \\\" .. \\\", \\\"queries\\\": \\\" .. \\\", \\\"MOD\\\": \\\"1000000007\\\"}\u003c|action_sep|\u003e max_x = 3 * n \\n\\n \u003c| frame_sep|\u003e\u003c|return_sep|\u003e\u003c|action_sep|\u003e return ans \\n \u003c|arg_sep|\u003e\\\"[9, 6, 1]\\\"\u003c|frame_sep|\u003e\u003c|return_sep|\u003e\u003c|action_sep|\u003ef(2, 3, [1, 5, 6]) # \u003c\u003c START_OF_TRACE \\n \u003c| arg_sep|\u003e\\\"[9, 6, 1]\\\"\u003c|frame_sep|\u003e\",\n  \"metadata\": {\n    \"total_chars\": 1559,\n    \"chunk_number\": 308,\n    \"chunk_file\": \"308.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.374076\",\n    \"source\": \"CWM-Meta\"\n  }\n}"],["fa82fe60-6880-46dd-a5d3-efde02833de5","{\n  \"page_content\": \"Model architecture. CWM is a 32-billion-parameter dense decoder-only model. We choose a dense architecture \\nover sparse alternatives for ease-of-use in downstream open source research. CWM uses an alternating pattern \\nof local and global attention blocks interleaved in a 3:1 ratio (see Figure 6a) with sliding window sizes of \\n8192 and 131 072 tokens respectively. Transformer blocks use Grouped-Query-Attention (Ainslie et al., 2023) \\nwith 48 query heads and 8 key-value heads. We use SwiGLU activation functions (Shazeer, 2020), RMSNorm \\n(Zhang and Sennrich, 2019) with pre-normalization, Rotary Positional Embedding (RoPE) (Su et al., 2021), \\nand we train with full document-causal masking. To support long-context modeling, we follow Roziere et al. (2023); Xiong et al. (2023) and apply Scaled RoPE with          = 1 M and scale factor 16 from mid-training \\nonwards. We give a full overview of CWM parameters and architecture choices in Table 2. Training hyper-parameters.\",\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.278259\",\n    \"chunk_file\": \"56.txt\",\n    \"chunk_number\": 56,\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 977\n  }\n}"],["fc6c1726-34c1-4600-9e64-34ccc6208951","{\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.368798\",\n    \"chunk_file\": \"293.txt\",\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 232,\n    \"chunk_number\": 293\n  },\n  \"page_content\": \"\\\", \\\"value\\\": \\\". . \\\", \\\"i\\\": \\\" .. \\\", \\\"result\\\": \\\"'osu' \\\", \\\"j\\\": \\\" .. \\\", \\\"v\\\": \\\" .. [X] for j, v in enumerate(sequence[i:]): \\n  [X] | frame_sep [X] line_sep|\u003e{\\\"sequence\\\": [X] \\\" .. \\\", \\\"value\\\": \\\" .. \\\", \\\"i\\\": \\\" .. \\\", \\\"result\\\": \\\" .. \\\", \\\"j\\\": \\\" ..\"\n}"],["fc8bd6e6-6d2b-431c-8716-af335a5e6d24","{\n  \"page_content\": \"Mid-training datamix. For mid-training, we introduce the ForagerAgent and Python execution tracing data, our \\nmain CWM datasets introduced in \\u00a72, into the datamix. We additionally include code- and reasoning-related \\ndata such as datasets derived from GitHub pull requests similar to SWE-RL (Wei et al., 2025), data from \\ncompiler intermediate representations (Cummins et al., 2024), Triton PyTorch kernels similar to Paliskara \\nand Saroufim (2025), and formal mathematics in Lean covering statement and proof translation, as well as \\nworld modeling (see \\u00a7I). 2See https:\u002f\u002fgithub.com\u002fopenai\u002ftiktoken.\",\n  \"metadata\": {\n    \"chunk_file\": \"61.txt\",\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 600,\n    \"chunk_number\": 61,\n    \"processed_date\": \"2025-12-17T04:00:35.280162\"\n  }\n}"],["fc9e650a-1686-4aed-a70f-706cd3cc6197","{\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 237,\n    \"total_chars\": 924,\n    \"processed_date\": \"2025-12-17T04:00:35.348779\",\n    \"chunk_file\": \"237.txt\"\n  },\n  \"page_content\": \"John Yang, Carlos E Jimenez, Alexander Wettig, Kilian Lieret, Shunyu Yao, Karthik Narasimhan, and Ofir Press. Swe-agent: Agent-computer interfaces enable automated software engineering. Advances in Neural Information \\n  Processing Systems, 37:50528-50652, 2024. John Yang, Kilian Leret, Carlos E Jimenez, Alexander Wettig, Kabir Khandpur, Yanzhe Zhang, Binyuan Hui, Ofir \\n  Press, Ludwig Schmidt, and Diyi Yang. Swe-smith: Scaling data for software engineering agents. ar Xiv preprint \\n  ar Xiv:2504.21798, 2025b. Doron Yeverechyahu, Raveesh Mayya, and Gal Oestreicher-Singer. The impact of large language models on open-source \\n  innovation: Evidence from github copilot. arXiv preprint ar Xiv:2409.08379, 2024. Huaiyuan Ying, Zijian Wu, Yihan Geng, Zheng Yuan, Dahua Lin, and Kai Chen. Lean workbook: A large-scale lean \\n  problem set formalized from natural language math problems, 2025. https:\u002f\u002farxiv.org\u002fabs\u002f2406.03847.\"\n}"],["fcc0930a-cbbf-4c21-a888-798c12447c84","{\n  \"metadata\": {\n    \"chunk_number\": 212,\n    \"total_chars\": 311,\n    \"processed_date\": \"2025-12-17T04:00:35.338085\",\n    \"chunk_file\": \"212.txt\",\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"Benjamin Lefaudeux, Francisco Massa, Diana Liskovich, Wenhan Xiong, Vittorio Caggiano, Sean Naren, Min Xu, Jieru \\n  Hu, Marta Tintore, Susan Zhang, et al. xformers: A modular and hackable transformer modelling library, 2022. Tianle Li, Wei-Lin Chiang, Evan Frick, Lisa Dunlap, Tianhao Wu, Banghua Zhu, Joseph E.\"\n}"],["fdf646db-3ece-428c-aa94-f4cff3a1efbf","{\n  \"page_content\": \"3. Provide the full assertion with the correct output that you obtained after \u003c|return_sep|\u003e in [ANSWER] and [\u002fANSWER] tags \\n Here is an example of how you would predict the output of the program using your trace prediction capability: \\n\\n Python function: \\n def f(a,b): \\n     y = a \\n     for i in range(b): \\n        y += y * i \\n     return y \\n assert f(1,3) == ?? \u003cthink\u003e \\n your internal reasoning \\n \u003c\u002fthink\u003e \\n Let's verify this by putting the code into a trace context and call the function in the main() function and then trace the execution of the main function.\",\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.274258\",\n    \"chunk_file\": \"46.txt\",\n    \"total_chars\": 565,\n    \"chunk_number\": 46,\n    \"source\": \"CWM-Meta\"\n  }\n}"],["feaa4ccb-73e6-4d6a-b5bc-f728d0a4b6a7","{\n  \"metadata\": {\n    \"chunk_file\": \"68.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.282927\",\n    \"chunk_number\": 68,\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 1322\n  },\n  \"page_content\": \"(2024) show that models scale predictably for a fixed \\nmodel-to-data ratio and advocate for scaling laws that mirror the setting of the final pretraining run. Therefore, \\nwe maintain a fixed model-to-data ratio of D\u002fM = 40 across compute budgets, matching the target ratio of \\nour 32B parameter model pre-trained on 8 T tokens. This ratio is roughly 8 times more data than would be \\ncompute optimal according to the Chinchilla paper (Hoffmann et al., 2022). We conduct a quasi-random search over batch size and learning rate across eight increasing compute scales, \\nranging from 2 x 1018 to 2 \\u00d7 1020 FLOP. For each scale, we keep the configurations within 1% of the best \\n\\n                                                 11 \\n\u003c\u003c\u003c\\f\\n\\nvalidation loss and fit the batch size BS and learning rate LR with respect to the compute budget C. Consistent with prior work, BS grows and LR declines gradually with C, while near-optimal hyper-parameters \\nspan a broad range. However, likely due to our different pre-training data, our equations for learning rate and \\nbatch size diverge from Bi et al. (2024): \\n\\n                                       LR(C) = 19.29   C-0.177 \\n                                                                                                   (2) \\n                                         BS(C) = 30.17 .\"\n}"],["ff66bf39-3968-44c3-a2c7-ea76b5c3472f","{\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"147.txt\",\n    \"chunk_number\": 147,\n    \"total_chars\": 1191,\n    \"processed_date\": \"2025-12-17T04:00:35.315223\"\n  },\n  \"page_content\": \"Multi-lingual coding. The Aider Polyglot benchmark (Aider Team, 2025) measures coding ability across a diverse \\nset of programming languages using challenging exercises from Exercism.11 The primary metric is the pass \\nrate on the second attempt, allowing the model to iterate on test failures once. We make a few changes to the \\nharness to align it with the CWM training distribution, such as removing hard-coded assistant messages from \\nthe history, concatenating adjacent messages of the same role, removing examples from the system prompt, \\nturning off auto-linting and stripping of reasoning traces, and reiterating in the prompt that exact matches \\nare needed. We evaluate with reasoning, at temperature 0.4, and without test-time-scaling. Although Aider \\nPolyglot may not fully qualify as a truly agentic benchmark - given its lack of dynamic tool use beyond code \\nexecution and limited interaction - we include it here in light of the self-correction capabilities that it allows for. As shown in Table 6, CWM achieves 35.1% accuracy, comparable to other models in its class such as \\nQwen3-32B (40.0%) and other models using the \\\"whole file\\\" edit format such as Gemini 2.0 Pro (35.6%).\"\n}"],["ffb167f2-3140-4ede-a811-031b256b0e99","{\n  \"page_content\": \"is automatically run at test-execution time. This fixture captures the build state of the container running unit \\ntests. We then commit and push the resulting image from each repository, as further detailed in \\u00a7D.\",\n  \"metadata\": {\n    \"total_chars\": 213,\n    \"processed_date\": \"2025-12-17T04:00:35.262624\",\n    \"chunk_number\": 16,\n    \"chunk_file\": \"16.txt\",\n    \"source\": \"CWM-Meta\"\n  }\n}"],["ffc98bbe-f1e5-4f18-8066-1225485b3db7","{\n  \"metadata\": {\n    \"chunk_number\": 269,\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 1048,\n    \"processed_date\": \"2025-12-17T04:00:35.361002\",
