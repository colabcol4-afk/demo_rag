n  \"metadata\": {\n    \"chunk_file\": \"272.txt\",\n    \"chunk_number\": 272,\n    \"total_chars\": 402,\n    \"processed_date\": \"2025-12-17T04:00:35.362009\",\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \". \\\" } \\n def main(): # \u003c\u003c START_OF_TRACE                     \u003c|action_sep |\u003e p+='ts' \\n     return f(1)                                     \u003c| frame_sep|\u003e\u003c|line_sep|\u003e{\\\"n\\\": \\\" .. \\\", \\\"p\\\": \\\"'snts'\\\", \\\"x\\\": \\\" .. \\\"} \\n \u003c| frame_sep|\u003e\u003c|call_sep|\u003e{}                        \u003c|action_sep |\u003e for x in range(1, n+1): \\n \u003c|action_sep|\u003edef main():                           \u003c | frame_sep | \u003e\u003c | line_sep | \u003e{ \\\" n \\\" : \\\" . .\"\n}"],["6b71e2e4-de94-46aa-9ba3-5381a8a16fd2","{\n  \"page_content\": \"Tokenizer. CWM uses the Llama 3 tokenizer (Dubey et al., 2024) which is a fast Byte-Pair Encoding tokenizer \\nimplemented with TikToken.2 The vocabulary contains 128 000 regular tokens as well as 256 reserved tokens. We keep the control tokens from Llama 3 and leverage unused reserved tokens to support our tracing and \\nreasoning use cases. 4.2    Two-stage pre-training \\nCWM pre-training consists of two stages sharing learning-rate scheduler and optimizer states but differing in \\ndatamix and maximum document lengths: \\n\\n   1. General pre-training: We begin with an initial pre-training phase on 8 T tokens from a diverse range of \\n      mostly English sources, with an emphasis on coding data (making up about 30 % of the mix) as well as \\n      STEM and general knowledge. We pre-train our model with a global batch size of 8.4 M tokens and a \\n      context length of 8192 tokens.3 \\n\\n   2. Code world model mid-training: We then mid-train the model for an additional 5 T tokens. We here \\n      depart from our more generalist pre-training datamix and introduce a number of datasets in support of \\n      our code world modeling objectives. We mid-train with a global batch size of 33 M tokens and maximum \\n      context length of 131 k tokens. 4 \\nMid-training is the key stage for teaching code world modeling capabilities. Next, we discuss the changes we \\nmake to the pre-training recipe during mid-training to optimize CWM performance.\",\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.279896\",\n    \"chunk_number\": 60,\n    \"chunk_file\": \"60.txt\",\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 1439\n  }\n}"],["6c1d3761-e3e7-4724-8fa8-c9a0288e497c","{\n  \"metadata\": {\n    \"chunk_file\": \"172.txt\",\n    \"total_chars\": 1368,\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.324768\",\n    \"chunk_number\": 172\n  },\n  \"page_content\": \"16 Results for Magistral were taken from the official reported numbers for 1.2 version, where no explicit dates were mentioned. 30 \\n\u003c\u003c\u003c\\f\\n\\nTable 13 Performance of CWM and CWMMid, (CWM after mid-training), on a set of general, math, and coding tasks \\nwithout any reasoning compared to a set of recent baseline models with similar parameter counts. CWM    CWM Mid Qwen3-32B     Qwen2.5-32B   Gemma-3-27B   Llama-3-70B Llama-4-Scout \\n  MMLU             77.7      73.6        83.6          83.3          78.7          79.3          78.3 \\n  MMLU-Pro         60.2      52.3        65.5          55.1          52.9          53.8          56.1 \\n  GPQA             40.6      31.7        49.5          48.0          26.3                        40.4 \\n  GSM8k            93.3      84.7        93.4          92.9          81.2          83.7          85.4 \\n  HumanEval-Plus   75.0      68.3        72.1          66.3          55.8                        59.9 \\n  MBPP             73.4      67.8        78.2          73.6          68.4          66.2          68.6 \\n  CRUX-O           83.4      78.9        72.5          67.8          60.0                        61.9 \\n\\n                               k=10 \\n                             k=9 \\n 84 \\n                        k=7                            80 \\n                   k=5 \\n 82                                                    60\"\n}"],["6f638408-557c-4694-9d9b-bf39d6958566","{\n  \"page_content\": \"Figure 7 SWE RL design. An agent solves software engineering tasks end-to-end through long-horizon agent-environment \\ninteractions via reasoning and tool use (up to 128 turns and 131 k context size). SWE RL employs a minimal toolset: \\nbash as the core, with edit, create, and submit as lightweight bash plugins. The reward combines hidden test outcomes \\nwith patch similarity, where the similarity reward is applied when tests fail to provide auxiliary learning signals. 5.3    RL environments & data \\nWe consider four types of RL tasks: Agentic software engineering (SWE) (\\u00a75.3.1), Coding (\\u00a75.3.2), Agentic \\ncoding (\\u00a75.3.3), and Mathematics (\\u00a75.3.4). Each RL task is defined by a dataset (containing prompts, a \\nverification suite like unit tests, and additional metadata) and an environment that the agent interacts with. We integrate these tasks into a joint RL training phase which we detail in \\u00a75.4. We further refer to \\u00a76.2 for \\nimplementation details regarding our environments and RL training infrastructure. Our environments constitute partially observable Markov decision processes: a language model is employed \\nas an agent, producing actions based on the preceding sequence of action-observation pairs and an initial \\nprompt. All environments for training CWM utilize software-based verification of outcomes, producing a \\nsingle terminal reward signal per rollout. In the remainder of this section, we describe the specification of\",\n  \"metadata\": {\n    \"chunk_number\": 81,\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.287918\",\n    \"chunk_file\": \"81.txt\",\n    \"total_chars\": 1443\n  }\n}"],["70a57bf7-7fe0-4860-95ea-9d120361e18f","{\n  \"page_content\": \"Figure D.29 Activ image building pipeline for a single repository. After cloning from GitHub, the repository's GitHub \\nActions workflows and pytest conftest. py files (in Python repositories) are modified and copied into the outer Docker \\n(or virtual machine) for isolated CI execution via act. Modified workflow jobs are executed in parallel within individual \\ncontainers, until the container_id and built-environment state are captured from the target container that holds \\nrepository dependencies. Framework executability detection precedes capture to ensure targeting the correct container: \\nfor pytest repositories, this occurs implicitly when injected conftest.py code executes within a session-scoped fixture, \\nwith an optional function-scoped fixture available for Python execution tracing. Non-Python repositories use modified \\nworkflow steps to verify framework executability (such as Jest) before capture. Upon successful capture, an early exit \\nis triggered and the resulting container is committed and pushed for standalone execution. As we require only a single successful build of the repository, the pipeline reduces complex cross-platform and \\nframework build matrices into a single entry (Saavedra et al., 2024), by selecting most-compatible Python \\nversions and Ubuntu variants. The pipeline also modifies each repository's GitHub Actions workflows to \\ncontinue-on-error, ensuring pipeline completion when encountering noncritical failures. We also implement \\nmultiple early exit strategies to terminate the pipeline as soon as a built-environment state has been captured,\",\n  \"metadata\": {\n    \"total_chars\": 1591,\n    \"chunk_file\": \"327.txt\",\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 327,\n    \"processed_date\": \"2025-12-17T04:00:35.380294\"\n  }\n}"],["71b15bcc-eebe-4b3a-b950-7ff118678ee8","{\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.365977\",\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"284.txt\",\n    \"chunk_number\": 284,\n    \"total_chars\": 1330\n  },\n  \"page_content\": \"Let me break it down step by step. The initial list is [1, 3, -1, 1, -2, 6]. The variable a starts at 0. The loop runs for i in range(len(nums)), which is range(6) initially. So i will \\n         take values 0 through 5. First iteration (i=0): \\n - nums. insert(i, nums[a]) -\u003e insert nums[0] (which is 1) at position 0. The list becomes [1, 1, 3, -1, 1, -2, 6]. Then a increments to 1. Second iteration (i=1): \\n - Now, the list has 7 elements. But the loop was set up with range(6), so i is still 1. We insert nums[a] (nums[1] is 1) at position 1. The list becomes [1, 1, 1, 3, -1, 1, -2, 6]. a \\n         becomes 2. Third iteration (i=2): \\n - Insert nums[2] (which is 1) at position 2. The list is now [1, 1, 1, 1, 3, -1, 1, -2, 6]. a is 3. Fourth iteration (i=3): \\n - Insert nums[3] (3) at position 3. The list becomes [1, 1, 1, 1, 3, 3, -1, 1, -2, 6]. a is 4. Fifth iteration (i=4): \\n - Insert nums[4] (-1) at position 4. The list is [1, 1, 1, 1, 3, -1, 3, -1, 1, -2, 6]. a is 5. Sixth iteration (i=5): \\n - Insert nums[5] (1) at position 5. The list becomes [1, 1, 1, 1, 3, 1, -1, 3, -1, 1, -2, 6]. a is 6. After these six iterations, the loop ends because i has gone through 0 to 5. The final list is [1, 1, 1, 1, 3, 1, -1, 3, -1, 1, -2, 6]. Wait, but let me double-check each step to make \\n         sure I didn't make a mistake.\"\n}"],["73c049a4-1150-4a1a-9868-734e0e0d29d1","{\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"141.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.313223\",\n    \"total_chars\": 949,\n    \"chunk_number\": 141\n  },\n  \"page_content\": \"60                                                        10 \\n SWE-bench                      58.4 \\n                                              Best@k \\n   55                                         Majority@k      0 \\n                                              Pass@k                                             Go \\n       1 2 4   8   12 16    20 24   28   32 36    40                             Java    C++             Rust \\n                    Number of repair samples                     Python             Language \\n                                                                         JavaScript \\n                         (a)                                                       (b) \\n\\nFigure 17 (a) Test time scaling (TTS) with both our best@k method majority voting can significantly increase pass@1 \\nrates for CWM on SWE-bench Verified. (b) Accuracy of CWM on Aider Polyglot by programming language using \\nthe whole file edit format.\"\n}"],["74d07b4d-c9e5-4e43-9956-9174a931d4db","{\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 595,\n    \"chunk_number\": 280,\n    \"processed_date\": \"2025-12-17T04:00:35.364552\",\n    \"chunk_file\": \"280.txt\"\n  },\n  \"page_content\": \". \\\" , \\\"i \\\" : \\\" \\\"}|action_sep | \u003e return nums \\n \u003c|frame_sep|\u003e\u003c|return_sep|\u003e\u003c|action_sep|\u003e [X] [X] [X] return nums\u003c|arg_sep|\u003e\\\"[1, 1, 1, 1, 1, 1, 1, 3, -1, 1, -2, 6]\\\" \\n \u003c| frame_sep|\u003e\u003c|return_sep|\u003e\u003c|action_sep|\u003e [X] [X] return f([1, 3, -1, 1, -2, 6])\u003c|arg_sep|\u003e\\\"[1, 1, 1, 1, 1, 1, 1, 3, -1, 1, -2, 6]\\\"\u003c| frame_sep|\u003e \\n\\n                                            (a)    CWM Execution Trace Prediction (correct prediction). Given a python code function and an assert statement containing a specific input, provide the assertion with the exact literal output that the function returns with that input.\"\n}"],["74d6b7b5-cd83-4c67-8c7d-ef8b9a27510b","{\n  \"page_content\": \"The proportion of groups that get split \\n      can be decreased by increasing the maximum token limit or the number of gradient accumulation steps, \\n      but in practice we observe this not to be an issue even when more than half of the groups are split. \\u00b7 Clip-higher: Following (Yu et al., 2025), we use a higher upper clip value, Ehigh = 0.25 and = 0.2 to \\n      prevent entropy collapse. No KL: Using clip-higher to prevent entropy collapse, we found it unnecessary to use KL regularization5. \\u00b7 Skip zero-advantage trajectories: The effective batch size is the number of tokens that do not have zero \\n      advantage and contribute to the gradient. We reduce variance in the effective batch size by skipping all \\n      zero-advantage trajectories. \\u00b7 Skip stale trajectories: To limit the degree of off-policyness, we skip trajectories whose most recent tokens \\n      were generated from a policy more than 100 training steps behind the current policy. \\u00b7 Weighted mean return: We found that longer trajectories are more likely to fail (Hassid et al., 2025), \\n      leading to the majority of tokens having a negative advantage. To avoid biasing the token-averaged \\n      return, we compute     as a length-weighted average. Gibberish detection: While gibberish typically leads to lower rewards and naturally decreases at the \\n      beginning of RL, it can increase later when some successful gibberish trajectories get reinforced, especially \\n      for agentic SWE RL. So we explicitly reject any trajectory containing any token yt that is both rare and\",\n  \"metadata\": {\n    \"total_chars\": 1557,\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 76,\n    \"processed_date\": \"2025-12-17T04:00:35.286062\",\n    \"chunk_file\": \"76.txt\"\n  }\n}"],["75e1627a-98ee-40c0-8c58-ff2ab989845f","{\n  \"page_content\": \"49 \\n\u003c\u003c\u003c\\f\\n\\n ===== CONTEXT ===== \\n def count_letters(s, letter): \\n    n = 0 \\n     for c in s: \\n       n += int(c == letter) \\n    return n \\n def format_answer(word, letter, count): \\n    parts = [ \\n       \\\"Found\\\", \\n       f\\\"{count:04d}\\\", \\n        \\\"occurrences of the letter\\\", \\n       letter, \\n        \\\"in\\\", \\n       word \\n    ] \\n    return \\\" \\\". join (parts) \\n def f(c): # \u003c\u003c START_OF_TRACE \\n    word = \\\"strawberry\\\" \\n    num = count_letters(word, c) \\n    ans = format_answer (word, c, num) \\n    return ans\",\n  \"metadata\": {\n    \"chunk_file\": \"300.txt\",\n    \"total_chars\": 499,\n    \"processed_date\": \"2025-12-17T04:00:35.371143\",\n    \"chunk_number\": 300,\n    \"source\": \"CWM-Meta\"\n  }\n}"],["7616d19e-35cb-4b20-ac44-ed8f83eac2b9","{\n  \"metadata\": {\n    \"chunk_file\": \"203.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.335360\",\n    \"chunk_number\": 203,\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 681\n  },\n  \"page_content\": \"Daya Guo, Dejian Yang, Haowei Zhang, Junxiao Song, Ruoyu Zhang, Runxin Xu, Qihao Zhu, Shirong Ma, Peiyi Wang, \\n  Xiao Bi, et al. Deepseek-r1: Incentivizing reasoning capability in Ilms via reinforcement learning. ar Xiv preprint \\n  ar Xiv:2501.12948, 2025. Ashutosh Gupta, Thomas A. Henzinger, Rupak Majumdar, Andrey Rybalchenko, and Ru-Gang Xu. Proving non- \\n  termination. In George C. Necula and Philip Wadler, editors, Proceedings of the 35th ACM SIGPLAN-SIGACT \\n  Symposium on Principles of Programming Languages, POPL 2008, San Francisco, California, USA, January 7-12, \\n  2008, pages 147-158. ACM, 2008. doi: 10.1145\u002f1328438.1328459. https:\u002f\u002fdoi.org\u002f10.1145\u002f1328438.1328459.\"\n}"],["77c356db-72c9-4499-9c9b-59053bf7e2ed","{\n  \"page_content\": \"training. Figure K.31 Agentic capabilities learnt during CWM RL training. 58 \\n\u003c\u003c\u003c\",\n  \"metadata\": {\n    \"chunk_number\": 349,\n    \"total_chars\": 81,\n    \"chunk_file\": \"349.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.388841\",\n    \"source\": \"CWM-Meta\"\n  }\n}"],["7cd9886f-65b9-484d-95ef-0f75a9d71d7e","{\n  \"metadata\": {\n    \"chunk_file\": \"208.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.337045\",\n    \"total_chars\": 581,\n    \"chunk_number\": 208,\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"Naman Jain, Jaskirat Singh, Manish Shetty, Liang Zheng, Koushik Sen, and Ion Stoica. R2e-gym: Procedural \\n  environments and hybrid verifiers for scaling open-weights swe agents. arXiv preprint ar Xiv:2504.07164, 2025b. Carlos E. Jimenez, John Yang, Alexander Wettig, Shunyu Yao, Kexin Pei, Ofir Press, and Karthik R. Narasimhan. Swe-bench: Can language models resolve real-world github issues? In The Twelfth International Conference \\n  on Learning Representations, ICLR 2024, Vienna, Austria, May 7-11, 2024. OpenReview.net, 2024. https: \\n  \u002f\u002fopenreview. net\u002fforum?id=VTF8yNQM66.\"\n}"],["7cf76e17-9b8e-4716-a304-bd5d14dabb5d","{\n  \"metadata\": {\n    \"chunk_number\": 348,\n    \"processed_date\": \"2025-12-17T04:00:35.388575\",\n    \"chunk_file\": \"348.txt\",\n    \"total_chars\": 1189,\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"Figure K.31b shows that the agent's average recall increases from 58% at the start of RL training to over 66% \\n after only 4,000 steps. 74% \\n                                                          66% \\n     72% \\n  Trajectories 70% \\n                                                       % 64% \\n     68%                                               Recall, \\n     66%                                                  62% \\n  of 64% \\n  % 62%                                                   60% \\n     60% \\n     58%                                                  58% \\n     56% \\n         [0,                                                   [0, [500,                    [3000, [3500, \\n          500) [500, 1000) [1000, [1500, [2000, [2500, [3000, [3500, 500) [1000, [1500, [2000, [2500, \\n                     1500) 2000) 2500) 3000) 3500) 4000)              1000) 1500) 2000) 2500) 3000) 3500) 4000) \\n                    RL Training Step                                      RL Training Step \\n (a) Percentage of trajectories where SWE RL performs (b) SWE RL learns to localize the relevant files over the \\n tests on at least one turn increases over the course of RL course of RL training.\"\n}"],["7dc8a25a-b501-44ac-8c32-1aec92ed5295","{\n  \"metadata\": {\n    \"total_chars\": 1338,\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"94.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.293839\",\n    \"chunk_number\": 94\n  },\n  \"page_content\": \"This process improves data quality and format adherence \\nacross iterations, raising success rates, and providing stronger initialization for joint RL. Then, iteratively, we start RL with the new SFT-ed model and collect higher-quality traces for the next \\nround. Eventually, we include the final set of the traces into the joint SFT mix to prepare for the final joint \\nRL. This results in the final CWM SFT model. For each iteration, we redo SFT on the original midtraining \\ncheckpoint and discard old trajectories. Importantly, we find that the bootstrapped data greatly improve the \\nperformance of the SFT checkpoint on SWE-bench Verified. Without SWE RL traces, the SFT model hardly \\nresolves any issues due to format errors. With more iterations of bootstrapping, the data quality improves \\nsignificantly, and the success rate increases from 30%, to 37%, and to 43% pass@1 over SWE-bench Verified. During earlier iterations, we record the offline pass rate for each instance and use it as the GRPO baseline in \\nlater iterations. This lets us set the group size to 1 and speed up each epoch. We find this technique leads to \\nfaster SWE RL training. In the final joint RL, we still perform online estimation of the GRPO baseline for \\nconsistency with other environments and for a higher performance ceiling. Data sourcing and filtering.\"\n}"],["7ef62fed-7f2a-4d07-b584-b9e2aee93d57","{\n  \"page_content\": \"31 \\n\u003c\u003c\u003c\\f\\n\\ncatastrophic risks, namely Cyber and Chemical & Biological risks.\",\n  \"metadata\": {\n    \"chunk_number\": 176,\n    \"processed_date\": \"2025-12-17T04:00:35.326100\",\n    \"total_chars\": 75,\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"176.txt\"\n  }\n}"],["7f7747e7-40b0-40fd-a75a-e6aa54487d2c","{\n  \"metadata\": {\n    \"chunk_number\": 340,\n    \"chunk_file\": \"340.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.384860\",\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 1045\n  },\n  \"page_content\": \"$CONTENT\u003c| eot_id|\u003e \\n\\nThe $ROLE can be system, user, assistant, or tool: $TOOL. $CONTENT is the message content. The model is \\nto be prompted with an assistant header and two following newline characters; the \u003c| eot_id|\u003e token marks \\nthe end of its reply and is thus the stop token for inference. The conversation's first token is expected to be \\n\u003c| begin_of_text |\u003e. Reasoning. CWM is a hybrid reasoning and non-reasoning model; reasoning mode is enabled via prompting. Reasoning mode is turned on by starting the system prompt with: \\n You are a helpful AI assistant. You always reason before responding, using the following format: \\n\\n \u003cthink\u003e \\n your internal reasoning \\n \u003c\u002fthink\u003e \\n your external response \\n\\nThe model should be prompted with a leading \u003cthink\u003e\\\\n, i.e., a prompt should end with (showing newline \\ncharacters for clarity here): \\n \u003c| start_header_id|\u003eassistant\u003c|end_header_id|\u003e\\\\n\\\\n\u003cthink\u003e\\\\n \\n\\nThe reasoning section will be closed with \u003c\u002fthink\u003e, and any text produced afterwards is the answer to the \\npreceding user input. Tool Use.\"\n}"],["7fd5b3cb-d0f5-45cd-a55d-b80502bfa6b7","{\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"23.txt\",\n    \"total_chars\": 1070,\n    \"chunk_number\": 23,\n    \"processed_date\": \"2025-12-17T04:00:35.265535\"\n  },\n  \"page_content\": \"Generations are filtered to \\n ensure a balance of incorrect and correct submissions, leading to an overall count of 262 k. We trace these \\nsolutions with inputs from the provided unit tests and filter out long traces with more than 10 k line events or \\n\\n                                                  4 \\n\u003c\u003c\u003c\\f\\n\\nlarge traces taking up more than 1 MB disk space, leaving us with 33 k effective code snippets and 70 k traces. Repository-level tracing. We also performed Python execution tracing for the unit tests of more than 21 k \\navailable and traceable repository images. For a subset of these repositories, we use the repository's git log \\nto randomly select additional commits prior to our built commit. Since the build environment is configured \\nfor the current commit's dependencies, older commits may fail to execute. We attempted tracing for up \\nto 40 historical commits per repository but capped successful traces at 4 commits per repository to avoid \\nover-representation of any single repository. This process resulted in around 70 k execution-traced commits.\"\n}"],["809b675d-27f6-4b83-84f6-7d0b6ba4074e","{\n  \"page_content\": \"See Figure 13 for an illustration of this process. 6    Code and infrastructure \\n\\nThis section discusses details of our training pipeline, including efficiency-related features leveraged for CWM \\ntraining and the asynchronous RL architecture.\",\n  \"metadata\": {\n    \"chunk_file\": \"118.txt\",\n    \"chunk_number\": 118,\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.303700\",\n    \"total_chars\": 242\n  }\n}"],["80c11092-8843-46d1-8737-d52da5ee70c6","{\n  \"page_content\": \"Prior work empirically shows this approach is beneficial in improving general code generation \\n and understanding capabilities (Armengol-Estap\\u00e9 et al., 2025; Zhang et al.). Neural code interpretation \\nfurther has the potential to go beyond traditional interpreters, with applications such as tracing through \\nunexecutable code or combining it with reasoning capabilities. Next, we describe the different sources from \\nwhich we gather execution trace data.\",\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.264018\",\n    \"chunk_number\": 19,\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"19.txt\",\n    \"total_chars\": 455\n  }\n}"],["811df9a1-7525-4f42-bfae-cf634a6a6800","{\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 1218,\n    \"chunk_number\": 127,\n    \"chunk_file\": \"127.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.306951\"\n  },\n  \"page_content\": \"Figure 14 Overview of how agents interact with RL environments to produce trajectories. trainers send updated model weights to the workers periodically. After a model update is received and applied \\non a worker, the worker continues generation of partially completed trajectories using the old KV-cache. This approach ensures continuously high GPU utilization (see Figure 15) and has been used in our previous \\nwork (Synnaeve et al., 2019; Gehring et al., 2025; Tang et al., 2025; Cohen et al., 2025) and notable RL \\nframeworks such as PipelineRL (Piche et al., 2025). Inference. We use our own throughput-optimized inference backend FastGen (Carbonneaux, 2025). FastGen \\nsupports batched inference, CUDA graphs, paged attention (Kwon et al., 2023), chunked prefills, host-side KV- \\ncache, tensor parallelism, and CPU\u002fGPU profiling. In batched inference, one generates tokens for each sequence \\nin a batch in parallel, continuing without synchronizing CUDA streams until a block of tokens (e.g., 32) is \\ncompleted. After each block, completed sequences are truncated at stop tokens and returned, and new sequences \\nare added to the batch so as to keep the batch size constant. For more details, see Carbonneaux (2025).\"\n}"],["81b906e7-f93f-4070-82a1-ce7d908784cb","{\n  \"metadata\": {\n    \"chunk_number\": 63,\n    \"chunk_file\": \"63.txt\",\n    \"total_chars\": 1402,\n    \"processed_date\": \"2025-12-17T04:00:35.280844\",\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"CWM-specific data makes up 30% of the overall mid-training datamix. We further increase the fraction \\nof general code data to 40 % and keep 30 % for rehearsal of the initial pre-training datamix, as this proved \\nessential in retaining performance on standard evaluations. Within the rehearsal fraction, we now upweight \\nhigher quality datasets such as those containing math or long context data, while making sure to avoid \\nover-epoching. We summarize the types of data used across CWM training stages in Figure 6b. Mid-training datamix ablations. For many of the datasets introduced during mid-training we can afford to train \\nfor multiple epochs. To determine the desired number of epochs per dataset, we perform a series of scaling law \\nexperiments (Kaplan et al., 2020) that simulate different levels of epoching (Dubey et al., 2024). In agreement \\nwith the literature on this (Muennighoff et al., 2023), we generally find that multi-epoch training improves \\ndownstream task performance, albeit at diminishing returns, before eventually leading to overfitting. By \\nselecting target epochs such that metrics indicate little to no diminishing returns, we arrive at between 1 and \\n4 target epochs per dataset. The final proportion of a dataset in the mid-training mix is then calculated such \\nthat the desired number of epochs is reached at the end of mid-training. When estimating the number of steps\"\n}"],["8353d178-ac94-4455-a6d0-15d107739195","{\n  \"page_content\": \"So the final list returned by the function is [1, 1, 1, 1, 3, 1, -1, 3, -1, 1, -2, 6]. \u003c\u002fthink\u003e \\n [ANSWER] \\n assert f([1, 3, -1, 1, -2, 6]) == [1, 1, 1, 1, 3, 1, -1, 3, -1, 1, -2, 6] \\n [\u002fANSWER] \\n\\n                                                     (b)    CWM Reasoning Trace (wrong prediction). Figure B.23       CWM execution trace prediction (correct) vs.\",\n  \"metadata\": {\n    \"total_chars\": 359,\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 287,\n    \"processed_date\": \"2025-12-17T04:00:35.366998\",\n    \"chunk_file\": \"287.txt\"\n  }\n}"],["85600ec8-1b21-4985-9e78-e4a1df82ff09","{\n  \"page_content\": \"2    Code world model datasets\",\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.259747\",\n    \"total_chars\": 30,\n    \"chunk_file\": \"10.txt\",\n    \"chunk_number\": 10\n  }\n}"],["85a80eb7-636b-4449-becf-a5f24ed19601","{\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.369564\",\n    \"total_chars\": 397,\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"296.txt\",\n    \"chunk_number\": 296\n  },\n  \"page_content\": \"I need to figure out what the function f returns when called with the arguments 'hosu' and 'o'. Let me start by understanding the function step by step. First, the function takes two parameters: sequence and value. In this case, sequence is the string 'hosu' and value is 'o'. The first line inside the function is: i = max (sequence. index (value) - len(sequence) \u002f\u002f 3, 0). Let's break this down.\"\n}"],["85ea636d-133f-42f9-bd58-4af7673462c4","{\n  \"metadata\": {\n    \"total_chars\": 468,\n    \"processed_date\": \"2025-12-17T04:00:35.307677\",\n    \"chunk_number\": 129,\n    \"chunk_file\": \"129.txt\",\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"Each worker then individually applies the new weights. The trainers are only involved in the first stage, which minimizes the amount of time model transfer takes on \\nthe trainers. On the workers, the first and second stages both occur entirely in CPU memory, which allows \\nthem to overlap with generations. The third stage is simply a CPU to GPU memory copy, so it is reasonably \\nfast. When TP is enabled, this process occurs individually for each data-parallel group.\"\n}"],["86e55ea9-8a7e-4708-a214-179af32a5fca","{\n  \"metadata\": {\n    \"chunk_number\": 119,\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 473,\n    \"processed_date\": \"2025-12-17T04:00:35.303946\",\n    \"chunk_file\": \"119.txt\"\n  },\n  \"page_content\": \"6    Code and infrastructure \\n\\nThis section discusses details of our training pipeline, including efficiency-related features leveraged for CWM \\ntraining and the asynchronous RL architecture. 6.1   Techniques for efficient training \\nCWM is trained on H100s using a combination of Fully-Sharded Data Parallelism (FSDP) and Tensor Paral- \\nlelism (TP), see Table 3. We adopt FlashAttention-3 (Dao et al., 2022; Dao, 2024) to improve training speed \\nand reduce memory overhead.\"\n}"],["877c5426-1c22-4c9f-9600-7a56333604aa","{\n  \"page_content\": \"In the context of SWE agentic tasks, we highlight in Figure K.31 two notable capabilities learnt by the \\n SWE RL agent during the RL training stage. First, Figure K.31a shows that the agent learns to test code more often over the course of RL training: while \\n at the beginning of RL training the agent runs tests on at least one turn of a rollout for 57% of trajectories, \\n after only 4,000 steps of RL training it runs tests on at least one turn of a rollout for 74% of trajectories. Second, through RL training the agent learns to better localize files relevant to solving the issue. We formalize \\n it by defining the recall for a given task to be the percentage of files in the gold patch that were edited by the \\n agent during a rollout: \\n\\n                            I{files edited by the agent} n {files edited in the gold patch}| \\n                  Recall = \\n                                         I{files edited in the gold patch} |\",\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.388144\",\n    \"chunk_number\": 347,\n    \"total_chars\": 943,\n    \"chunk_file\": \"347.txt\"\n  }\n}"],["88483408-e606-4229-a1ed-20c02ca5395b","{\n  \"metadata\": {\n    \"chunk_number\": 12,\n    \"total_chars\": 780,\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.260729\",\n    \"chunk_file\": \"12.txt\"\n  },\n  \"page_content\": \"Open Weights                                                  Proprietary \\n       90 \\n                   Base \\n                                                                                                                             80.2 \\n       80         Test Time Scaling                                                                                  74.9* \\n       70           65.8                                                         69.2 69.6                     67.2 \\n                                                                   62:4* 64.2                           61.6 \\n  (%) 60                                       57.6 59.0 60.7* \\n                                 51.6 53.6 \\n  score 50 \\n  \u002f \\n  rate 40 \\n       30 \\n  Solve \\n       20 \\n       10 \\n        0\"\n}"],["88916bb1-92b9-4fe4-89d7-c63f929fbb90","{\n  \"metadata\": {\n    \"chunk_number\": 168,\n    \"chunk_file\": \"168.txt\",\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.323229\",\n    \"total_chars\": 1570\n  },\n  \"page_content\": \"7.6    Code and mathematical reasoning \\nWe present results on LiveCodeBench (LCB, Jain et al. (2025a)), concretely the LCBv5 and LCBv6 date \\nranges 01.10.2024-01.02.202515 and 01.08.2024-01.05.2025, in Table 12.16 We here compare CWM to \\nrelevant baseline models with similar parameter counts. Again, we observe highly competitive performance on \\npar with Magistral-small-1.2 (Rastogi et al., 2025), Qwen3-32B, and gpt-oss-20B (Agarwal et al., 2025). Table 12 also contains pass@1 results for CWM on Math-500 (Lightman et al., 2023), AIME24 (OpenAI, \\n2024), and AIME25 - all averaged over n = 20 samples. CWM performs slightly worse across the board, with \\nnotable gap compared to gpt-oss-20B (high) on AIME. In Figure 18a, we additionally report test-time scaling results using majority voting and short-3@k for CWM \\non AIME. Short-m@k (Hassid et al., 2025) begins sampling k answers in parallel but stops sampling once \\nthe first m generations are complete, and then selects the most common answer among the three. CWM \\nperformance on AIME24 increases by up to 11% at k = 10 with majority voting. Short-3@k achieves \\nperformance comparable to majority voting, while significantly reducing computational cost for a given k. 7.7    Non-reasoning evaluations \\nAlthough our main focus with CWM is code world modeling, we also provide evaluation results of CWM on \\na set of standard tasks covering code, math, and general knowledge without reasoning mode enabled. We here \\ncompare to models with similar parameter counts, such as Qwen3-32B or Gemma-3-27B, as baselines, and\"\n}"],["892ebabc-d746-47e5-90e5-5f804db537df","{\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.292799\",\n    \"total_chars\": 1539,\n    \"chunk_number\": 91,\n    \"chunk_file\": \"91.txt\",\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"Data self-bootstrapping. In SWE RL, CWM is required to solve software issues as a reasoning agent (i.e., \\nthrough both reasoning and tool use). However, such data does not exist in the public and the format is \\ncompletely new to the model before RL and different to our ForagerAgent data, so early iterations of our \\nmodel struggled to interact with the software environment across long horizons without making format errors. To address this, we perform an iterative self-bootstrapping process to collect high-quality agentic reasoning \\ntraces and supply them back to the joint SFT stage so that CWM can have a better prior distribution before \\nRL. This process not only helps with format adherence but also significantly improves our model's software \\nengineering capability both before and after RL. As shown in Figure 9, we start from a pre-RL CWM checkpoint (not the final CWM SFT) that has not \\nbeen SFT-ed on any SWE trajectories in the reasoning agent format. Over three main iterations, we perform \\nRL and use the RL-ed model (i.e., the SWE expert in the figure) to do rejection sampling. We then select \\nhigh-quality traces from the rejection samples using custom heuristics (e.g., long trajectories that pass all \\nhidden tests without any tool use errors). Next, we perform SFT with this data on top of the original model. This filtering helps reduce biases that RL fails to eliminate, such as the tendency to make editing mistakes. 15 \\n\u003c\u003c\u003c\\f\\n\\n                                             \u003cthink\u003e The instantiation logic is in ...\"\n}"],["89a6ab53-b154-4e95-acb1-7c36e70cd409","{\n  \"metadata\": {\n    \"total_chars\": 1304,\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.316239\",\n    \"chunk_number\": 149,\n    \"chunk_file\": \"149.txt\"\n  },\n  \"page_content\": \"Terminal-Bench. Another multi-turn agentic coding benchmark that is gaining in popularity is Terminal- \\nBench (The Terminal-Bench Team, 2025). In Terminal-Bench, the agent is asked to solve various complex \\ntasks by operating directly in a tmux session. Again, we align the prompts and response parsing of the \\nTerminus-112 agent provided by the benchmark with our RL training phase: we modify the system prompt to \\nuse the tools that CWM was trained with (see Figure 8) and parse the model output back into the format \\nthat Terminus-1 expects. We also include reasoning tokens from prior turns into the agent's history. In this \\nsetup, CWM achieves a 26.25% accuracy with the Terminus 1 agent following the default budget of 50 turns. Table 7 shows this places CWM below 04-mini but above Gemini 2.5 Pro on the Terminal-Bench leaderboard. 7.3   Execution trace prediction \\nNext, we analyze the ability of CWM to perform trace prediction, analyze its prediction, and explore this \\nability to predict program termination. CruxEval-O as execution trace prediction. The following experiment evaluates CWM's ability to predict \\nPython execution traces using the format introduced in \\u00a72.2. We prompt the model with functions and \\n  11 See https:\u002f\u002fexercism.org\u002f. 12 See https: \u002f\u002fwww.tbench.ai\u002fterminus. 26 \\n\u003c\u003c\u003c\"\n}"],["8a57cfb8-9212-4460-88f9-40a9c357db69","{\n  \"page_content\": \"19 \\n\u003c\u003c\u003c\\f\\n\\n                         Reward Scheduling (ours)                             Decay Threshold schedule 6(t) \\n   1.0                                                                 64k \\n                  moving decay 1 threshold 6 \\n   0.5                                                               6 48k \\n                                                                     Threshold \\n   0.0                                                                 32k                     64k (flat) \\nReward \\n  -0.5    correct                                                      16k \\n          incorrect \\n  -1.0                                                                  Ok increase        hold \\n            8k     16k     24k    32k     40k    48k     56k     64k     0    5k   10k             26.5k \\n                              Sequence length                                      Training steps\",\n  \"metadata\": {\n    \"chunk_file\": \"115.txt\",\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 115,\n    \"processed_date\": \"2025-12-17T04:00:35.302563\",\n    \"total_chars\": 909\n  }\n}"],["8bb04405-1d7a-4bb4-9ea3-26c27e5c10e1","{\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"164.txt\",\n    \"chunk_number\": 164,\n    \"processed_date\": \"2025-12-17T04:00:35.321674\",\n    \"total_chars\": 1083\n  },\n  \"page_content\": \"achieves the best all@1 score of all compared models but fares worse for space complexity. In particular, \\nlooking at the official benchmark leaderboard,14 CWM ranks second overall on time complexity prediction \\n(all@1) across all reported models of all sizes. For time complexity generation, CWM achieves the best overall \\npass@1, best@1, and all@1 scores for our set of models, and also ranks second in general looking at the official \\nbenchmark scores. For space complexity generation, our model ranks first for pass@1 on code only, and \\nsecond behind Qwen3-32B in terms of the remaining metrics. We note that CWM stands out in particular in \\ntime complexity reasoning, systematically outperforming other models across all metrics on both prediction \\nand generation variants. Moreover, when complexity requirements are set aside, the model's performance \\non code-only pass@1 degrades far less than for other models, indicating CWM is able to maintain focus on \\nfundamental task requirements while effectively handling additional constraints. 14See https:\u002f\u002ffacebookresearch.github.\"\n}"],["8c0487f8-630f-4590-9993-0aa6caa9d451","{\n  \"metadata\": {\n    \"chunk_number\": 307,\n    \"chunk_file\": \"307.txt\",\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.373625\",\n    \"total_chars\": 629\n  },\n  \"page_content\": \"Generate the code step by step. You MUST FIRST generate the execution traces for the code you want to generate given a specific input, and then if it's correct extract the code. Your code in the final answer should be enclosed in triple backticks like so: python YOUR CODE HERE. Use the backticks for your code only. \u003c| eot_id|\u003e\u003c|start_header_id|\u003eassistant \\n\\n Okay, let's see. The problem is about calculating the number of possible attack plans for the big bad wolf. The wolf can attack at any minute during the convention, and he eats exactly \\n x pigs. We need to find the number of ways he can do this for various values of x.\"\n}"],["8c26496c-41a3-4bce-8da3-41fdda733500","{\n  \"metadata\": {\n    \"chunk_number\": 326,\n    \"chunk_file\": \"326.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.379833\",\n    \"total_chars\": 1260,\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"GitHub \\n                                                                       Act Docker runner \\n                Clone repository                                 Running GitHub Action workflow job: \\n                                                                 \\u00b7 execute each workflow step \\n         Setup on server                Outer Docker \u002f VM        \\u00b7 check: can I execute jest? Runnable \\n                                                                  workflow step kicks off pytest     repositories \\n   \\u00b7 In repository:               . Call act to run Docker locally \\n    - Modify Github Action workflows                                 Repository's conftest . py \\n    - Add \u002f modify every conftest file in every test dir ... Container capture (session fixture): \\n   . Copy \u002f mount modified repository into Docker . Docker commit & push container_id \\u00b7 ask who am I? - write detected container_id to file \\n                                                                 . save bash env to container's file-system Tracing data \\n                                                                 Trace execution (optional function fixture): \\n                                                                 . inject sys . settrace (tr_func) into test\"\n}"],["8da3ee8e-352e-418f-964a-0eddadf04aa8","{\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.363829\",\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 1168,\n    \"chunk_number\": 278,\n    \"chunk_file\": \"278.txt\"\n  },\n  \"page_content\": \"\\\", \\\"a\\\": \\\" . . \\\", \\\"i\\\": \\\"3\\\"}\u003c|action_sep |\u003e nums. insert(i,
