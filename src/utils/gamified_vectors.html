    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #bc13fe;
            --bg-dark: #050505;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden; /* No scrollbars */
        }

        /* Background Grid Animation */
        .bg-grid {
            position: absolute;
            width: 200vw;
            height: 200vh;
            background: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridMove 20s linear infinite;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px) translateZ(-200px); }
        }

        /* The Plot Container */
        #plot-container {
            width: 100vw;
            height: 100vh;
            z-index: 1;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* HUD - Heads Up Display Overlay */
        .hud-header {
            position: absolute;
            top: 20px;
            left: 30px;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through to graph */
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            text-transform: uppercase;
            margin: 0;
            text-shadow: 0 0 10px var(--neon-blue);
            letter-spacing: 2px;
        }

        .subtitle {
            color: var(--neon-purple);
            font-size: 1.1rem;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        /* Stats Card (Glassmorphism) */
        .stats-card {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 10px;
            border-left: 3px solid var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
            z-index: 10;
            min-width: 200px;
            animation: slideIn 1s ease-out;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 1.2rem;
        }
        
        .stat-label { color: #aaa; font-size: 0.9rem; }
        .stat-value { color: var(--neon-blue); font-weight: bold; font-family: 'Orbitron'; }

        /* Decorative Corners */
        .corner {
            position: absolute;
            width: 50px;
            height: 50px;
            border: 2px solid var(--neon-purple);
            z-index: 10;
            pointer-events: none;
            opacity: 0.5;
        }
        .top-right { top: 20px; right: 20px; border-bottom: none; border-left: none; }
        .bottom-right { bottom: 20px; right: 20px; border-top: none; border-left: none; }

        /* Animations */
        @keyframes slideIn {
            from { transform: translateX(-100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Loading Overlay (Optional) */
        #loader {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: black;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--neon-blue);
            font-family: 'Orbitron';
            font-size: 2rem;
            transition: opacity 1s ease;
        }

                         \u003c|action_sep|\u003e if x%2 == 0:\"\n}"],["0257a6a3-9289-4fcb-834b-5ca6f081c76c","{\n  \"metadata\": {\n    \"chunk_number\": 104,\n    \"chunk_file\": \"104.txt\",\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.298254\",\n    \"total_chars\": 431\n  },\n  \"page_content\": \"Instead, the agent needs to provide the solution in its final response, which is then extracted \\nfor evaluation. We consider two programming languages, Python and C++, where the images used for \\nagentic interaction are python: 3.11-slim for Python and python: 3.11-bookworm (with gcc 12 support) for \\nC++. The final solution is then evaluated using the same execution infrastructure as for the competitive \\nprogramming environment.\"\n}"],["03eae8d3-a967-47bb-997f-5f06bafed68d","{\n  \"metadata\": {\n    \"chunk_file\": \"316.txt\",\n    \"total_chars\": 309,\n    \"processed_date\": \"2025-12-17T04:00:35.376562\",\n    \"chunk_number\": 316,\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"The function f(x) defines two helper functions, g(i) and h(j). It then calls h(x) and returns None. So, the termination of f(x) depends entirely on the behavior of \\n        h(x), which in turn depends on g(i). Let me break down the helper functions: \\n First, g(i): \\n If i is less than or equal to 0, return 0.\"\n}"],["04032595-3abd-42da-8ba7-a00f5946443b","{\n  \"page_content\": \"Therefore, the function returns 'hosu' when called with f('hosu', 'o'). \u003c\u002fthink\u003e \\n [ANSWER] \\n assert f('hosu', 'o') == 'hosu' \\n [\u002fANSWER] \\n\\n                                                (b)   CWM Reasoning Trace (correct prediction). Figure B.24        CWM execution trace prediction (wrong) vs. CWM natural language reasoning trace (correct). In \\n\\nthis CruxEval example, the CWM model with reasoning in natural language predicts the correct output 'hosu'. In \\n\\nexecution trace prediction mode, the CWM model predicts 'osu', because it fails to predict the value of the variable i \\n\\nin the first line correctly.\",\n  \"metadata\": {\n    \"chunk_number\": 298,\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.370520\",\n    \"total_chars\": 613,\n    \"chunk_file\": \"298.txt\"\n  }\n}"],["04d566a2-bad1-481a-9ed8-23c8ab448cb1","{\n  \"metadata\": {\n    \"chunk_number\": 152,\n    \"processed_date\": \"2025-12-17T04:00:35.317469\",\n    \"total_chars\": 340,\n    \"chunk_file\": \"152.txt\",\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"using 1164 tokens on average compared to 497 tokens for full trace prediction. We also report results for \\nCWM after SFT, which achieves its best result of 87.3% using full execution trace prediction. Single-step \\ntrace prediction is not competitive with classic few-shot prompting for either CWM model. Execution trace prediction analysis.\"\n}"],["0603d98e-73d5-427e-8e4a-9a45af533105","{\n  \"metadata\": {\n    \"chunk_file\": \"95.txt\",\n    \"chunk_number\": 95,\n    \"total_chars\": 621,\n    \"processed_date\": \"2025-12-17T04:00:35.294153\",\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"We reuse the executable repository images from our mid-training data generation \\nefforts (\\u00a72.1). Since issue solving requires additional metadata (e.g., issue text, base commit hashes, and \\ndiff patches), we join these repositories with publicly available issue and pull request metadata to create \\nrepository-issue pairs. The git log history enables us to create one-to-many repository-issue pairs. We also \\ninclude publicly available training data such as SWE-Gym (Pan et al., 2025) and R2E-Gym (Jain et al., \\n2025b), further filtered by us for quality (e.g., removing non-verifiable instances whose tests cannot pass).\"\n}"],["06ee226a-615a-4472-9979-561488ee27fb","{\n  \"page_content\": \"Niklas Muennighoff, Alexander Rush, Boaz Barak, Teven Le Scao, Nouamane Tazi, Aleksandra Piktus, Sampo Pyysalo, \\n  Thomas Wolf, and Colin A Raffel. Scaling data-constrained language models.\",\n  \"metadata\": {\n    \"chunk_file\": \"222.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.342841\",\n    \"total_chars\": 189,\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 222\n  }\n}"],["06ef21d4-f639-41af-8c65-4f4be2b52829","{\n  \"page_content\": \"Xuezhi Wang, Jason Wei, Dale Schuurmans, Quoc Le, Ed Chi, Sharan Narang, Aakanksha Chowdhery, and Denny \\n  Zhou. Self-consistency improves chain of thought reasoning in language models. ar Xiv preprint ar Xiv:2203.11171, \\n  2022b. Jason Wei, Xuezhi Wang, Dale Schuurmans, Maarten Bosma, Brian Ichter, Fei Xia, Ed Chi, Quoc Le, and Denny Zhou. Chain-of-thought prompting elicits reasoning in large language models, 2023. https:\u002f\u002farxiv.org\u002fabs\u002f2201.11903. Jason Wei, Nguyen Karina, Hyung Won Chung, Yunxin Joy Jiao, Spencer Papay, Amelia Glaese, John Schulman, \\n  and William Fedus. Measuring short-form factuality in large language models. CoRR, abs\u002f2411.04368, 2024. doi: \\n  10.48550\u002fARXIV.2411.04368. https:\u002f\u002fdoi.org\u002f10.48550\u002farXiv.2411.04368. 40 \\n\u003c\u003c\u003c\",\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.347858\",\n    \"chunk_number\": 235,\n    \"chunk_file\": \"235.txt\",\n    \"total_chars\": 752\n  }\n}"],["0707e342-cca1-4047-be14-2aefd379f2ad","{\n  \"metadata\": {\n    \"total_chars\": 1157,\n    \"chunk_number\": 80,\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"80.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.287310\"\n  },\n  \"page_content\": \"13 \\n\u003c\u003c\u003c\\f\\n\\n                                 \u003ctool: edit\u003e       Custom plugin tools         Reasoning \\n                                 [path]              \u003ctool: create\u003e \u003ctool: submit\u003e \u003ctool: ... \u003e      Test Oracle \\n                   \u003ctool: bash\u003e \u003c\u003c\u003c\u003c\u003c\u003c\u003c SEARCH                                                       suite patch \\n                   [command(s)] [search_lines]       [path]      [result]       Feedback \\n                   \u003c\u002ftool\u003e       =======             [content] \u003c\u002ftool\u003e \u003c\u002ftool\u003e \\n                                 [replacement_lines]                                         +       \u003e       + \\n                   Executes bash \u003e\u003e\u003e\u003e\u003e\u003e\u003e REPLACE                 Marks [result] \u003ctool: submit\u003e \\n                   [command(s)] in the \u003c\u002ftool\u003e       Creates a new       as \\n Issue   Agent     current session                   [content] file at [path] with submission your final Feedback Reward: tests or \\n                                 Replaces [search_lines] from                   Summary   Predicted patch patch similarity \\n                      Repo sandbox [path] with [replacement_lines]             Trajectory             (if tests fail)\"\n}"],["080863a6-5f3c-45a3-b6d7-6878d9f4f6ed","{\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 398,\n    \"processed_date\": \"2025-12-17T04:00:35.259468\",\n    \"chunk_file\": \"9.txt\",\n    \"chunk_number\": 9\n  },\n  \"page_content\": \"models can be used to leverage reasoning and planning to improve code generation. To this end, we release \\nboth the final weights and intermediate checkpoints under a noncommercial research license. Given CWM's \\ncompetitive performance, we conducted a preparedness assessment which concluded that CWM is unlikely to \\nincrease catastrophic risks beyond those present in the current model ecosystem.1\"\n}"],["0874e030-b3f7-43fb-a0a1-9ee4c4381626","{\n  \"page_content\": \"Thus, the PPO loss can be understood as a clipped version of this. D    Activ image-building pipeline \\n\\nThe Activ pipeline, shown in Figure D.29, automatically builds executable repository images at scale by \\nmodifying their GitHub Actions workflows and running them locally using the act (Lee, 2019) library within a \\nvirtual environment. Our approach builds on the insight that the execution environment of a GitHub Actions \\nworkflow running CI tests is a fully built environment with dependencies, and can therefore be captured as a \\nstandalone Docker image for later execution.\",\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"325.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.379401\",\n    \"total_chars\": 581,\n    \"chunk_number\": 325\n  }\n}"],["0954670e-3998-432d-8ad5-7c688a78adea","{\n  \"metadata\": {\n    \"chunk_number\": 40,\n    \"total_chars\": 196,\n    \"chunk_file\": \"40.txt\",\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.272693\"\n  },\n  \"page_content\": \".cpp \\n #include \u003cbits\u002fstdc++.h\u003e \\n using namespace std; \\n\\n bool is_evenly_separated(const string& s) { ... Figure 4      Example of CWM solving a competitive programming problem in agentic fashion.\"\n}"],["0a8c027c-9e44-4913-84b3-2b0466dc5577","{\n  \"page_content\": \"Additionally, we incorporate several optimizations towards efficient training. fp8 matrix multiplication. All linear layers in transformer blocks used float8 low-precision mode, similar to \\nMicikevicius et al. (2022), achieving twice the nominal FLOPs of bfloat16 on Hopper GPUs. (For RL training, \\nfp8 precision hurt performance and hence we used bfloat16 for linear layers in transformer blocks.) We used \\ndynamic \\\"row-wise\\\" scaling, also called \\\"outer-vector\\\", that is, operands were scaled along their reduction di- \\nmension. We used the e4m3 variant exclusively, and we disabled fast-accumulation throughout. The two matrix \\nmultiplication operations for the gradient computation in the backwards pass use special setups: w. grad is com- \\nputed in bfloat16 (which increased accuracy and precluded the need to transpose its operands to satisfy float8 \\nlayout constraints, which make kernel fusion difficult); in. grad uses \\\"tensor-wise\\\" scaling for its weight operand, \\ni.e., a single scaling factor for the whole tensor, which again makes transposition more efficient. In practice, we \\ntry to issue \\\"unscaled\\\" matrix multiplication kernels, introducing scaling in the kernel epilogue worsens perfor- \\nmance, and perform the scaling as a manual post-processing step, which can be fused into subsequent kernels. 20 \\n\u003c\u003c\u003c\",\n  \"metadata\": {\n    \"chunk_number\": 120,\n    \"total_chars\": 1322,\n    \"chunk_file\": \"120.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.304338\",\n    \"source\": \"CWM-Meta\"\n  }\n}"],["0ca480e6-f4e3-46ab-b284-e71de00f3d9b","{\n  \"page_content\": \"37 \\n\u003c\u003c\u003c\\f\\n\\nHynek Kydlicek, Alina Lozovskaya, Nathan Habib, and Cl\\u00e9mentine Fourrier. Math-verify, 2025. https:\u002f\u002fgithub.com\u002f \\n  huggingface\u002fMath-Verify. Casey Lee. act, 2019. https:\u002f\u002fgithub.com\u002fnektos\u002fact.\",\n  \"metadata\": {\n    \"chunk_number\": 211,\n    \"processed_date\": \"2025-12-17T04:00:35.337836\",\n    \"chunk_file\": \"211.txt\",\n    \"total_chars\": 202,\n    \"source\": \"CWM-Meta\"\n  }\n}"],["0e356185-d1df-4130-bb31-0066f943b671","{\n  \"page_content\": \"(2024).\",\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.282198\",\n    \"total_chars\": 7,\n    \"chunk_number\": 66,\n    \"chunk_file\": \"66.txt\",\n    \"source\": \"CWM-Meta\"\n  }\n}"],["0f444b05-2752-4b19-9fc2-05f9444bf91e","{\n  \"page_content\": \"been studied extensively (Kaplan et al., 2020; Hoffmann et al., 2022; Bi et al., 2024). These empirical laws \\nenable the estimation of the expected loss for a given compute budget, the identification of the optimal scaling \\nstrategy between model and data size, and an informed selection of training hyper-parameters. Following Bi \\net al. (2024), we develop scaling laws for optimal hyper-parameter prediction for the pre-training of CWM. We adopt the compute budget formula C = M . D, where M is the model size represented as the number of \\nnon-embedding FLOP per token and D is the data scale corresponding to the total number of training tokens. For a decoder-only Transformer, the number of FLOP per token is approximated by \\n                                     M =    6N ne +    6dLS    ,                                  (1) \\n                                          linear term attention term \\nwhere Nne is the number of parameters excluding embeddings, d is the model hidden dimension, S is the \\nsequence length, and L is the number of layers. This formula explicitly accounts for the computational cost of \\nself-attention, which constitutes a significant portion of the total compute, especially for smaller models and \\nlonger contexts where attention overhead is relatively more pronounced, as discussed in Bi et al.\",\n  \"metadata\": {\n    \"chunk_file\": \"65.txt\",\n    \"chunk_number\": 65,\n    \"processed_date\": \"2025-12-17T04:00:35.281908\",\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 1328\n  }\n}"],["0f5e4960-1290-4353-86e3-e060e3163084","{\n  \"metadata\": {\n    \"chunk_number\": 174,\n    \"processed_date\": \"2025-12-17T04:00:35.325583\",\n    \"total_chars\": 1452,\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"174.txt\"\n  },\n  \"page_content\": \"(a)                                                  (b) \\n\\nFigure 18 (a) Test-time scaling on AIME24 with majority voting and short-3@k. See main text for details.(b) LoCoDiff \\nresults for CWM and baselines considering different sequence lengths buckets. 8   Transparency, Risks & Limitations \\n\\n8.1 Transparency on external models and data \\nAs mentioned previously in the relevant sections, we use data from external LLMs in four contexts: (i) \\nForagerAgent, (ii) trace-to-natural language conversion, (iii) function tracing, and (iv) the SFT phase. For \\nthe ForagerAgent, we employ Llama3-70B-Instruct (Dubey et al., 2024) and Qwen3-235B-A22B (without \\nthinking) (Yang et al., 2025a) as base models to interact with the computational environment. For converting \\nraw Python traces into natural language, we use Qwen3-32B-FP8 (without thinking) (Yang et al., 2025a). For \\nfunction tracing, we use Llama3-70B-Instruct to generate Python function inputs and to generate solutions \\nfor CodeContests data. Finally, during SFT, we incorporate trajectories from DeepSeek-R1 (Guo et al., 2025) \\nthrough the OpenMathReasoning (Moshkov et al., 2025) and OpenCodeReasoning (Ahmad et al., 2025) \\ndatasets. We used mitigated versions of the OpenCodeReasoning and OpenMathReasoning datasets, where \\nmitigations included algorithmic bias filtering and cybersecurity protections. We applied similar mitigations \\nwhen using Qwen3-32B-FP8 to generate data for training.\"\n}"],["0f8f4467-32df-4038-a831-53874a1e1c3c","{\n  \"page_content\": \"Code & Complexity - pass@1      24.1         25.5                17.7             14.6 \\n          Code & Complexity - best@1      36.6         39.6                26.3            20.6 \\n          Code & Complexity - all@1        3.2           5.1                2.4              1.5\",\n  \"metadata\": {\n    \"chunk_file\": \"161.txt\",\n    \"total_chars\": 281,\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 161,\n    \"processed_date\": \"2025-12-17T04:00:35.320587\"\n  }\n}"],["108432a1-4c43-4eba-9faa-0086f7681e03","{\n  \"page_content\": \"Figure 8 SWE RL interaction example. The agent interacts extensively with the repository sandbox through reasoning, \\nexploration, editing, and test execution, submitting a final patch using git diff along with a summary. The runtime implementation of the tools follows SWE-agent (Yang et al., 2024) and OpenHands (Wang et al., \\n2025), where bash is a stateful shell session running in a persistent server process, and serves as the main \\ncomponent, while other customized tools are treated as plugins that can be \\\"de-sugared\\\" into simple bash \\ncommands. For example, the edit and create tools are two standalone Python scripts, and the submit tool, \\nwhen used for file paths, reduces to cat \u003cpath\u003e to retrieve the file content. The user prompt includes custom instructions for resolving software issues.\",\n  \"metadata\": {\n    \"total_chars\": 803,\n    \"chunk_file\": \"87.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.291091\",\n    \"chunk_number\": 87,\n    \"source\": \"CWM-Meta\"\n  }\n}"],["10a421b1-6d80-4d9b-a073-b0e7fcb19a56","{\n  \"page_content\": \"No external LLM tokens were used beyond those \\nexplicitly mentioned in these four contexts. 8.2   Code World Model Preparedness Report \\nDespite its relatively small size of 32 B parameters, CWM outperforms open-weight models at similar size and \\nis competitive to larger and proprietary models on verified software engineering benchmarks. To anticipate \\nrisks from this release, including potentially novel risks, we conducted an automated assessment of CWM \\ncapabilities relevant to the domains identified in our Frontier AI Framework17 that could present potentially \\n 17 See https:\u002f\u002fai.meta.com\u002fstatic-resource\u002fmeta-frontier-ai-framework.\",\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"175.txt\",\n    \"total_chars\": 641,\n    \"chunk_number\": 175,\n    \"processed_date\": \"2025-12-17T04:00:35.325849\"\n  }\n}"],["10c9dfa0-20a2-4550-9a10-b601700521a9","{\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.332439\",\n    \"chunk_file\": \"194.txt\",\n    \"total_chars\": 568,\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 194\n  },\n  \"page_content\": \"Karl Cobbe, Vineet Kosaraju, Mohammad Bavarian, Mark Chen, Heewoo Jun, Lukasz Kaiser, Matthias Plappert, \\n  Jerry Tworek, Jacob Hilton, Reiichiro Nakano, Christopher Hesse, and John Schulman. Training verifiers to solve \\n  math word problems. CoRR, abs\u002f2110.14168, 2021. https:\u002f\u002farxiv.org\u002fabs\u002f2110.14168. Taco Cohen, David W. Zhang, Kunhao Zheng, Yunhao Tang, R\\u00e9mi Munos, and Gabriel Synnaeve. Soft policy \\n  optimization: Online off-policy RL for sequence models. CoRR, abs\u002f2503.05453, 2025. doi: 10.48550\u002fARXIV.2503. 05453. https:\u002f\u002fdoi.org\u002f10.48550\u002farXiv.2503.05453.\"\n}"],["10ea9172-011f-4493-9c76-e4b97df03c43","{\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.290065\",\n    \"chunk_file\": \"85.txt\",\n    \"total_chars\": 1145,\n    \"chunk_number\": 85,\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"Each SWE RL \\ntrajectory has a single human user turn (besides the system prompt) containing the issue description and \\nmultiple turns of agent-environment interactions. During training, we allow long-horizon interaction, with a \\nmaximum of 128 turns over a context window of 131 k tokens. As shown in Figure 7, the agent is equipped with four tools to solve a given task (e.g., software issue), where \\nwe embrace a minimal tool design centered on bash and editing, inspired by Sonnet 3.5 (Anthropic, 2025): \\n    \\u00b7 bash: executing commands in a stateful shell session, \\n    \\u00b7 edit: modifying an existing file using the search\u002freplace format used by Agentless (Xia et al., 2024) \\n      and Aider (Aider Team, 2025), \\n    \\u00b7 create: creating a new file in the sandbox, and \\n      submit: marking something (e.g., a file path) as the final submission according to the task requirement. 14 \\n\u003c\u003c\u003c\\f\\n\\n Solve the following issue by implementing the necessary code changes and submitting a patch file: \\n \u003cissue_description\u003e {issue} \u003c\u002fissue_description\u003e \\n The [result] argument of \u003ctool: submit\u003e should be the path to a patch file that resolves the issue ...\"\n}"],["11a51c7f-2b49-42e6-b2e7-c5bb6d14a702","{\n  \"page_content\": \"In general, rollouts are multi-turn, so the trajectories yi consist of a prompt x followed by a sequence of \\nactions and observations. We use the binary mask Mi,t to signal whether token yi,t was generated by the \\nagent (Mi,t = 1) or environment (initial prompt and later observations; Mi,t = 0). The first input required by the PPO loss is an estimate of the advantage. We denote by Ri the total \\nreturn (i.e., sum of undiscounted rewards) of trajectory i. For a batch of G trajectories, we compute the \\nlength-weighted mean return u = { E- Ri x Li, where Li = Et Mit and L =       L; is the total number of \\nagent-generated tokens. The advantage is then   = Ri - p. The PPO loss further requires the log probabilities of the trajectory under the behavior policy, often denoted \\nTold, in order to compute the importance ratio. One complicating factor here is that the workers continue \\nrollouts in parallel to model updates (see \\u00a76.2). At a given point in time, any number of the G rollouts in a \\nbatch may be in progress.\",\n  \"metadata\": {\n    \"chunk_number\": 250,\n    \"chunk_file\": \"250.txt\",\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 1023,\n    \"processed_date\": \"2025-12-17T04:00:35.353696\"\n  }\n}"],["1233d490-9fc1-43bf-b14f-c04aa6b88787","{\n  \"page_content\": \"def [X] main(): # \u003c\u003c START_OF_TRACE \\n     return f('hosu', 'o' ) \u003c | frame_sep | \u003e\u003c| call_sep |\u003e{}}| action_sep |\u003edef main() : # START_OF_TRACE \\n \u003c| [X] frame_sep |\u003e \\n  --- END OF PROMPT --- \\n \u003c| [X] line_sep|\u003e{}\u003c|action_sep|\u003e return f('hosu', 'o') \\n  [X] frame_sep [X]     [X] \u003e{\\\"sequence\\\": 'hosu'\\\", \\\"value\\\": \\\"'o'\\\"}\u003c|action_sep|\u003edef f(sequence, value) : \\n  [X] frame_sep [X] \\\\line_sep | \u003e{\\\"sequence\\\": [X] \\\"value\\\": \\\"}|action_sep [X] |\u003e i = max(sequence. index(value) - len(sequence) \u002f\u002f 3, 0) \\n  [X] | frame_sep [X] line_sep|\u003e{\\\"sequence\\\": [X] \\\" . . \\\" . \\\"value\\\": \\\"i\\\": \\\"1\\\"}\u003c|action_sep|\u003e result =' \\n  [X] frame_sep [X] line_sep [X] sequence\\\" : \\\" . . \\\" 'value\\\": \\\"i\\\" : \\\" . . \\\". \\\"result\\\": \\\"''\\\"}\u003c|action_sep|\u003e for j, v in enumerate(sequence[i: ]) : \\n  [X] frame_sep [X] line_sep [X] 'sequence\\\": \\\"value\\\":     \\\"i\\\": '     \\\" result \\\" : \\\" \\\" , \\\" j \\\" : \\\"0\\\" , \\\"v\\\" : \\\" 'o' \\\"}| [X] action_sep | \u003e if v '+' : \\n  [X] frame_sep [X] line_sep [X] [\\\"sequence\\\" \\\"value\\\":     \\\"i\\\" : \\\" .. \\\" \\\"result\\\":               \\\"v\\\":   .\\\"}\u003c|action_sep|\u003e [X] result += sequence[i + j] \\n  [X] frame_sep [X] line_sep |\u003e{\\\"sequence\\\": [X] ,\\\"value\\\":            \\\"result\\\" : \\\"'o' \\\" , \\\"j\\\" : \\\". \\\", \\\"v\\\": \\\".\\\"}{|action_sep [X] |\u003e for j, v in enumerate(sequence[i:]) : \\n  \u003c| [X] frame_sep [X] line_sep [X] sequence\\\": \\\" . i\\\" : \\\"    \\\"result\\\": \\\" .. \\\", \\\"j\\\": \\\"1\\\", \\\"v\\\": \\\"'s'\\\"}{|action_sep [X] |\u003e if v '+' \\n  [X] | frame_sep [X] line_sep [X] sequence\\\" : \\\" .. \\\", \\\"value\\\": \\\"i\\\" : \\\" \\\" result\\\" : \\\" .. \\\", \\\"j\\\" : \\\" \\\" \\\"v\\\". \\\"}\u003c|action_sep|\u003e [X] result += sequence[i + j]\",\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"291.txt\",\n    \"total_chars\": 1495,\n    \"processed_date\": \"2025-12-17T04:00:35.368246\",\n    \"chunk_number\": 291\n  }\n}"],["1261609d-b035-4947-add6-aa12dcc65291","{\n  \"metadata\": {\n    \"chunk_number\": 27,\n    \"chunk_file\": \"27.txt\",\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 1143,\n    \"processed_date\": \"2025-12-17T04:00:35.267506\"\n  },\n  \"page_content\": \"To avoid contamination, we filter out all repositories \\n(and their forks) that are used in SWE-bench. The tasks presented to the model can be categorized into two \\ngroups: synthetic tasks and real-world tasks, which we call mutate-fix and issue-fix. Mutate-fix tasks. For mutate-fix tasks, we start with a working codebase and then synthetically introduce a \\nbug for the agent to fix. We begin by identifying functions (and methods - omitted for brevity below) that \\ncan be verified using the repository test suite. As a first step, we filter these functions to the subset for which \\nall unit tests pass successfully. We then consider the following set of mutations to synthetically introduce a \\nbug into these functions: \\n      Functions: remove either a portion of the function or the entire function. Arguments: remove arguments from the function definition or randomly re-order function call arguments. \\u00b7 Variables: sample a pair of variables in the function and swap all their occurrences. \\u00b7 Statements: remove an import or return statement. \\u00b7 Operators: replace operators (binary, unary, or boolean) in statements in the function. 5 \\n\u003c\u003c\u003c\"\n}"],["13553c37-b586-468f-afba-860162b4b6fc","{\n  \"metadata\": {\n    \"chunk_file\": \"106.txt\",\n    \"chunk_number\": 106,\n    \"processed_date\": \"2025-12-17T04:00:35.299130\",\n    \"total_chars\": 581,\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"Every trajectory is classified as either correct (reward = 1) or incorrect (reward = - 1). Correctness \\nis defined as: \\n       Exactly one \u003c\u002fthink\u003e tag, signaling successful reasoning completion. Exactly one $\\\\boxed{}$ for the predicted answer. . Our verifier emits True for the comparison between the predicted answer and the ground-truth answer. Since there is no general normal form for mathematical expressions, the verifier checks whether the predicted \\nanswer is equivalent to the ground truth answer using a variety of heuristics detailed in \\u00a7G. Data sourcing and filtering.\"\n}"],["13d3f243-9c70-497a-a358-54f884190ed4","{\n  \"metadata\": {\n    \"chunk_file\": \"26.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.266972\",\n    \"chunk_number\": 26,\n    \"total_chars\": 1394,\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"After removing \\ncases where the final output prediction from Qwen diverges from the ground truth trace, we obtain 75 M \\ntrajectories from standalone Python functions and 110 k from CodeContests data. 2.3   ForagerAgent: agentic midtraining data generation \\nWe mid-train CWM on a large-scale dataset of interactions between an LLM-based software engineering agent \\nand a computational environment. This data is generated with our so-called ForagerAgent, which collects multi- \\nstep trajectories by prompting an LLM with a software engineering task to solve in the context of a particular \\ncode repository. Exposing CWM to such data at large scale early on should improve subsequent post-training \\nin similar environments, as model predictions should already be grounded in environment dynamics. The actions available to the agent are derived from the standard SWE-Agent (Yang et al., 2024) toolset: (i) \\ncreate a file, (ii) edit a file, (iii) run a bash command, and (iv) view or navigate inside a file. The trajectory \\nis concluded once the LLM, either Llama3-70B-Instruct (Dubey et al., 2024) or Qwen3-235B-A22B (w\u002fo \\nthinking) (Yang et al., 2025a), believes the task has been solved or the number of tokens, turns, or API \\ncosts exceed a hard limit. Like the repository-level tracing data, ForagerAgent relies on our set of executable \\nrepository images (see \\u00a72.1) to seed problem generation.\"\n}"],["13d5a605-91d5-43a8-9182-023045dc115f","{\n  \"page_content\": \"lookup_name(attr) \\n           if frame_cls is not None and self. frame.is_transformable_to(frame_cls): \\n               return self.transform_to(attr) \\n\\n        # Fail \\n        return self .__ getattribute __ (attr) \\n           f\\\"'{self class    name_}' object has no attribute '{attr}'\\\" \\n        )\",\n  \"metadata\": {\n    \"total_chars\": 297,\n    \"processed_date\": \"2025-12-17T04:00:35.355627\",\n    \"chunk_number\": 255,\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"255.txt\"\n  }\n}"],["1423cd76-4e45-4e63-9b20-08320d79a5d4","{\n  \"page_content\": \"\\\", we have omitted parts \\n\\nof CWM reasoning for clarity here. 51 \\n\u003c\u003c\u003c\\f\\n\\n You will be given a function f and a call to that function in the form f( ??\",\n  \"metadata\": {\n    \"chunk_file\": \"312.txt\",\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.375343\",\n    \"chunk_number\": 312,\n    \"total_chars\": 149\n  }\n}"],["14a42540-28a0-4e25-a7a1-c7da31363c38","{\n  \"page_content\": \"I need to correct the indentation in the sky_coordinate.py file. However, since the 'edit' tool is not available, I'll try a different \\n approach. Let me check the current state of the getattr __ method in sky_coordinate.py. \u003ctool: bash\u003e \\n sed -n 890,910p \u002ftestbed\u002fastropy\u002fcoordinates\u002fsky_coordinate.py \\n \u003c\u002ftool\u003e \\n\\n \u003coutput\u003e \\n               return getattr(self ._ sky_coord_frame, attr) \\n\\n           # Try to interpret as a new frame for transforming. frame_cls = frame_transform_graph.\",\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 254,\n    \"total_chars\": 486,\n    \"chunk_file\": \"254.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.355330\"\n  }\n}"],["14e4a611-17a0-47ad-8eaa-196b0f1521b0","{\n  \"page_content\": \"Natural language tracing. Lastly, we generate a dataset of step-by-step descriptions of Python code execution in \\nnatural language rather than our strict JSON-like format from before. Natural language explanations of code \\nexecution are closer in domain to other LLM tasks, which we hope will simplify knowledge transfer to other \\n context such as reasoning in code generation. This less-structured format also has other advantages, such as \\n allowing for injection of semantic context (e.g., \\\"this operation preserves the structure property of the max \\nheap\\\") or for compressing traces by dynamically skipping less interesting parts of the trajectory (e.g., repeated \\nlogic within a for loop). We generate this data by prompting Qwen3-32B-FP8 (without thinking) (Yang et al., \\n2025a) to re-write execution traces from our function-level and CodeContests trace datasets.\",\n  \"metadata\": {\n    \"chunk_file\": \"25.txt\",\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.266498\",\n    \"chunk_number\": 25,\n    \"total_chars\": 870\n  }\n}"],["1519679f-5b55-45ac-ba86-18119ac1ea87","{\n  \"metadata\": {\n    \"chunk_file\": \"230.txt\",\n    \"chunk_number\": 230,\n    \"processed_date\": \"2025-12-17T04:00:35.346122\",\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 235\n  },\n  \"page_content\": \"Gabriel Synnaeve, Jonas Gehring, Zeming Lin, Daniel Haziza, Nicolas Usunier, Danielle Rothermel, Vegard Mella, \\n  Da Ju, Nicolas Carion, Laura Gustafson, et al. Growing up together: Structured exploration for large action spaces. 2019.\"\n}"],["174084a4-7d2b-4055-b1d5-0257e1cb5940","{\n  \"metadata\": {\n    \"chunk_number\": 192,\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"192.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.331916\",\n    \"total_chars\": 1313\n  },\n  \"page_content\": \"AAAI Press, 2020. doi: 10.1609\u002fAAAI.V34I05.6239. https:\u002f\u002fdoi.org\u002f10.1609\u002faaai.v34i05.6239. Quentin Carbonneaux. Fastgen, 2025. https:\u002f\u002fgithub.com\u002ffacebookresearch\u002ffastgen. Pierre Chambon, Baptiste Roziere, Benoit Sagot, and Gabriel Synnaeve. Bigo(bench) - can Ilms generate code with \\n  controlled time and space complexity?, 2025. https: \u002f\u002farxiv. org\u002fabs\u002f2503.15242. Mark Chen, Jerry Tworek, Heewoo Jun, Qi odel and can predict the program execution.\"\n}"],["192f1374-0a8e-453f-9d0b-9f47c13e8cdf","{\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.284520\",\n    \"total_chars\": 653,\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 72,\n    \"chunk_file\": \"72.txt\"\n  },\n  \"page_content\": \"reasoning mode can be activated by injecting \u003c| reasoning_thinking_start |\u003e into the beginning of assistant \\nresponses. Note that we discontinue the use of these reasoning tokens during RL as explained in \\u00a75.3. 5.2   RL algorithm \\nWe use a variant of Group Relative Policy Optimization (GRPO) to train CWM (Shao et al., 2024). GRPO \\nis a policy gradient method that uses the PPO loss (Schulman et al., 2017) in combination with Monte Carlo \\nvalue estimation instead of a value model, as used in PPO. Many works have proposed improvements to and \\nfixes of GRPO (Yu et al., 2025; Liu et al., 2025; Hu et al., 2025; Mistral-AI et al., 2025). We incorporate\"\n}"],["19eb9cc1-94de-4c34-aa9f-50c7c84b9c1d","{\n  \"metadata\": {\n    \"chunk_file\": \"297.txt\",\n    \"chunk_number\": 297,\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.370079\",\n    \"total_chars\": 1594\n  },\n  \"page_content\": \"sequence. index(value) finds the index of the first occurrence of 'o' in 'hosu'. The string 'hosu' is h-o-s-u, so the index of 'o' is 1. len(sequence) is the length of 'hosu', which is 4. len(sequence) \u002f\u002f 3 is 4 divided by 3, which equals 1 (since integer division truncates). So, sequence.index(value) - len(sequence) \u002f\u002f 3 is 1- 1 = 0. Then, max(0, 0) is 0. Therefore, i is 0. Next, the function initializes an empty string result = ''. Then, there's a for loop: for j, v in enumerate(sequence[i: ]). Since i is 0, sequence[i:] is the entire string 'hosu'. So, the loop will iterate over each character in \\n         'hosu' along with their indices j. Let's go through each iteration: \\n\\n  1. j = 0, v = 'h': \\n    - v is not '+', so result += sequence[i + j] which is sequence[0 + 0] = 'h'. Now result is 'h'. 2. j = 1, v = 'o': \\n    - v is not '+', so result += sequence[0 + 1] = 'o'. Now result is 'ho'. 3. j = 2, v = 's': \\n    - v is not '+', so result += sequence[0 + 2] = 's'. Now result is 'hos' . 4. j = 3, v = 'u': \\n    - v is not '+', so result += sequence[0 + 3] = 'u'. Now result is 'hosu'. After the loop, the function returns result, which is 'hosu' . Wait a minute, but the value parameter is 'o'. The code checks if v == '+', but in the sequence 'hosu', there are no '+' characters. So, the condition v == '+' is never \\n        true. Therefore, the code never appends the value 'o' to the result. Instead, it appends the characters from the sequence starting at index i (which is 0) for \\n        each character in the sequence. So, the result is just the original sequence 'hosu'.\"\n}"],["1a2ed5b4-03dd-411b-9395-bc7ac2515c65","{\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.356576\",\n    \"chunk_file\": \"257.txt\",\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 1192,\n    \"chunk_number\": 257\n  },\n  \"page_content\": \"Let me try to fix this by restoring the original file and applying the change again carefully. \u003ctool: bash\u003e \\n git checkout \u002ftestbed\u002fastropy\u002fcoordinates\u002fsky_coordinate.py \\n \u003c\u002ftool\u003e \\n\\n \u003coutput\u003e \\n Updated 1 path from the index \\n \u003c\u002foutput\u003e \\n \u003cbudget\u003e \\n * Remaining turns: 81 \\n * Remaining tokens: 84837 \\n \u003c\u002fbudget\u003e \\n\\n Now that the sky_coordinate. py file has been restored, I'll apply the correct change using sed, making sure to replace the entire raise AttributeError block with the correct line. The original code at line 898 is: \\n\\n       # Fail \\n       raise AttributeError( \\n          f\\\"'{self class    name_}' object has no attribute '{attr}'\\\" \\n       ) \\n\\n I need to replace this with: \\n\\n       # Fail \\n       return self .__ getattribute __ (attr) \\n\\n Let me use sed to do this correctly. \u003ctool: bash\u003e \\n sed -i '898,900c\\\\ # Fail\\\\n return self .__ getattribute __ (attr)' \u002ftestbed\u002fastropy\u002fcoordinates\u002fsky_coordinate.py \\n \u003c\u002ftool\u003e \\n\\nFigure B.19      Example intermediate turns in SWE RL (bash-only). The agent learns to correct indentation mistakes \\n\\nfrom wrong edits by restoring the original file state using git                       checkout, followed by applying a correct edit using sed.\"\n}"],["1a44da1e-e19b-4add-9cb0-a1b0d79a750e","{\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.365236\",\n    \"total_chars\": 159,\n    \"chunk_number\": 282,\n    \"chunk_file\": \"282.txt\"\n  },\n  \"page_content\": \"Your response should be solely the assertion, enclosed within [ANSWER] and [\u002fANSWER] tags. [SKIPPED EXAMPLE FOR ILLUSTRATION PURPOSES] \\n Python function: \\n ...\"\n}"],["1b2f1bf2-98d4-4b21-b0a9-f0e2a8977572","{\n  \"page_content\": \"27 \\n\u003c\u003c\u003c\\f\\n\\n Table 9 Detailed analysis of execution trace prediction with CWM and greedy decoding. We present a breakdown of \\n the accuracy of the individual components of trace prediction for validation set inputs from CruxEval as well as our \\n function-level data. The CruxEval pass@1 score here differs from the one in Table 8 (87.7%) due to greedy decoding. Overall, we find solid accuracy across state and action prediction. CruxEval   Function-level \\n                   Output     pass@1                            88.0            94.4 \\n                   Trace      Valid Trace Format                99.6           100.0 \\n                              State Exact Match                 96.9            96.4 \\n                              Action Exact Match                96.5            98.0 \\n                   States     Valid JSON Format                100.0           100.0 \\n                              Key Match                         99.1            99.0 \\n                              Key+Value Match                   98.1            97.9 \\n                   Statistics Avg State Length (Token)          11.7            18.8 \\n                              Avg Action Length (Token)         11.2            10.0 \\n\\n Table 10 HaltEval-prelim pass@1 scores for different LLMs in different prompting settings. For reasoning we use \\n temperature 0.6, top-p of 0.95, and 10 generations, while for direct and CoT predictions we use greedy decoding.\",\n  \"metadata\": {\n    \"total_chars\": 1457,\n    \"chunk_file\": \"155.txt\",\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.318530\",\n    \"chunk_number\": 155\n  }\n}"],["1b4d4178-3bc6-4d4c-a8c0-acb1145552a3","{\n  \"page_content\": \"Wait a minute, when we insert elements, the original elements shift to the right.\",\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.366254\",\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 285,\n    \"total_chars\": 81,\n    \"chunk_file\": \"285.txt\"\n  }\n}"],["1ba97bfb-0540-4d66-bd8f-c8820f469c76","{\n  \"metadata\": {\n    \"total_chars\": 1475,\n    \"chunk_number\": 59,\n    \"chunk_file\": \"59.txt\",\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.279502\"\n  },\n  \"page_content\": \"Figure 6 Figures illustrating the CWM Transformer architecture and the main types of data introduced in the different \\ntraining steps and used at inference time. 9 \\n\u003c\u003c\u003c\\f\\n\\nTable 2 Key hyper-parameters of the 32 B CWM. Parameter                                  Value \\n             Number of parameters                       32 B \\n             Layers                                     64 \\n             Hidden dimension                           6144 \\n             Intermediate dimension                     21 504 \\n             Number of attention heads \u002f dimension      48 \u002f 128 \\n             Number of key-value heads                  8 \\n             Local window size                          8192 tokens \\n             Max global context                         131 072 tokens \\n             Activation function                        SwiGLU \\n             Normalization                              RMSNorm (pre-norm) \\n             Positional Encoding                        Scaled RoPE (0 = 106, scale factor = 16) \\n             Vocabulary size                            128 256 tokens \\n\\nwarmup, we use a cosine decay learning rate schedule with peak learning rate 8 x 10-4 and decaying by a \\nfactor of 100x over the training horizon. The cosine decay schedule is calculated for a total training duration \\nof 13 T tokens, with the last 5T tokens of the scheduler used during mid-training. Key hyper-parameters \\nwere determined using scaling laws, which we detail in \\u00a74.3.\"\n}"],["1bc5220f-7268-4ec1-bc50-20bb041e36c3","{\n  \"page_content\": \"Figure B.22 shows how we execution trace prediction for CruxEval output prediction in our experiments in \\n\\u00a77.3. Figure B.26 demonstrates how CWM's Python execution trace prediction capability can be used for code \\ngeneration. By specifying a set of asserts consistent with the desired behavior and simply pretending to \\n import the desired function, without actually giving a function definition, CWM starts to generate actions \\nconsistent with the desired function. It is possible that the model acquired this capability of jointly tracing and \\ngenerating code because for some tracing data we do not include the source context of third-party libraries. We expand on this in Figure B.27, the example of mixing tracing and code generation discussed earlier in \\nSection 3. Future work could build on CWM's capabilities here and explore how execution trace prediction \\ncan be used to improve code generation. Program Termination. Figure B.28 llustrates termination reasoning, whereby CWM considers several concrete \\ninputs before generalizing to the conclusion of terminating on all inputs. C    RL algorithm \\n\\n Given a prompt x, we perform G rollouts, producing a set of trajectories (i.e., token sequences) {y1, 2, ... yG}.\",\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.353275\",\n    \"total_chars\": 1223,\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 249,\n    \"chunk_file\": \"249.txt\"\n  }\n}"],["1bd4e89d-4c42-478a-aed0-d19b1054810d","{\n  \"page_content\": \"Self-attention. In multi-head self-attention, the two dominant operations are QKT and softmax(QKT)V. The FLOP cost of the softmax itself is negligible compared to these matrix multiplications. The forward pass \\n of each multiplication costs 2BS2d FLOP, while the backward pass is about twice as expensive, contributing \\n 4BS2d FLOP. Summing both gives 12BS2d FLOP. Because causal attention only computes half of the entries \\n of QKT, the cost reduces to 6BS2d. Dividing by the number of tokens BS gives the per-token cost 6Sd.\",\n  \"metadata\": {\n    \"total_chars\": 526,\n    \"chunk_number\": 331,\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"331.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.381536\"\n  }\n}"],["1c061117-2d9a-4127-95f1-e0c1b55fc7ef","{\n  \"metadata\": {\n    \"chunk_number\": 5,\n    \"chunk_file\": \"5.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.257338\",\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 1535\n  },\n  \"page_content\": \"We believe that advancing code generation with LLMs may require new training and modeling paradigms. Typically, code is treated the same as any other text data during pre-training: the model learns to predict \\ncode line by line, from left to right and top to bottom. We think this is not sufficient - to master coding, one \\nmust understand not just what code looks like but what it does when executed. Such skill is instrumental to \\nthe everyday work of software engineers: at a local level, they understand how the execution of a line of code \\nchanges the state of the local variables, and, at a global level, they can make predictions about how changes \\nto a codebase affect program outputs. Yet, teaching LLMs such code world modeling capabilities is typically \\nnot considered before post-training. We release Code World Model (CWM), a new LLM for code generation and reasoning that has been trained \\non large amounts of code world modeling data. Concretely, CWM is mid-trained on two different kinds \\nof observation-action trajectories that capture important aspects of software development: Python code \\nexecution traces and agentic interactions with Docker environments. Mid-training on such data at scale should \\nhelp improve coding performance by grounding our model's predictions in the underlying dynamical systems \\nand provide a superior starting point for RL. For the Python execution data, actions are Python statements and observations contain the contents of the \\n\\n                                                 1 \\n\u003c\u003c\u003c\"\n}"],["1c2425ee-7b46-48a6-ae11-ab87385f0dbc","{\n  \"page_content\": \"\\\", \\\"v\\\": \\\" .. \\\"}\u003c|action_sep|\u003e [X] return result \\n  [X] frame_sep [X] return_sep [X] action_sep |\u003e [X] return result\u003c| arg_sep|\u003e\\\" 'osu'' \\n  [X] frame_sep [X] return_sep |\u003e\u003c| [X] action_sep | \u003e return f('hosu', 'o' ) \u003c | arg_sep |\u003e\\\" ' osu' \\\"\u003c | frame_sep |\u003e \\n\\n                                         (a)   CWM Execution Trace Prediction (wrong prediction). Given a python code function and an assert statement containing a specific input, provide the assertion with the exact literal output that the function returns with \\n        that input.\",\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 541,\n    \"processed_date\": \"2025-12-17T0
