5 pigs, the wolf cannot arrive at minute 1, since there aren't enough pigs at that time. Therefore, the wolf has to arrive at minute 2, and there are 6 possible \\n attack plans. If the wolf wants to eat 6 pigs, his only plan is to arrive at the end of the convention and devour everybody. Remember to output your answers modulo 10^9+7!\"\n}"],["b82a6d87-ca77-44fc-9334-9c36df809b85","{\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 74,\n    \"total_chars\": 1,\n    \"processed_date\": \"2025-12-17T04:00:35.285237\",\n    \"chunk_file\": \"74.txt\"\n  },\n  \"page_content\": \".\"\n}"],["b8eaf448-cab7-404d-9be6-635ab6616d9e","{\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"281.txt\",\n    \"chunk_number\": 281,\n    \"processed_date\": \"2025-12-17T04:00:35.364917\",\n    \"total_chars\": 101\n  },\n  \"page_content\": \"Do not \\n         include any mathematical expressions or function calls-only the final literal value.\"\n}"],["b970f21a-d766-4105-b079-79c26bc28e07","{\n  \"metadata\": {\n    \"chunk_number\": 15,\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"15.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.262214\",\n    \"total_chars\": 1591\n  },\n  \"page_content\": \"As manually building arbitrary \\nGitHub repositories cannot scale to our desired dataset size, we apply both LLM- and CI-assisted methods. For the former, an LLM-backed agent, denoted as RepoAgent, was tasked with setting up the development \\nenvironment of a target repository, finding test files, and ensuring that a significant number of them could \\nrun and pass. To support its efforts, we provide RepoAgent with human-readable documentation extracted \\nfrom the target repository. Although this further improves RepoAgent's success rates, human-targeted \\ndocumentation can suffer from inaccuracies due to lack of verifiability and insufficient maintenance incentives. In contrast, machine-targeted instructions must remain accurate for successful builds, with platforms like \\nGitHub immediately signaling failures. Therefore, we also developed the Activ (Act in virtual) pipeline to repurpose GitHub Actions CI execution \\nfor building executable repository images. This pipeline runs the workflows locally via the act (Lee, 2019) \\nlibrary. Since many GitHub Actions workflows are not designed for third-party execution and not limited to \\nCI builds, we modify the target repository's source code and trigger an early exit after the completion of a \\nsingle successful build. As all GitHub Actions workflow jobs run simultaneously in individual containers and \\nthe build state is transient, we add or modify the repository's pytest configuration files, to inject a fixture that \\nis automatically run at test-execution time. This fixture captures the build state of the container running unit\"\n}"],["b98f6094-c5cd-48e2-b813-f2dd4a8bc91e","{\n  \"metadata\": {\n    \"chunk_file\": \"39.txt\",\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 39,\n    \"processed_date\": \"2025-12-17T04:00:35.272354\",\n    \"total_chars\": 334\n  },\n  \"page_content\": \"I'm confident that there are no bugs, and the solution meets the problem's requirements. The approach involves checking each character's occurrences to ensure that no character appears more than twice, and any pair of occurrences of a character must be an odd number of \\n positions apart (i.e., their indices have different parities).\"\n}"],["bb3d60f4-0edb-47f2-bf86-4232911fc8a1","{\n  \"page_content\": \"dual_coef_\\\" was printed, which should be an empty CSR matrix. However, the output is empty, which suggests that \\\"model. dual_coef_\\\" is indeed an \\n empty matrix. Now, I need to verify that this fix doesn't break any other functionality.\",\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.357143\",\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 259,\n    \"total_chars\": 235,\n    \"chunk_file\": \"259.txt\"\n  }\n}"],["bb4b2b3a-b1e1-47f1-bab1-80b72005ad8b","{\n  \"metadata\": {\n    \"chunk_file\": \"109.txt\",\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.300135\",\n    \"chunk_number\": 109,\n    \"total_chars\": 1030\n  },\n  \"page_content\": \"18 \\n\u003c\u003c\u003c\\f\\n\\nRehearsal & Local queue of worker batches                                                Agentic coding \\n                                                                                          Code \\n                                   Data transfer queue                                     Math \\n                                                             Traj 1 Traj 2    ... Traj 8   Agentic SWE \\n               1 \\n                              Trainer batch of trajectory contexts \\n  R                        PAD 131k tokens with paddings    Worker batches \\n                              Online or rehearsal                           Execution & verification \\n              1                                                             locally remotely \\n\\n   1    2   3    4    ... n        Model transfer queue        1    2   3    4   ... m \\n                                  Update & transfer model weights \\n          Trainer nodes                                              Worker nodes           Data sources\"\n}"],["bcda48e3-a4e6-437e-bd1a-246aefe78ba5","{\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 1261,\n    \"processed_date\": \"2025-12-17T04:00:35.271985\",\n    \"chunk_number\": 38,\n    \"chunk_file\": \"38.txt\"\n  },\n  \"page_content\": \"Now let's compile and run the code. \u003ctool: bash\u003e \\n g++ -std=c++17 -02 solution.cpp -o solution; \\n echo -e \\\"abba\\\\n\\\" | .\u002fsolution \\n echo -e \\\"aabba\\\\n\\\" | .\u002fsolution \\n echo -e \\\"aaa\\\\n\\\" | .\u002fsolution \\n echo -e \\\"abcd\\\\n\\\" | .\u002fsolution \\n echo -e \\\"aabb\\\\n\\\" | .\u002fsolution \\n \u003c\u002ftool\u003e \\n\\n YES \\n NO \\n NO \\n YES \\n YES \\n\\n All the test cases match the expected results. The code works correctly for these samples and edge cases. For very large inputs, the code has 0(n) time and 0(1) space (since there are \\n 26 possible characters, hash maps would use at most 26 entries). Therefore, the solution is efficient and should pass all test cases, including those up to 1e6 characters long. The approach checks for each character occurrence and ensures that each pair of occurrences meet the parity requirement. Also, it immediately terminates upon finding a third occurrence \\n or a pair with same parity indices, which is crucial for efficient processing. I'm confident that there are no bugs, and the solution meets the problem's requirements. The approach involves checking each character's occurrences to ensure that no character appears more than twice, and any pair of occurrences of a character must be an odd number of \\n positions apart (i.e., their indices have different parities).\"\n}"],["bf12e8a8-6abb-40c9-925a-6e262913bf7e","{\n  \"page_content\": \"\u003c| frame_sep|\u003e\u003c|line_sep|\u003e{\\\"d\\\": \\\" .. \\\", \\\"k\\\": \\\" .. \\\", \\\"new_d\\\": \\\"{1: 2, 2: 4}\\\", \\\"key\\\": \\\" .. \\\", \\\"val\\\": \\\" .. \\\"}\u003c|action_sep|\u003e for key, val in d.items(): \\n \u003c| frame_sep|\u003e\u003c|line_sep|\u003e{\\\"d\\\": \\\" .. \\\", \\\"k\\\": \\\" .. \\\", \\\"new_d\\\": \\\" .. \\\", \\\"key\\\": \\\"3\\\", \\\"val\\\": \\\"3\\\"}\u003c|action_sep|\u003e if key \u003c k: \\n \u003c| frame_sep|\u003e\u003c|line_sep|\u003e{\\\"d\\\": \\\" .. \\\", \\\"k\\\": \\\" .. \\\", \\\"new_d\\\": \\\" .. \\\", \\\"key\\\": \\\" .. \\\", \\\"val\\\": \\\" .. \\\"}\u003c|action_sep|\u003e for key, val in d.items(): \\n \u003c| frame_sep|\u003e\u003c|line_sep|\u003e{\\\"d\\\": \\\" .. \\\", \\\"k\\\": \\\" .. \\\", \\\"new_d\\\": \\\" .. \\\", \\\"key\\\": \\\" .. \\\", \\\"val\\\": \\\" .. \\\"}\u003c|action_sep|\u003e return new_d \\n \u003c| frame_sep|\u003e\u003c|return_sep|\u003e\u003c|action_sep|\u003e return new_d \\n \u003c|arg_sep|\u003e\\\"{1: 2, 2: 4}\\\"\u003c|frame_sep|\u003e\u003c|return_sep|\u003e\u003c|action_sep|\u003e return f({1: 2, 2: 4, 3: 3}, 3) \\n \u003c|arg_sep|\u003e\\\"{1: 2, 2: 4}\\\"\u003c|frame_sep|\u003e \\n Now let us analyze the trace. The return argument of the function call f({1: 2, 2: 4, 3: 3}, 3) in the main() function is \\\"{1: 2, 2: 4}\\\" in JSON format, so the return value is {1: 2, 2: \\n 4}. [ANSWER] \\n assert f({1: 2, 2: 4, 3: 3}, 3) == {1: 2, 2: 4} \\n [\u002fANSWER] \\n\\nFigure 5      Example with execution trace prediction and reasoning. In this example, we add an execution trace example \\n\\nto the prompt. After reasoning in natural language about the code, the model uses its execution trace prediction \\n\\ncapability to confirm the correct return value {1:                                2,   2:   4}. We encode all special                          (e.g.\",\n  \"metadata\": {\n    \"chunk_file\": \"52.txt\",\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.276920\",\n    \"total_chars\": 1395,\n    \"chunk_number\": 52\n  }\n}"],["bf8239df-c062-4211-a93c-367fddfca238","{\n  \"page_content\": \"Different workers may not update their weights at the same time: the system waits for \\neach worker to signal readiness before sending new weights to avoid memory overload. Docker execution services or Modal (Modal Team)), implementation of remote execution servers and clients \\nas an interface to a persistent shell session, plugins that can be defined as standalone Python scripts invoked \\nthrough bash, along with evaluation infrastructure for reward calculation or benchmarking. 7    Experimental results \\n\\nWe begin this section by analyzing the impact of incorporating CWM data during mid-training for a small- \\nscale ablation.\",\n  \"metadata\": {\n    \"chunk_number\": 132,\n    \"chunk_file\": \"132.txt\",\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.309212\",\n    \"total_chars\": 631\n  }\n}"],["c16369d3-7ae2-4196-97c8-8c2f2b5f0776","{\n  \"metadata\": {\n    \"chunk_file\": \"48.txt\",\n    \"chunk_number\": 48,\n    \"processed_date\": \"2025-12-17T04:00:35.275231\",\n    \"total_chars\": 350,\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"\u003c| frame_sep|\u003e\u003c|return_sep|\u003e\u003c| action_sep|\u003e return y \\n \u003c|arg_sep|\u003e\\\"6\\\"\u003c|frame_sep|\u003e\u003c|return_sep|\u003e\u003c| action_sep|\u003e return f(1,3) \\n \u003c| arg_sep|\u003e\\\"6\\\"\u003c|frame_sep|\u003e \\n Now let us analyze the trace. The return argument of the function call f(1,3) in the main() function is \\\"6\\\" in JSON format, so the return value is 6. [ANSWER] \\n assert f(1,3) == 6 \\n [\u002fANSWER]\"\n}"],["c1b01759-6311-4a30-9f6a-73a86f5a7231","{\n  \"page_content\": \"We split our joint RL training into three distinct stages. Between stages, we adapt the \\ntask distribution and employ custom reward shaping techniques. Stage 1 - Reasoning format bootstrapping: In the initial training stage, we soft-control the length of \\n     generations in math and coding tasks with an action length reward schedule. For the 40% of tasks \\n     related to competitive programming, we evenly sample from four environments: code Python, code \\n     C++, agentic coding Python, and agentic coding C++ (10% each). For a subset of SWE tasks identified \\n     as challenging, we include a hint in the prompts and downsample their occurence (4% of overall tasks; \\n     \\u00a75.3.1). \\u00b7 Stage 2 - Increasing task diversity and data resampling: After 14125 gradient steps, we increase the \\n     proportion of competitive programming tasks in the datamix to 50% and reduce the fraction of SWE \\n     tasks to 30%. We also include additional environment variations for each task. Specifically, we add Rust, \\n     Go, Java, and JavaScript versions of the code environment, which, together with Python and C++, now \\n     constitute 25 % of the datamix. The other half of the competitive programming tasks use the agentic \\n     coding environment, to which we do not add new languages. For the SWE data, we disable plugins with \\n     a 50% chance, such that file edits require standard terminal commands. We further remove hints from \\n     the challenging SWE subset and oversample it in a 4 : 1 ratio when plugins are used, and reverse this\",\n  \"metadata\": {\n    \"chunk_file\": \"113.txt\",\n    \"total_chars\": 1537,\n    \"chunk_number\": 113,\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.301804\"\n  }\n}"],["c212b178-b71e-4b95-9824-ca7274bca1be","{\n  \"metadata\": {\n    \"chunk_number\": 160,\n    \"processed_date\": \"2025-12-17T04:00:35.320325\",\n    \"total_chars\": 1502,\n    \"chunk_file\": \"160.txt\",\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"Table 11 BIGOBENCH results comparing CWM against Qwen3-32B (with reasoning), Qwen3-coder-30B, and Gemma-3- \\n27B on complexity prediction and complexity generation, for both time and space complexity. CWM outperforms our \\nset of baseline models for all metrics on time complexity prediction and generation. For space complexity generation, \\nCWM performs best on code-only pass@1 and ranks second on the remaining metrics. We refer to the main text for \\ndetails on the task and metrics. CWM     Qwen3-32B     Qwen3-coder-30B     Gemma-3-27B \\n      Prediction \\n        Time Complexity - all@1           41.3         39.0                36.6            37.7 \\n        Space Complexity - all@1          12.3          15.1                9.1            13.1 \\n      Generation \\n        Time Complexity \\n          Code Only - pass@1              76.1         70.0                43.8            34.4 \\n          Code & Complexity - pass@1      31.3         29.1                20.3             13.3 \\n          Code & Complexity - best@1     48.6          43.5                27.2             15.2 \\n          Code & Complexity - all@1        7.6           6.5                5.5             2.1 \\n         Space Complexity \\n          Code Only - pass@1              73.2         65.9                45.1            36.4 \\n          Code & Complexity - pass@1      24.1         25.5                17.7             14.6 \\n          Code & Complexity - best@1      36.6         39.6                26.3            20.6\"\n}"],["c289788c-16ce-4ecf-a287-a24e3e78ce59","{\n  \"metadata\": {\n    \"chunk_file\": \"275.txt\",\n    \"chunk_number\": 275,\n    \"processed_date\": \"2025-12-17T04:00:35.362756\",\n    \"total_chars\": 177,\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"47 \\n\u003c\u003c\u003c\\f\\n\\n \u003c| begin_of_text|\u003e\u003c|trace_context_start|\u003e \\n def f(nums): \\n    a = 0 \\n    for i in range(len(nums)): \\n        nums.insert(i, nums[a]) \\n        a += 1 \\n     return nums\"\n}"],["c2ba8b94-5b5d-492c-a0dd-427a58fed62a","{\n  \"page_content\": \"Extending \\u00a73, we here present additional examples of using CWM for SWE reasoning, trace prediction, and a \\ncombination of the two. Reasoning agent. Figure B.19 shows an example of CWM solving an SWE-bench Verified problem in a \\nbash-only environment, which is more challenging than environments that provide dedicated tools for common \\ntasks such as file editing. In this example, the model makes incorrect edits in the initial turns but realizes its \\nerror and restores the original file state using git checkout, followed by producing a correct edit with sed. Figure B.20 demonstrates that CWM can leverage test execution to verify patch correctness before submission. In this specific example, the agent makes sure that the changes it makes do not break any existing functionality. Only after this verification, the agent submits the patch and generates a summary. Lastly, Figure B.21 shows the default SWE RL setting where CWM is paired with the edit tool. In \\nthis example, CWM performs extensive reasoning before making the edit. The edit tool then provides \\nagent-friendly feedback showing the surrounding code after the change. Python execution trace prediction. Figures B.23 and B.24 showcase Python execution trace prediction at \\ninference time and compare it to reasoning about program execution in natural language. For Figure B.23, a \\nPython list is modified while iterating over it. In execution trace prediction mode, the model tracks all list \\nmodifications and predicts the output correctly. With natural language reasoning, the model fails to predict the\",\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.352325\",\n    \"chunk_number\": 247,\n    \"total_chars\": 1572,\n    \"chunk_file\": \"247.txt\"\n  }\n}"],["c38274a3-cd5e-44f2-9db9-eca2e8534dbf","{\n  \"metadata\": {\n    \"chunk_number\": 151,\n    \"chunk_file\": \"151.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.317175\",\n    \"total_chars\": 1513,\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"input arguments from the CruxEval test set, ask it to predict the function execution trace line-by-line, and \\nthen compare its output prediction to the ground truth. To elicit trace prediction, we construct prompts \\nfollowing our custom trace format, with the input containing the function as the code context, the call \\narguments as the state, and the line containing the function definition as the first action. In addition to this \\n\\\"full\\\" execution trace prediction scenario, we also study a single-\\\"step\\\" scenario, for which we ask the model \\nto directly predict the return value of the function. This is achieved by replacing the \u003c| line_sep|\u003e token \\nwith \u003c| return_sep|\u003e. We illustrate both formats in Figure B.22. We compare the \\\"step\\\" scenario to classic \\nCruxEval-output prediction, which few-shot prompts the model to directly predict outputs given function \\ndefinitions and inputs. Consequently, we compare the \\\"full\\\" trace prediction mode to CruxEval-output with \\nreasoning, which allows CWM to use reasoning as introduced in \\u00a75.3 before predicting the function output. Our results in Table 8 show that large compute budgets, either allowing for execution trace prediction or \\nreasoning, produce better results. CWM achieves a best score of 94.0% in natural language reasoning mode, \\nwhile full trace prediction achieves 88 %. Note that language reasoning traces are significantly more verbose, \\nusing 1164 tokens on average compared to 497 tokens for full trace prediction. We also report results for\"\n}"],["c3b2298d-d31c-4523-8e26-8d2e9a2c6f70","{\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.333629\",\n    \"total_chars\": 501,\n    \"chunk_file\": \"198.txt\",\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 198\n  },\n  \"page_content\": \"Dheeru Dua, Yizhong Wang, Pradeep Dasigi, Gabriel Stanovsky, Sameer Singh, and Matt Gardner. DROP: A reading \\n  comprehension benchmark requiring discrete reasoning over paragraphs. In Jill Burstein, Christy Doran, and \\n  Thamar Solorio, editors, Proceedings of the 2019 Conference of the North American Chapter of the Association for \\n  Computational Linguistics: Human Language Technologies, NAACL-HLT 2019, Minneapolis, MN, USA, June 2-7, \\n  2019, Volume 1 (Long and Short Papers), pages 2368-2378.\"\n}"],["c3cb7e87-70b4-4133-99f3-3e2a294d753e","{\n  \"page_content\": \"g(0) is 0, so 0 -1 = - 1. Then g(-1) is 0. Then g(0) is 0. So 0 +1 = 1. So g(2) is 1. Wait, that's the same as g(1). What about g(3)? g(3) = g(g(g(1) - 1))+1 \\n g(1) is 1, so 1-1 = 0. Then g(0) is 0. Then g(0) is 0. So 0 +1 = 1. So g(3) is 1. Hmm, so for i=1,2,3, g(i) returns 1. What about i=4? g(4) = g(g(g(2) -1))+1 \\n g(2) is 1, so 1-1=0. Then g(0) is 0. Then g(0) is 0. So 0 +1 = 1. So g(4) is 1. Wait, so it seems like for any i \u003e 0, g(i) returns 1. Is that possible? Let me check i=5. g(5) = g(g(g(3) -1))+1 \\n g(3) is 1, so 1-1= 0. Then g(0) is 0. Then g(0) is 0. So 0 +1 = 1. Yep, same result. So, in general, for any i \u003e 0, g(i) will compute to 1. Because no matter what i is, when you subtract 2 enough times, you get to a point where the inner g call returns \\n        0, leading to a chain that ends up with 0 +1 = 1. Wait, but what if i is even or odd?\",\n  \"metadata\": {\n    \"chunk_file\": \"318.txt\",\n    \"chunk_number\": 318,\n    \"processed_date\": \"2025-12-17T04:00:35.377430\",\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 862\n  }\n}"],["c440a9a0-4ccd-4fc2-83df-9aada37eee7f","{\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 216,\n    \"processed_date\": \"2025-12-17T04:00:35.340534\",\n    \"chunk_file\": \"216.txt\",\n    \"total_chars\": 757\n  },\n  \"page_content\": \"Meta AI. Llama 4 model card. https:\u002f\u002fgithub.com\u002fmeta-llama\u002fllama-models\u002fblob\u002fmain\u002fmodels\u002fllama4\u002fMODEL_CARD. md, 2025. Accessed: 2025-09-18. Aaron Meurer, Christopher P. Smith, Mateusz Paprocki, Ond\\u0159ej \\u010cert\\u00edk, Sergey B. Kirpichev, Matthew Rocklin, AMIT \\n  Kumar, Sergiu Ivanov, Jason K. Moore, Sartaj Singh, Thilina Rathnayake, Sean Vig, Brian E. Granger, Richard P. Muller, Francesco Bonazzi, Harsh Gupta, Shivam Vats, Fredrik Johansson, Fabian Pedregosa, Matthew J. Curry, \\n  Andy R. Terrel, \\u0160t\\u011bp\\u00e1n Rou\\u010dka, Ashutosh Saboo, Isuru Fernando, Sumith Kulal, Robert Cimrman, and Anthony \\n  Scopatz. Sympy: symbolic computing in python. PeerJ Computer Science, 3:e103, January 2017. ISSN 2376-5992. doi: 10.7717\u002fpeerj-cs.103. https:\u002f\u002fdoi.org\u002f10.7717\u002fpeerj-cs.103.\"\n}"],["c4ef4237-9f40-4ac6-9e4c-a580686dc3f5","{\n  \"metadata\": {\n    \"chunk_number\": 245,\n    \"processed_date\": \"2025-12-17T04:00:35.351603\",\n    \"chunk_file\": \"245.txt\",\n    \"total_chars\": 130,\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"Extending \\u00a73, we here present additional examples of using CWM for SWE reasoning, trace prediction, and a \\ncombination of the two.\"\n}"],["c6dfff0d-0add-42b9-ba83-5ac49bf43363","{\n  \"page_content\": \"We assign a reward of -1 for incorrect trajectories and 1 for correct ones. A trajectory is correct if it \\n meets all of the following criteria: \\n    \\u00b7 Contains exactly one \u003c\u002fthink\u003e tag, signaling successful reasoning completion. \\u00b7 Contains exactly one markdown block in the model's generated answer.\",\n  \"metadata\": {\n    \"chunk_number\": 100,\n    \"processed_date\": \"2025-12-17T04:00:35.296334\",\n    \"total_chars\": 300,\n    \"chunk_file\": \"100.txt\",\n    \"source\": \"CWM-Meta\"\n  }\n}"],["c766d5c4-2d60-44ca-8fe2-fdb77e2d733a","{\n  \"metadata\": {\n    \"chunk_number\": 218,\n    \"processed_date\": \"2025-12-17T04:00:35.341311\",\n    \"chunk_file\": \"218.txt\",\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 396\n  },\n  \"page_content\": \"Todor Mihaylov, Peter Clark, Tushar Khot, and Ashish Sabharwal. Can a suit of armor conduct electricity? A \\n  new dataset for open book question answering. In Ellen Riloff, David Chiang, Julia Hockenmaier, and Jun'ichi \\n  Tsujii, editors, Proceedings of the 2018 Conference on Empirical Methods in Natural Language Processing, Brussels, \\n  Belgium, October 31 - November 4, 2018, pages 2381-2391.\"\n}"],["c7a90c45-46fc-4db8-8dca-3371ab1e8a0c","{\n  \"metadata\": {\n    \"chunk_number\": 62,\n    \"processed_date\": \"2025-12-17T04:00:35.280437\",\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 425,\n    \"chunk_file\": \"62.txt\"\n  },\n  \"page_content\": \"3 Note that our \\\"local\\\" attention blocks are therefore effectively global during pre-training. 4We have observed lackluster performance when training on long-context data at smaller batch sizes. We speculate that \\nincreasing the batch size (in tokens) is beneficial for training on long-context data, as the decrease in the number of documents \\ncontained in each batch increases the variance in our gradient estimate. 10 \\n\u003c\u003c\u003c\"\n}"],["c810ad6a-f8fd-482a-82d2-d111387fae51","{\n  \"metadata\": {\n    \"chunk_number\": 179,\n    \"total_chars\": 705,\n    \"processed_date\": \"2025-12-17T04:00:35.327206\",\n    \"chunk_file\": \"179.txt\",\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"training focuses strongly on code generation and reasoning with code. Thus, our models may be lacking in \\nother domains such as factual knowledge or classic natural language tasks. CWM is not trained for use as a general-purpose assistant or chat model and has not been aligned on, or fully \\nevaluated for, content risks. We make available system level protections - like Llama Guard, Prompt Guard, \\nand Code Shield - as a solution to help manage content generation in research environments.19 However, \\nthese system level protections alone are unlikely to be sufficient to enable production uses of CWM and \\nfurther evaluations and fine-tuning may be required. CWM is intended to be used in English only.\"\n}"],["c89e1df9-c836-46bf-9409-e935260bdc45","{\n  \"metadata\": {\n    \"chunk_file\": \"150.txt\",\n    \"total_chars\": 1241,\n    \"processed_date\": \"2025-12-17T04:00:35.316684\",\n    \"chunk_number\": 150,\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"Table 7 Results on Terminal-Bench for CWM and base- Table 8 Execution trace prediction is competitive with \\nlines from the official leaderboard. reasoning for CruxEval-output pass@1 scores. For CWM, \\n                                                   we use temperature 0.6, top-p 0.95, and 10 generations, \\n  Model             Agent          Accuracy (%)    while for CWM SFT we use greedy decoding. OpenAI-Multiple   OB-1           59.0 \\n                                                     Budget   Mode                CWM SFT    CWM \\n  GPT-5             OB-1           49.0 \\n  GPT-5             Terminus 1     30.0                       Language w\u002fo COT         67.8   66.6 \\n                                                       small \\n  04-mini           Goose          27.5                       Trace Step               59.1   58.1 \\n  CWM               Terminus 1     26.3 \\n                                                              Language w\u002f CoT          83.3 94.3 \\n  Gemini 2.5 Pro    Terminus 1     25.3                large Trace Full               87.3    87.7 \\n  04-mini           Terminus 1     18.5 \\n  Grok 3 Beta       Terminus 1     17.5 \\n  Gemini 2.5 Flash Terminus 1      16.8 \\n  Qwen3-32B         TerminalAgent 15.5\"\n}"],["c8cab4b3-8933-42fd-a2c5-5789536289d3","{\n  \"page_content\": \"... \\u00b7END OF PROMPT --- \\n\\n Okay, I need to figure out if the function f(x) terminates for all inputs or if there's some input where it diverges. Let's start by understanding what the function \\n        does.\",\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 205,\n    \"processed_date\": \"2025-12-17T04:00:35.376314\",\n    \"chunk_file\": \"315.txt\",\n    \"chunk_number\": 315\n  }\n}"],["c8cd81fe-5ab8-452a-8106-148f71318629","{\n  \"page_content\": \"Then, to produce a batch B for training, trajectories are popped from \\nthe queue until a limit of N tokens is reached. By keeping a fixed limit of N tokens we reduce the variance \\nin the batch size between different steps, and optimize the GPU utilization without over-allocating GPU \\nmemory. The trajectories are packed into a flat batch, padded to N tokens, and forwarded to produce the log \\nprobabilities of the tokens log \\\"(yi,tyi, \u003ct). As a consequence, the trajectories associated with one prompt \\nmay be spread out over multiple gradient updates. Finally, the loss is calculated as \\n                                lyil \\n               J() =               Mi, min Pit(O) Ai, clip (Pi,t(0), 1 - @low, 1 + \\u20achigh) \\n                         yi, Ai EB t=1 \\n\\nwhere, as noted before, B is the trainer batch (not generally equal to the set of G trajectories per prompt), \\n Mi,t E {0, 1} masks out environment-generated tokens, Elow and Ehigh are the PPO clipping thresholds, and \\n N is the maximum number of tokens in a batch (which we set to 131 072, the maximum context size of our \\nmodel). The importance ratio pi,t is computed from the log probabilities log Te and log Told (computed on \\nthe trainer and worker, respectively) as follows: \\n\\n                           Pi,t(0) = exp (log (Vi,tyi,\u003ct) - log Told (Vit|yi,\u003ct).\",\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.354636\",\n    \"chunk_number\": 252,\n    \"chunk_file\": \"252.txt\",\n    \"total_chars\": 1324,\n    \"source\": \"CWM-Meta\"\n  }\n}"],["c9d1dc93-47dc-4c35-9b15-3150ad97ec97","{\n  \"page_content\": \"Do not include any mathematical expressions or function calls-only the final literal value. Your response should be solely the assertion, enclosed \\n        within [ANSWER] and [\u002fANSWER] tags. [SKIPPED EXAMPLE FOR ILLUSTRATION PURPOSES] \\n Python function: \\n ... def f(sequence, value) : \\n     i = max(sequence.index(value) - len(sequence) \u002f\u002f 3, 0) \\n     result = '' \\n     for j, v in enumerate(sequence[i:]): \\n        if v == '+': \\n            result += value \\n        else: \\n            result += sequence[i + j] \\n     return result \\n assert f('hosu', 'o') == ?? END OF PROMPT --- \\n Okay, let's see.\",\n  \"metadata\": {\n    \"total_chars\": 599,\n    \"chunk_file\": \"295.txt\",\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.369318\",\n    \"chunk_number\": 295\n  }\n}"],["cb164f36-7e00-44d5-8ed5-0d03b325a3d8","{\n  \"metadata\": {\n    \"chunk_number\": 11,\n    \"total_chars\": 808,\n    \"processed_date\": \"2025-12-17T04:00:35.260202\",\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"11.txt\"\n  },\n  \"page_content\": \"2    Code world model datasets \\n\\nCWM is trained on a large variety of datasets across pre-, mid-, and post-training phases. We focus strongly \\non code and code world modeling data across all stages of training. We highlight two large-scale data collection \\nefforts that empower CWM's world modeling capabilities: Python execution traces and ForagerAgent. We \\nrefer to \\u00a74 for more traditional ingredients in our datamixes. 2.1   Executable repository images: building repositories at scale \\nA core prerequisite for capturing Python execution traces and agentic trajectories in real-world software engi- \\nneering tasks is executing code in repositories at scale. For isolation and repeatability, we build these repositories \\n   1See ai.meta.com\u002fresearch\u002fpublications\u002fcwm-preparedness and \\u00a78 for details. 2 \\n\u003c\u003c\u003c\"\n}"],["cc0962cd-835c-4d86-b219-ab2042ca8696","{\n  \"metadata\": {\n    \"chunk_file\": \"124.txt\",\n    \"chunk_number\": 124,\n    \"total_chars\": 1040,\n    \"processed_date\": \"2025-12-17T04:00:35.305850\",\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"As shown in Figure 14, a rollout consists of a sequence of iterative agent-environment interactions. Each environment implements two methods: \\n    \\u00b7 start: start a new episode by producing an initial state and an observation (prompt) based on a sample \\n     from the dataset. The state encapsulates the contents of the hidden environment along with any specific \\n     resources corresponding to the current episode. \\u00b7 step: takes an action (sequence of tokens) leading to a state transition. The new observation includes \\n     all information visible to the agent and necessary during training or inference, such as the latest action, \\n     observation, and reward. All interactions between the agent and the environment are token-based. In addition, the environment can \\nsuggest context switches to erase past history or restart from scratch, allowing multi-context trajectories. Our \\nenvironments adhere to a common trajectory format, which prescribes that a trajectory consists of a sequence \\nof messages, whose format is detailed in \\u00a7H.\"\n}"],["cc71b3ba-b835-43be-b075-c2ee2f0cab0a","{\n  \"metadata\": {\n    \"chunk_number\": 146,\n    \"total_chars\": 247,\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.314829\",\n    \"chunk_file\": \"146.txt\"\n  },\n  \"page_content\": \"harness when limiting tool use to bash commands only. As Table 5 shows, although resolve rates degrade when \\nusing different agents, tool implementations, or limiting tool choices, CWM provides robust and reasonable \\nperformance across all setups.\"\n}"],["ce590a87-0684-4fcd-bad5-57eb2042903f","{\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 272,\n    \"chunk_number\": 156,\n    \"chunk_file\": \"156.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.318829\"\n  },\n  \"page_content\": \"Constant             CWM                      Qwen3-32B           Llama-3-70B \\n                      T      Direct   COT   Reasoning    Direct COT     Reasoning   Direct COT \\n      pass@1         0.5      0.37    0.55     0.94       0.49   0.68     0.94       0.43    0.48\"\n}"],["ce5b82bc-59d6-44fc-9052-437916291488","{\n  \"metadata\": {\n    \"chunk_file\": \"225.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.344229\",\n    \"total_chars\": 526,\n    \"chunk_number\": 225,\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"Abhinav Rastogi, Albert Q Jiang, Andy Lo, Gabrielle Berrada, Guillaume Lample, Jason Rute, Joep Barmentlo, \\n  Karmesh Yadav, Kartik Khandelwal, Khyathi Raghavi Chandu, et al. Magistral. arXiv preprint ar Xiv:2506.10910, \\n  2025. David Rein, Betty Li Hou, Asa Cooper Stickland, Jackson Petty, Richard Yuanzhe Pang, Julien Dirani, Julian Michael, \\n  and Samuel R. Bowman. GPQA: A graduate-level google-proof q&a benchmark. CoRR, abs\u002f2311.12022, 2023. doi: \\n  10.48550\u002fARXIV.2311.12022. https:\u002f\u002fdoi.org\u002f10.48550\u002farXiv.2311.12022.\"\n}"],["cea04be2-2e14-4540-996a-0c3e67366f9b","{\n  \"page_content\": \"40 \\n\u003c\u003c\u003c\\f\\n\\nYuxiang Wei, Olivier Duchenne, Jade Copet, Quentin Carbonneaux, Lingming Zhang, Daniel Fried, Gabriel Synnaeve, \\n  Rishabh Singh, and Sida I. Wang. Swe-rl: Advancing Ilm reasoning via reinforcement learning on open software \\n  evolution. ar Xiv preprint ar Xiv: 2502.18449, 2025. Chunqiu Steven Xia, Yinlin Deng, Soren Dunn, and Lingming Zhang. Agentless: Demystifying Ilm-based software \\n  engineering agents. arXiv preprint, 2024. Wenhan Xiong, Jingyu Liu, Igor Molybog, Hejia Zhang, Prajjwal Bhargava, Rui Hou, Louis Martin, Rashi Rungta, \\n  Karthik Abinav Sankararaman, Barlas Oguz, et al. Effective long-context scaling of foundation models. ar Xiv \\n  preprint arXiv:2309.16039, 2023. An Yang, Anfeng Li, Baosong Yang, Beichen Zhang, Binyuan Hui, Bo Zheng, Bowen Yu, Chang Gao, Chengen Huang, \\n  Chenxu Lv, et al. Qwen3 technical report. arXiv preprint ar Xiv:2505.09388, 2025a.\",\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.348380\",\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 236,\n    \"total_chars\": 893,\n    \"chunk_file\": \"236.txt\"\n  }\n}"],["cef43084-f965-4ad8-8ab6-82f839d3e3c4","{\n  \"metadata\": {\n    \"chunk_number\": 114,\n    \"chunk_file\": \"114.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.302122\",\n    \"total_chars\": 602,\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"the challenging SWE subset and oversample it in a 4 : 1 ratio when plugins are used, and reverse this \\n     ratio when plugins are disabled. Competitive programming and SWE datasources are filtered to include \\n     instances with a solve rate in [0.1, 0.7] only in order to to maximize the learning signal. For math tasks, \\n     we enable Python tool calling for 2% of the total datamix. At 16 500 steps, we apply filtering based on solve rate with the [0.1, 0.7] interval to our math dataset \\n     as well. For SWE data, we create fine-grained subsets for each 0.1 solve-rate interval from (0.0, 0.7],\"\n}"],["cf24a39f-bc1b-420c-a6ca-5b856c109b8b","{\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.370851\",\n    \"chunk_number\": 299,\n    \"total_chars\": 43,\n    \"chunk_file\": \"299.txt\",\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"It predicts 1, instead of the true value 0.\"\n}"],["cfd8ee67-7964-44a4-a854-d046209f6f4b","{\n  \"metadata\": {\n    \"total_chars\": 1163,\n    \"chunk_number\": 339,\n    \"chunk_file\": \"339.txt\",\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.384460\"\n  },\n  \"page_content\": \"\\u00b7 \u003c |eot_id|\u003e          end of chat message. Trace prediction tokens are designed for predicting program execution traces and may be enabled when \\nencoding user-controllable input to expose CWM's trace prediction functionality. They include tokens for \\nframe delimiting, action separation, function return\u002fcall, next line, exception, and argument separation, as \\nwell as a sentinel token for the start of the source code context for trace prediction (see below). \\u00b7 \u003c | frame_sep|\u003e (128100): start of trace sentinel, end of execution step. 55 \\n\u003c\u003c\u003c\\f\\n\\n   \\u00b7 \u003c |action_sep |\u003e         start of source code line. \\u00b7 \u003c | return_sep|\u003e         execution step: return from function scope. \\u00b7 \u003c | call_sep|\u003e (128103): execution step: enter function scope. \\u00b7 \u003c | line_sep|\u003e         execution step: next line. \\u00b7 \u003c |exception_sep|\u003e          execution step: exception. \\u00b7 \u003c | arg_sep|\u003e (128106): separator for return and exception values. . \u003c | trace_context_start |\u003e        start of source code context for trace prediction. Chat format. A chat is structured as a list of messages, each with the following format: \\n \u003c| start_header_id|\u003e$ROLE\u003c| end_header_id|\u003e \\n\\n $CONTENT\u003c| eot_id|\u003e\"\n}"],["d051f73d-71c9-4a9c-b3e8-722565afa02d","{\n  \"page_content\": \"Parallelism. We support various kinds of parallelism on both trainer and worker nodes. Trainers operate \\nlargely as in pretraining (see \\u00a74.2), supporting FSDP and TP. Worker nodes are grouped with TP to perform \\nbatched inference. Whereas all trainer GPUs are synchronized, the worker groups\u002fmodel replicas operate \\nasynchronously from each other and from the trainers. Model transfer. For efficient model transfers, we use our custom PyTorch distributed backend, moodist9 (Mella, \\n2025). It implements efficient queues that transfer data directly between GPU and CPU memory via InfiniBand \\nboth within the same compute node and between different nodes. This facilitates transferring model weights \\ndirectly from the trainer's GPU memory to the worker's CPU memory. With FSDP, each trainer has a shard \\nof the model weights. These shards must be concatenated and sent to the workers. Model transfer consists of \\nthree stages: \\n   1. Each trainer sends their local shard from GPU memory to the CPU memory of a single worker. 2. The workers perform a distributed concatenation similar to an all-gather, such that each worker ends up \\n     with all model weights. 3.\",\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.307397\",\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 128,\n    \"chunk_file\": \"128.txt\",\n    \"total_chars\": 1163\n  }\n}"],["d08e846e-487f-4d4a-9f27-57a5d603e731","{\n  \"metadata\": {\n    \"total_chars\": 342,\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"112.txt\",\n    \"chunk_number\": 112,\n    \"processed_date\": \"2025-12-17T04:00:35.301342\"\n  },\n  \"page_content\": \"We sample 40 % of tasks from \\nsoftware engineering, 40 % from competitive programming, and 20 % from mathematics. Rehearsal batches \\nconstitute 1\u002f3 of the training data and are integrated with a standard negative log likelihood loss, scaled by a \\nfactor of 0.1 to match the gradient magnitudes obtained with GRPO (\\u00a75.2). Three-stage training.\"\n}"],["d0dd333b-fa0e-46ea-81d4-f812121acdfe","{\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.317856\",\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 153,\n    \"total_chars\": 1479,\n    \"chunk_file\": \"153.txt\"\n  },\n  \"page_content\": \"Follow previous paragraph, we present a detailed evaluation of the quality \\nof the execution traces predicted by CWM for validation sets of CruxEval and our function-level data. Concretely, we measure the fraction of generated traces that follow our format (Valid Trace Format) and the \\nobservation (action) exact match accuracy (Observation (Action) Exact Match), which measures the number \\nof observations (actions) exactly matching ground truth relative to the total number of observations (actions) \\nper execution trace. Our trace format specifies the state as a JSON dump of a dictionary containing the local \\nvariables. We report the fraction of state predictions matching this format (Valid JSON Format). Additionally, \\nKey (+Value) Match measures the average fraction of matching keys (and values) per state prediction. The results in Table 9 show that CWM adheres to the correct trace and observation format for all data \\nsources, achieving more than 99 % format matching across the board. CWM is able to accurately predict the \\nexecution trace as well as intermediate observations and actions, which is reflected in scores larger than 96 % \\nfor Observation\u002fAction Exact Match and larger than 97% in Key (+Value) Match. 7.4   Program termination prediction \\nThe question of whether a program terminates is a reasoning problem which goes beyond what can be shown \\nby considering individual finite traces as in CWM training: non-termination cannot be observed by executing\"\n}"],["d18b8826-8974-493d-a2d1-9de3866beee9","{\n  \"metadata\": {\n    \"chunk_file\": \"334.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.382612\",\n    \"total_chars\": 459,\n    \"chunk_number\": 334,\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"We use MinHash LSH to decontaminate all our prompts in our RL datasets against the following evaluation \\nbenchmarks: \\n     \\u00b7 Math reasoning: AIME 2024\u002f2025, HARP (Yue et al., 2024), GSM8K test (Cobbe et al., 2021), OmniMath \\n       (test) (Gao et al., 2025), Math500 (Hendrycks et al., 2021b). 54 \\n\u003c\u003c\u003c\\f\\n\\n   \\u00b7 Code generation: HumanEval (Chen et al., 2021), MBPP (valid\u002ftest) (Austin et al., 2021), LiveCodeBench \\n     (20240801-20250501) (Jain et al., 2025a).\"\n}"],["d2681b58-464d-4c8e-90f6-9ce3f14d5daf","{\n  \"metadata\": {\n    \"total_chars\": 605,\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"133.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.309701\",\n    \"chunk_number\": 133\n  },\n  \"page_content\": \"Next, we evaluate CWM and compare its performance against relevant baselines, focusing \\non coding and mathematical reasoning tasks. We consider agentic evaluation for coding tasks, together \\nwith additional computation-oriented evaluations covering (i) output prediction with execution traces and \\nreasoning, (ii) full execution trace prediction, (iii) program termination prediction, and (iv) prediction and \\ngeneration of algorithmic complexity. Finally, we evaluate CWM considering established benchmarks for \\ncompetitive programming, mathematical reasoning, non-reasoning evaluation, and long-context.\"\n}"],["d28ab39e-0eb0-484e-8f9c-e8e12d0c84e7","{\n  \"page_content\": \"Yunhao Tang, Kunhao Zheng, Gabriel Synnaeve, and R\\u00e9mi Munos. Optimizing language models for inference \\n  time objectives using reinforcement learning. CoRR, abs\u002f2503.19595, 2025. doi: 10.48550\u002fARXIV.2503.19595. https:\u002f\u002fdoi.org\u002f10.48550\u002farXiv.2503.19595. The Terminal-Bench Team. Terminal-bench: A benchmark for ai agents in terminal environments, Apr 2025. https:\u002f\u002fgithub.com\u002flaude-institute\u002fterminal-bench. Julien Vanegue, Jules Villard, Peter O'Hearn, and Azalea Raad. Non-termination proving: 100 million loc and beyond, \\n  2025. https:\u002f\u002farxiv.org\u002fabs\u002f2509.05293.\",\n  \"metadata\": {\n    \"chunk_number\": 232,\n    \"chunk_file\": \"232.txt\",\n    \"total_chars\": 566,\n    \"processed_date\": \"2025-12-17T04:00:35.346648\",\n    \"source\": \"CWM-Meta\"\n  }\n}"],["d43601b7-1456-4e2f-9350-acae4d7fa044","{\n  \"page_content\": \"We also generate tracing data for solutions to competitive programming \\nproblems. Concretely, we use Llama-3.1-70B-Instruct to generate Python solutions to training set problems in \\n CodeContests (Li et al., 2022), reusing the framework of Gehring et al. (2025).\",\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"22.txt\",\n    \"total_chars\": 262,\n    \"chunk_number\": 22,\n    \"processed_date\": \"2025-12-17T04:00:35.265064\"\n  }\n}"],["d4cb9238-ce94-4099-9aef-2227e386dea9","{\n  \"page_content\": \"After decontamination (see \\u00a7F), the final code RL dataset has 81 k prompts. 5.3.3 Agentic coding \\n The agentic coding environment combines the reasoning and tool use features of the SWE RL environment \\n (\\u00a75.3.1) with the competitive programming setup described in \\u00a75.3.2. The user prompt is customized for \\n solving competitive programming tasks and explicitly asks the agent to write and run tests to check and \\n improve the solution, as illustrated in Figure 11. Different from SWE RL, there is no submit tool in this \\n   6https: \u002f\u002fgithub.com\u002fserega\u002fgaoya \\n\\n                                                  17 \\n\u003c\u003c\u003c\\f\\n\\n ... work on the following competitive programming question and provide a {lang} solution: \u003c question\u003e {question} \u003c\u002fquestion\u003e \\n Your final response should (1) summarize your approach ... and (2) wrap your final code solution in a markdown code block, like: \\n [summary here ] \\n\\n [your ... final solution here]\",\n  \"metadata\": {\n    \"chunk_file\": \"102.txt\",\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 928,\n    \"processed_date\": \"2025-12-17T04:00:35.297347\",\n    \"chunk_number\": 102\n  }\n}"],["d59cec7e-d586-40d6-9e5a-652ca14de0b9","{\n  \"page_content\": \"So the steps are: ... \u003c \u002fthink\u003e \\n                                                                                                    Reasoning \\n      High-quality reasoning agent traces    \u003ctool: bash\u003e \\n                                             grep -n \\\"_Keys(\\\" hydra\u002f_internal\u002finstantiate\u002f_instantiate2.py \\n                                             \u003c\u002ftool\u003e                                                   Tool call \\n\\nFigure 9 SWE RL self-bootstrapping. Starting from a pre-RL checkpoint, we iteratively perform RL, rejection-sample \\nhigh-quality reasoning traces, and feed them back into SFT.\",\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"93.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.293387\",\n    \"chunk_number\": 93,\n    \"total_chars\": 601\n  }\n}"],["d5b47eaf-31d4-46fa-9488-88837758b317","{\n  \"page_content\": \"Table 1 Statistics of ForagerAgent trajectories. We gather 3 M trajectories from 10.2 k images and 3.15 k underlying \\nrepositories. The trajectories are split 55-45 between issue- and mutate-fix tasks. Repos   Images Trajectories   Issues-Fix                         Mutate-Fix \\n                                             Functions Arguments     Variables Statements   Operators \\n   3.15k   10.2k       3M           55% \\n                                                7%          9 %        6%          11 %        12 %\",\n  \"metadata\": {\n    \"chunk_file\": \"28.txt\",\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 28,\n    \"processed_date\": \"2025-12-17T04:00:35.267966\",\n    \"total_chars\": 522\n  }\n}"],["d748e44e-16c8-49cf-8788-8e7ac0fd7286","{\n  \"page_content\": \"System \\n                 You are a helpful Al assistant. You always reason before responding, using the following format: \\n                 \u003cthink\u003e \\n                 [your internal reasoning] \\n                 \u003c\u002fthink\u003e \\n                 [your external response] \\n                 {optional tool calling instructions} \\n\\n                 User                      User \\n                 {math problem}            Provide a {language} solution for the following competitive \\n                                           programming question: {code problem}. Wrap your final answer in Your code should be enclosed in triple backticks like so: \\n                 $\\\\boxed{}$. {language} YOUR CODE HERE Use the backticks for \\n                                           your code only. Assistant \\n                 \u003cthink\u003e \\n\\n Figure 10 Prompt template for math (left path) and competitive programming (right path) RL tasks. delimited by \u003cthink\u003e ...\u003c \u002fthink\u003e in clear-text. The user prompt specifies the programming language and \\n instructs the agent to put the code solution inside a markdown block. Reward.\",\n  \"metadata\": {\n    \"chunk_number\": 99,\n    \"total_chars\": 1095,\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.296057\",\n    \"chunk_file\": \"99.txt\"\n  }\n}"],["d7c7e081-f855-4e96-aa2e-5e7ab2061e46","{\n  \"page_content\": \"BPE tokens are sorted by merge order where large \\n      id corresponds to rare tokens. Generating such tokens suggests that the model is generating at high \\n      entropy and over-weighing rare tokens.\",\n  \"metadata\": {\n    \"chunk_file\": \"78.txt\",\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.286589\",\n    \"total_chars\": 201,\n    \"chunk_number\": 78\n  }\n}"],["d9b5bd2b-ca66-40d7-aaac-f56d0dc26c50","{\n  \"page_content\": \"Datamix. We train on a diverse mix of internal and open-access data during SFT, including standard \\ninstruction-following datasets. About 30% of the datamix is rehearsal from mid-training (which itself includes \\n30 % pre-training data). This is to avoid overfitting to the SFT distribution ahead of RL and retain CWM \\ncapabilities taught in mid-training. Our datamix also contains agentic SWE RL trajectories (see \\u00a75.3.1), some of \\nwhich have been rejection-sampled from earlier iterations of the CWM itself. We have generally found it useful \\nto iteratively improve the starting point for RL by including trajectories from earlier iterations in the next SFT. Similarly, we include external datasets with reasoning traces, as we have found the performance benefit from \\nthem carries through to our final post-RL model. Specifically, we use the OpenMathReasoning (Moshkov et al., \\n2025) and OpenCodeReasoning (Ahmad et al., 2025) datasets that rely on DeepSeek-R1 (Guo et al., 2025). Reasoning tokens. For SFT training on reasoning data, we introduce \u003c| reasoning_thinking_start |\u003e and \\n\u003c| reasoning_thinking_end |\u003e tokens that surround any reasoning text. Because we mask the loss on all \\n\u003c| reasoning_thinking_start |\u003e tokens, the model does not learn to generate them. This enables both \\nreasoning and non-reasoning behavior for the CWM-SFT model: non-reasoning mode is active by default and \\nreasoning mode can be activated by injecting \u003c| reasoning_thinking_start |\u003e into the beginning of assistant\",\n  \"metadata\": {\n    \"chunk_file\": \"71.txt\",\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.284167\",\n    \"total_chars\": 1502,\n    \"chunk_number\": 71\n  }\n}"],["da82dfae-85df-4ded-9075-707258faf882","{\n  \"metadata\": {\n    \"chunk_number\": 266,\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.359845\",\n    \"chunk_file\": \"266.txt\",\n    \"total_chars\": 1548\n  },\n  \"page_content\": \"def prepare_value(self, value): \\n     if value is None: \\n        return None \\n     if isinstance(value, str): \\n        return value \\n     return self.encoder.dumps(value) \\n\\n Here, self.encoder.dumps(value) is used. If the encoder is the default JSONEncoder, it would still use ASCII encoding. However, the encoder for JSONField can be customized, but the \\n default might not set ensure_ascii=False. To ensure that the form field displays Unicode characters correctly, maybe this should also be modified to include ensure_ascii=False, but \\n since the encoder is part of the field's configuration, it might be better to handle it there. Alternatively, maybe the display_for_field function in the admin should handle JSONField \\n values differently, but that might be more complex. Given the information, the most straightforward fix seems to be modifying the get_prep_value method in \\n django\u002fdb\u002fmodels\u002ffields\u002fjson.py to include ensure_ascii=False in the json. dumps call. This would affect how JSON data is displayed in the admin, as that's where get_prep_value is called. Let me proceed with that change and see if it resolves the issue. \u003ctool: edit\u003e \\n django\u002fdb\u002fmodels\u002ffields\u002fjson.py \\n \u003c\u003c\u003c\u003c\u003c\u003c\u003c SEARCH \\n     def get_prep_value(self, value): \\n        if value is None: \\n            return value \\n        return json. dumps(value, cls=self.encoder) \\n ======= \\n     def get_prep_value(self, value): \\n        if value is None: \\n            return value \\n        return json. dumps(value, cls=self.encoder, ensure_ascii=False) \\n \u003e\u003e\u003e\u003e\u003e\u003e\u003e REPLACE \\n \u003c\u002ftool\u003e\"\n}"],["db1767b5-1eac-4372-a349-d34f3384d890","{\n  \"metadata\": {\n    \"chunk_file\": \"96.txt\",\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 878,\n    \"chunk_number\": 96,\n    \"processed_date\": \"2025-12-17T04:00:35.294654\"\n  },\n  \"page_content\": \"All \\ntraining data are decontaminated against SWE-bench Verified at repository-level granularity, see \\u00a7F. We estimate the difficulty of each instance using the pass@1 score from CWM SFT, calculated over at least \\n32 samples. Instances with a pass@1 above 95% are filtered out as easy, while those with a non-zero pass@1 \\nare included in the primary dataset. Instances with a 0% pass@1 are placed in a secondary dataset that is \\nsampled less frequently at the beginning. To make these hard problems solvable, we augment their prompts \\nby adding the hidden test as a hint. This augmentation increases the pass@1 rate from 0% to approximately \\n30%. Later in training, we remove hints from hard instances so the model learns to solve them from scratch. Finally, this process yields 12.6 k unique training instances: 6.9 k in the primary set and 5.7k in the secondary. 5.3.2   Coding\"\n}"],["dc094a3f-7cae-4254-b262-9846f1bd0481","{\n  \"page_content\": \"Baptiste Roziere, Jonas Gehring, Fabian Gloeckle, Sten Sootla, Itai Gat, Xiaoqing Ellen Tan, Yossi Adi, Jingyu Liu, \\n  Romain Sauvestre, Tal Remez, et al. Code llama: Open foundation models for code. ar Xiv preprint ar Xiv:2308.12950, \\n  2023. Nuno Saavedra, Andr\\u00e9 Silva, and Martin Monperrus. Gitbug-actions: Building reproducible bug-fix benchmarks with \\n  github actions. In Proceedings of the 2024 IEEE\u002fACM 46th International Conference on Software Engineering: \\n  Companion Proceedings, ICSE-Companion '24, page 1-5, New York, NY, USA, 2024.\",\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.344692\",\n    \"total_chars\": 546,\n    \"chunk_number\": 226,\n    \"chunk_file\": \"226.txt\",\n    \"source\": \"CWM-Meta\"\n  }\n}"],["dc18ad75-5029-4afb-b9d4-46954f258a61","{\n  \"page_content\": \"[your ... final solution here] \\n\\n  ... follow these steps: 1) Reason about the problem and write an initial solution using \u003ctool: create\u003e. 2) Write tests for your solution using \\n \u003ctool: create\u003e or \u003ctool: edit\u003e ... 3) Compile your code (if applicable) and run the tests using \u003ctool: bash\u003e. 4) If any tests fail, analyze why the \\n solution is incorrect. Use \u003ctool: edit\u003e to fix the issues ... 5) Iterate over the above steps until you are confident that your solution is correct ... 6) Provide a final response that satisfies the required response format ... \u003cthink\u003e ... \u003ctool: create\u003e ... ... \u003cthink\u003e     \u003ctool: bash\u003e python ... ... \u003cthink\u003e .. \u003ctool: edit\u003e    ... \u003cthink\u003e     ... ... ... \u003cthink\u003e ... let's summarize the ... \u003c \u002fthink\u003e ** Summary and Approach ** The problem requires ... ** Final Solution ** python ... Figure 11 Example interaction for the agentic coding RL environment. The agent uses reasoning and tools to solve \\ncompetitive programming problems. Before generating a final solution, the agent summarizes the interaction. environment.\",\n  \"metadata\": {\n    \"chunk_file\": \"103.txt\",\n    \"chunk_number\": 103,\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 1052,\n    \"processed_date\": \"2025-12-17T04:00:35.297863\"\n  }\n}"],["dd790099-7361-492e-806c-db78da9cff81","{\n  \"metadata\": {\n    \"chunk_number\": 45,\n    \"processed_date\": \"2025-12-17T04:00:35.273967\",\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"45.txt\",\n    \"total_chars\": 516\n  },\n  \"page_content\": \"For each code execution step: \\n - Begin with \u003c|frame_sep|\u003e followed by the event token which can be \u003c|call_sep|\u003e, \u003c|line_sep|\u003e, \u003c|return_sep|\u003e or \u003c|exception_sep|\u003e. - After \u003c|call_sep|\u003e or \u003c|line_sep|\u003e put the local variable states as dictionary in JSON format followed by the \u003c|action_sep|\u003e token and the current source code line. - After \u003c|return_sep|\u003e, \u003c|exception_sep|\u003e directly put the \u003c|action_sep|\u003e token and the current source code line followed by an \u003c|arg_sep|\u003e token and the return or exception arguments.\"\n}"],["dd981ad7-afac-4f76-8099-7a97db305833","{\n  \"metadata\": {\n    \"total_chars\": 118,\n    \"chunk_file\": \"343.txt\",\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 343,\n    \"processed_date\": \"2025-12-17T04:00:35.386591\"\n  },\n  \"page_content\": \"and $VALUE for return and exception frames is also a JSON-encoded string \\nrepresentation. I Formal mathematics datamix\"\n}"],["e0e8844d-065d-424d-86f8-70d6a125d35f","{\n  \"page_content\": \"Data and RL environment mix. Worker nodes produce trajectories from three main data sources: software \\nengineering, competitive programming, and mathematics. They use the four RL environments we describe in \\nthe previous sections, which we refer to as agentic SWE (\\u00a75.3.1), code (\\u00a75.3.2), agentic coding (\\u00a75.3.3), and \\nmath (\\u00a75.3.4). Each data source may contain multiple datasets from different origins; however, all datasets \\nwithin the same data source share a consistent format and problem domain.\",\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.300982\",\n    \"chunk_number\": 111,\n    \"chunk_file\": \"111.txt\",\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 501\n  }\n}"],["e364af64-0ff4-418f-8aef-a471641c1ff6","{\n  \"page_content\": \"We \\nrefer to SE for further detail. Recent LLMs are trained beyond data-optimal regimes (Dubey et al., 2024) to optimize inference costs and \\nproduce smaller yet capable models. Gadre et al.\",\n  \"metadata\": {\n    \"total_chars\": 190,\n    \"processed_date\": \"2025-12-17T04:00:35.282526\",\n    \"chunk_number\": 67,\n    \"chunk_file\": \"67.txt\",\n    \"source\": \"CWM-Meta\"\n  }\n}"],["e36e35bf-279c-438f-afa8-916f5e3ebe99","{\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.305136\",\n    \"total_chars\": 897,\n    \"chunk_number\": 122,\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"122.txt\"\n  },\n  \"page_content\": \"We implemented \\nthis optimization by-hand for the matrix multiplication needed to compute w. grad during the backward pass \\n(sharded along the reduction dimension), as there is no defacto support in PyTorch. fp8 with tensor parallelism. When TP is enabled, we adapted our fp8 recipe to further improve performance. We use \\\"sub-row-wise\\\" scaling where appropriate to align quantization boundaries with TP shards, which both \\navoids communication and improves accuracy. We perform all-gathers in fp8, which improves throughput and \\nalso enables fusing quantization into previous kernels (e.g., LayerNorm). During the backward pass, however, \\nwe sometimes all-gather the same data twice (once in fp8 and once in bf16, since it will be consumed by two \\nseparate matmuls, one for each dtype). Because of Async-TP, however, this adds zero overhead and enables \\nfusing quantization into previous kernels.\"\n}"],["e3ab59e6-8ed1-4a59-ab00-54a31928133c","{\n  \"metadata\": {\n    \"chunk_file\": \"209.txt\",\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 442,\n    \"chunk_number\": 209,\n    \"processed_date\": \"2025-12-17T04:00:35.337345\"\n  },\n  \"page_content\": \"Jared Kaplan, Sam McCandlish, Tom Henighan, Tom B Brown, Benjamin Chess, Rewon Child, Scott Gray, Alec \\n  Radford, Jeffrey Wu, and Dario Amodei. Scaling laws for neural language models. ar Xiv preprint ar Xiv:2001.08361, \\n  20 ry minute, a triple of 3 new pigs arrives on the convention floor.\",\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.372634\",\n    \"chunk_file\": \"304.txt\",\n    \"total_chars\": 69,\n    \"chunk_number\": 304\n  }\n}"],["ec1814c1-abfd-47ee-a851-cd5996fc3140","{\n  \"metadata\": {\n    \"chunk_number\": 242,\n    \"chunk_file\": \"242.txt\",\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 144,\n    \"processed_date\": \"2025-12-17T04:00:35.350575\"\n  },\n  \"page_content\": \"cc\u002fpaper_files\u002fpaper\u002f2023\u002fhash\u002f91f18a1287b398d378ef22505bf41832-Abstract-Datasets_and_Benchmarks.html. 41 \\n\u003c\u003c\u003c\\f\\n\\nAppendix \\n\\nA    Acknowledgments\"\n}"],["ec6acf5b-92a5-42d5-baab-9ea148e7854e","{\n  \"metadata\": {\n    \"chunk_number\": 328,\n    \"processed_date\": \"2025-12-17T04:00:35.380753\",\n    \"total_chars\": 1221,\n    \"chunk_file\": \"328.txt\",\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"multiple early exit strategies to terminate the pipeline as soon as a built-environment state has been captured, \\nprogress has stalled, or a timeout is reached. We modify each GitHub Actions workflow to probe for available test frameworks by checking if a list of \\npredefined frameworks are executable when the workflow is running. For each detected framework, the pipeline \\ncaptures the corresponding build environment and executes container ID capture logic that is equivalent to \\nthe Python-specific pytest capture process, detailed below. The pipeline modifies (or adds) conftest.py pytest configuration files to each test directory in Python \\nrepositories. A session-scoped fixture is automatically injected during pytest execution to capture the build \\nstate of containers running unit tests. This fixture detects the ID of the container running unit tests for the \\ndocker commit of the repository's current build state. The environment capture process further preserves \\nthe container's build state by writing-out bash environment variables and creating archives of the mounted \\nrepository code and hosted toolcache dependencies to the container's file-system for later restoration via a \\nDocker entrypoint script.\"\n}"],["edfda5ee-0ef6-42a7-b3e4-99cdcbd2d924","{\n  \"metadata\": {\n    \"chunk_number\": 82,\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"82.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.288639\",\n    \"total_chars\": 1032\n  },\n  \"page_content\": \"single terminal reward signal per rollout. In the remainder of this section, we describe the specification of \\nenvironment, i.e., prompt and observation design, reward function, and the corresponding datasets. During reasoning RL, we discontinue the use of SFT reasoning tokens and replace them with clear-text \u003cthink\u003e \\n\u003c\u002fthink\u003e tags. Early RL experiments on top of the SFT model showed long initial reasoning traces and slow \\nimprovements. We attribute this to our SFT reasoning data, which enhances reasoning performance but limits \\nexploration during RL training. Switching out reasoning tags resulted in shorter responses, higher starting \\nentropies, and significantly improved final performance. This suggests our approach leads to a best-of-both \\nworlds scenario: the model's familiarity with reasoning responses from SFT enables rapid improvements early \\non in RL, while the introduction of the new tokens allows the model to develop its own reasoning that is \\nguided - but not restricted - by the SFT data. 5.3.1 Agentic SWE\"\n}"],["ee9b2dea-e042-45ca-ada6-28b4f714690d","{\n  \"page_content\": \"We gather math questions and answers from publicly available sources. To remove \\nduplicates, we use the MinHash LSH algorithm to identify similar problems and verify that they have the \\nsame answer using our verifier. We also filter out problems that were solved correctly in all attempts (32 out \\nof 32) by our SFT model in non-reasoning mode.\",\n  \"metadata\": {\n    \"chunk_number\": 107,\n    \"source\": \"CWM-Meta\",\n    \"chunk_file\": \"107.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.299378\",\n    \"total_chars\": 344\n  }\n}"],["eecba3ff-0695-40b6-ab7b-907e36f2d168","{\n  \"metadata\": {\n    \"chunk_number\": 143,\n    \"chunk_file\": \"143.txt\",\n    \"source\": \"CWM-Meta\",\n    \"total_chars\": 258,\n    \"processed_date\": \"2025-12-17T04:00:35.313754\"\n  },\n  \"page_content\": \"Figure 17 (a) Test time scaling (TTS) with both our best@k method majority voting can significantly increase pass@1 \\nrates for CWM on SWE-bench Verified. (b) Accuracy of CWM on Aider Polyglot by programming language using \\nthe whole file edit format. 25 \\n\u003c\u003c\u003c\"\n}"],["f1536f37-b2cd-4e89-aeed-1d4ff36a21e1","{\n  \"metadata\": {\n    \"processed_date\": \"2025-12-17T04:00:35.270770\",\n    \"total_chars\": 310,\n    \"chunk_file\": \"35.txt\",\n    \"chunk_number\": 35,\n    \"source\": \"CWM-Meta\"\n  },\n  \"page_content\": \"Hmm, wait maybe I'm misunderstanding the problem ... \u003ctool: create\u003e \\n \u002fcode\u002fsolution.cpp \\n #include \u003cbits\u002fstdc++.h\u003e \\n using namespace std; \\n\\n bool is_evenly_separated(const string& s) { \\n     unordered_map\u003cchar, int\u003e prev_index; \\n     ... \u003c\u002ftool\u003e \\n\\n File created successfully at: \u002fcode\u002fsolution.cpp (35 lines).\"\n}"],["f20449a4-0b51-4522-a377-30ccb763bb49","{\n  \"page_content\": \"Post-processing. To avoid overfitting to repetitive interactions, we apply a near-deduplication of trajectories \\nforaged from the same source repository: we first represent a trajectory by the concatenation of its actions, \\nthen encode the trajectory using MinHash, and lastly drop trajectories such that the pairwise Jaccard similarity \\nfor all encoded trajectories we keep is less than 0.5. Because our goal with the ForagerAgent data is to learn \\na comprehensive world model of agentic interactions with code environments, we do not filter trajectories \\nbased on whether they succeed at bug or issue resolution. Following the same motivation, we further train \\nthe model to predict both agent and environment turns, although we stochastically mask loss for 50 % of \\nobservations as they exhibit limited diversity. Overall, we are left with 3 M trajectories obtained from 10.2k \\nimages, and we refer to Table 1 for more detailed statistics. 3    Examples of code world modeling\",\n  \"metadata\": {\n    \"chunk_file\": \"30.txt\",\n    \"total_chars\": 979,\n    \"processed_date\": \"2025-12-17T04:00:35.269105\",\n    \"chunk_number\": 30,\n    \"source\": \"CWM-Meta\"\n  }\n}"],["f237cc89-fd7f-462d-bdf8-69b83995bc16","{\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"processed_date\": \"2025-12-17T04:00:35.358268\",\n    \"chunk_file\": \"262.txt\",\n    \"chunk_number\": 262,\n    \"total_chars\": 229\n  },\n  \"page_content\": \"Figure B.20        Example final turns in SWE RL, with details like budget notices omitted for brevity. The agent verifies \\n\\nthat the patch does not break existing functionality, submits the patch, and produces a summary. 45 \\n\u003c\u003c\u003c\"\n}"],["f27d4901-02fe-4401-abff-96597776e4bc","{\n  \"metadata\": {\n    \"source\": \"CWM-Meta\",\n    \"chunk_number\": 57,\n    \"total_chars\": 1444,\n    \"chunk_file\": \"57.txt\",\n    \"processed_date\": \"2025-12-17T04:00:35.278682\"\n  },\n  \"page_content\": \"We train the model with the AdamW optimizer (Loshchilov and Hutter, 2019) \\nwith 31 = 0.9, 32 = 0.95, weight decay of 0.1, and gradient clipping at norm 1.0. After 2000 steps of linear \\n\\n                                                                    Training \\n\\n                                   Pre-training      Mid-training                 Post-training (SFT) \\n     Output Proj (128k vocab size) T   T T   T        T T   T T   T T T   T        P |T   |T |TA T TA
